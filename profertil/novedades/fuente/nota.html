<style>
/* ==========================================================================
   Nota Profertil: la plantilla de una nota de Novedades.
   Sobria, sin cabecera de color: título a la izquierda con la etiqueta del tipo y,
   abajo, tres columnas: el índice de secciones, la foto principal entera (sin
   recorte) con radio, y fecha, tiempo de lectura, compartir y modo lectura. Sigue el texto y cierra con tres relacionadas. Cierra con la nota anterior y
   la siguiente, las relacionadas y el pie.
   Los datos son una copia fija del sitio actual: ../notas/<nota>.json.
   ========================================================================== */
/* Sin sombras: las cajas se separan del fondo por el color. */
:root { color-scheme: light; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--texto-cuerpo); line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; }
a { color: inherit; }
button, a { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--celeste); outline-offset: 2px; }
.pf-wrap { width: min(100% - 32px, 1320px); margin-inline: auto; }
.pf-flecha { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* --- Barra: la pieza "barra" de base.css, azul desde arriba (la nota va sobre el fondo).
   Abajo, una línea tiza que se llena con la lectura. */
.pf-barra__menu > a { text-decoration: none; }
.pf-barra--solida { box-shadow: none; }
.pf-barra__busca { text-decoration: none; }
.pf-progreso { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; }
.pf-progreso i { display: block; height: 100%; background: var(--tiza); transform: scaleX(var(--p, 0)); transform-origin: left; }

/* --- Grilla de tres columnas: índice, nota y datos.
   Fila 1 el título (de lado a lado), fila 2 la foto con el índice y los datos a los costados, fila 3 el texto. */
.pf-n-col { width: min(100% - 32px, 1120px); margin-inline: auto; }
.pf-n-grilla { width: min(100% - 32px, 1268px); margin-inline: auto; display: grid; grid-template-columns: 220px minmax(0, 700px) 220px; justify-content: center; gap: 0 64px; padding-top: calc(140px + env(safe-area-inset-top, 0px)); }

/* --- Cabecera: centrada, sin caja. La etiqueta completa (forma, rótulo y año) va solo junto al título. */
.pf-n-cab { grid-column: 2 / -1; grid-row: 1; }
.pf-n-in { display: grid; gap: 18px; justify-items: start; max-width: 900px; }
.pf-n-volver { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: var(--texto-chico); text-decoration: none; transition: color 200ms ease; }
@media (hover: hover) and (pointer: fine) { .pf-n-volver:hover { color: var(--azul); } }
.pf-n-in .pf-etiqueta { --s: var(--etq-m); margin-top: 14px; }
.pf-n-in .pf-etiqueta__rotulo { outline: 1px solid var(--line); outline-offset: -1px; }
.pf-n-ante { margin: 0 0 -6px; font: 500 var(--texto-destacado)/1.3 var(--f-display); color: var(--ink-2); max-width: 60ch; }
.pf-n-in h1 { margin: 0; font: 600 clamp(36px, 4.4vw, 60px)/1.02 var(--f-display); letter-spacing: -0.035em; color: var(--azul); text-wrap: balance; overflow-wrap: break-word; }
.pf-n-in h1.pf-largo { font-size: clamp(30px, 3.4vw, 44px); line-height: 1.06; }
.pf-n-bajada { margin: 0; max-width: 60ch; font-size: var(--texto-destacado); line-height: 1.5; color: var(--ink-2); }

/* --- Foto principal: entera, sin recorte, con radio. Una foto chica no se estira más de 1,5 veces. */
.pf-n-foto { grid-column: 2; grid-row: 2; margin: 56px auto 0; width: min(100%, var(--ancho-foto, 100%)); }
.pf-n-foto__hoja { overflow: hidden; border-radius: var(--radio-media); background: var(--card); line-height: 0; }
.pf-n-foto img { display: block; width: 100%; height: auto; opacity: 0; transition: opacity 600ms ease; }
.pf-n-foto img.pf-lista { opacity: 1; }

/* --- Datos, a la derecha de la foto: rótulo y valor por fila. */
.pf-n-datos { grid-column: 3; grid-row: 2; align-self: start; margin: 56px 0 0; display: grid; justify-items: start; gap: 14px; font-size: var(--texto-chico); }
.pf-n-fecha { margin: 0; color: var(--ink-2); white-space: nowrap; }
.pf-n-fecha__corta { display: none; }
/* Minutos de lectura y modo lectura, pegados y en azul. */
.pf-n-par { display: flex; gap: 4px; }
.pf-n-tiempo { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 9px; border-radius: 999px; background: var(--azul); color: var(--tiza); font-size: var(--texto-mini); font-variant-numeric: tabular-nums; }
.pf-n-tiempo svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pf-n-compartir { display: flex; gap: 6px; }
.pf-n-compartir > *, .pf-n-foco { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink-2); cursor: pointer; text-decoration: none; transition: color 200ms ease, border-color 200ms ease, background 200ms ease; }
@media (hover: hover) and (pointer: fine) { .pf-n-compartir > *:hover { color: var(--azul); border-color: var(--azul); } }
.pf-n-compartir svg, .pf-n-foco svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pf-n-compartir svg.pf-relleno { fill: currentColor; stroke: none; }
/* Modo lectura: botón chico, solo el ícono. */
.pf-n-foco { border: 0; background: var(--azul); color: var(--tiza); }
.pf-n-foco svg { width: 17px; height: 17px; stroke-width: 1.8; }
@media (hover: hover) and (pointer: fine) { .pf-n-foco:hover { background: var(--ink); } }

/* --- Texto ------------------------------------------------------------------ */
.pf-n-texto { grid-column: 2; grid-row: 3; margin-top: 56px; min-width: 0; font-size: var(--texto-destacado); line-height: 1.68; color: var(--ink); overflow-wrap: break-word; }
.pf-n-texto > :first-child { margin-top: 0; }
.pf-n-texto p { margin: 0 0 1.1em; }
.pf-n-texto h2, .pf-n-texto h3, .pf-n-texto h4 { margin: 1.9em 0 .6em; font-family: var(--f-display); font-weight: 600; color: var(--azul); letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; scroll-margin-top: 110px; }
.pf-n-texto h2 { font-size: calc(var(--texto-subtitulo) * 1.3); }
.pf-n-texto h3 { font-size: calc(var(--texto-subtitulo) * 1.15); }
.pf-n-texto h4 { font-size: var(--texto-subtitulo); }
.pf-n-texto :is(h2, h3, h4) strong { font-weight: inherit; }
.pf-n-texto strong { font-weight: 600; }
.pf-n-texto a { color: var(--azul); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--celeste) 60%, transparent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; transition: text-decoration-color 200ms ease; }
@media (hover: hover) and (pointer: fine) { .pf-n-texto a:hover { text-decoration-color: var(--azul); } }
.pf-n-texto ul, .pf-n-texto ol { margin: 0 0 1.2em; padding-left: 1.3em; }
.pf-n-texto li { margin: .35em 0; padding-left: .2em; }
.pf-n-texto li::marker { color: var(--verde); font-weight: 600; }
.pf-n-texto blockquote { margin: 1.6em 0; padding: 4px 0 4px 24px; border-left: 3px solid var(--verde); font: 500 calc(var(--texto-subtitulo) * 1.05)/1.35 var(--f-display); letter-spacing: -0.015em; color: var(--azul); }
.pf-n-texto figure { margin: 2em 0; }
.pf-n-texto figure img { display: block; width: auto; max-width: 100%; height: auto; border-radius: var(--radio-media); background: var(--card); }
.pf-n-texto figcaption { margin-top: 10px; font-size: var(--texto-chico); line-height: 1.45; color: var(--ink-3); }
.pf-n-texto .video iframe { display: block; width: 100%; aspect-ratio: 16 / 9; height: auto; border: 0; border-radius: var(--radio-media); background: var(--ink); }
.pf-n-tabla { margin: 1.6em 0; overflow-x: auto; }
.pf-n-tabla table { width: 100%; border-collapse: collapse; font-size: var(--texto-chico); line-height: 1.45; }
.pf-n-tabla :is(td, th) { padding: 12px 16px 12px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.pf-n-tabla th { font-weight: 600; color: var(--azul); }
.pf-n-vacio { color: var(--ink-3); }

/* Sin foto, el texto sube a la fila de los costados. */
.pf-n-grilla:not(.pf-con-foto) .pf-n-texto { grid-row: 2; }

/* --- Índice, a la izquierda: las secciones, fijo al bajar. Solo si la nota tiene dos subtítulos o más. */
.pf-n-indice { grid-column: 1; grid-row: 2 / span 2; align-self: start; position: sticky; top: 112px; margin-top: 56px; font-size: var(--texto-chico); }
.pf-n-indice ol { position: relative; margin: 0; padding: 0 0 0 18px; list-style: none; display: grid; gap: 10px; }
.pf-n-indice a { display: block; color: var(--ink-3); line-height: 1.35; text-decoration: none; transition: color 200ms ease, translate var(--punto-dura, 320ms) var(--punto-curva, var(--ease)); }
.pf-n-indice a.pf-on { color: var(--azul); translate: 4px 0; }
@media (hover: hover) and (pointer: fine) { .pf-n-indice a:hover { color: var(--azul); translate: 4px 0; } }
/* El punto azul viaja con un resorte hasta la sección que se está leyendo (el mismo de la librería). */
.pf-n-indice__punto { position: absolute; left: 0; top: 0; width: 7px; height: 7px; border-radius: 999px; background: var(--azul); translate: 0 var(--y, 0px); transition: translate var(--punto-dura, 420ms) var(--punto-curva, var(--ease)); }
@media (prefers-reduced-motion: reduce) { .pf-n-indice a, .pf-n-indice__punto { transition: none; } }

/* Modo lectura. */

body.pf-foco :is(.pf-barra, .pf-n-indice, .pf-n-datos, .pf-n-sigue, .pf-pie, .pf-n-volver) { display: none; }
body.pf-foco .pf-n-grilla { grid-template-columns: minmax(0, 700px); padding-top: 96px; }
body.pf-foco :is(.pf-n-cab, .pf-n-foto, .pf-n-texto) { grid-column: 1; }
body.pf-foco .pf-n-texto { padding-bottom: 160px; }
.pf-n-salir { position: fixed; top: calc(20px + env(safe-area-inset-top, 0px)); right: 20px; z-index: 60; display: inline-flex; align-items: center; gap: 10px; height: 38px; padding: 0 8px 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--ink-2); font-size: var(--texto-chico); cursor: pointer; transition: color 200ms ease, border-color 200ms ease; }
.pf-n-salir kbd { padding: 3px 7px; border-radius: 999px; background: var(--card); font: inherit; font-size: var(--texto-mini); color: var(--ink-3); }
@media (hover: hover) and (pointer: fine) { .pf-n-salir:hover { color: var(--azul); border-color: var(--azul); } }
@media (hover: none) { .pf-n-salir kbd { display: none; } }
.pf-aviso { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60; transform: translate(-50%, 16px); padding: 12px 18px; border-radius: 999px; background: var(--ink); color: var(--tiza); font-size: var(--texto-chico); opacity: 0; pointer-events: none; transition: opacity 220ms ease, transform 320ms var(--ease); }
.pf-aviso.pf-on { opacity: 1; transform: translate(-50%, 0); }

/* --- Relacionadas: tres tarjetas y nada más. */
.pf-n-sigue { margin-top: 128px; }
.pf-n-rel__cab { margin-bottom: 24px; }
.pf-n-rel__cab h2 { margin: 0; font: 600 var(--texto-subtitulo)/1.1 var(--f-display); letter-spacing: -0.02em; color: var(--azul); }
.pf-n-rel__fila { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }

/* Tarjeta: miniatura cuadrada (foto de la nota o el arte de Novedades), etiqueta y título. */
.pf-n-mini { display: grid; gap: 14px; align-content: start; text-decoration: none; }
.pf-n-mini__img { position: relative; aspect-ratio: 1; border-radius: var(--radio-media); overflow: hidden; background: var(--card); line-height: 0; transition: transform 320ms var(--ease); }
.pf-n-mini__img > :is(img, svg) { width: 100%; height: 100%; object-fit: cover; display: block; }
/* La etiqueta va adentro de la imagen, arriba a la izquierda, como en las tarjetas de Novedades. */
.pf-n-mini__img .pf-etiqueta { position: absolute; top: 10px; left: 10px; max-width: calc(100% - 20px); }
.pf-n-mini__img .pf-etiqueta__rotulo { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pf-n-mini b { font: 600 1.36rem/1.1 var(--f-display); letter-spacing: -0.025em; color: var(--azul); text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
@media (hover: hover) and (pointer: fine) { .pf-n-mini:hover .pf-n-mini__img { transform: translateY(-3px); } }
.pf-n-mini:active .pf-n-mini__img { transform: scale(.985); }

.pf-pie { margin-top: 120px; }

/* --- Pantallas medianas y celular: una columna; el índice se va y los temas pasan abajo del texto. */
@media (max-width: 1100px) {
  .pf-n-grilla { grid-template-columns: minmax(0, 700px); }
  .pf-n-cab, .pf-n-foto, .pf-n-datos, .pf-n-texto { grid-column: 1; }
  .pf-n-datos { grid-row: 3; margin-top: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  .pf-n-texto { grid-row: 4; margin-top: 40px; }
  .pf-n-grilla:not(.pf-con-foto) .pf-n-datos { grid-row: 2; }
  .pf-n-grilla:not(.pf-con-foto) .pf-n-texto { grid-row: 3; }
  .pf-n-indice { display: none; }
  .pf-n-datos { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .pf-n-compartir { margin: 0 0 0 auto; }
}
@media (max-width: 640px) {
  .pf-n-grilla { padding-top: calc(108px + env(safe-area-inset-top, 0px)); }
  .pf-n-in { gap: 14px; }
  .pf-n-in .pf-etiqueta { margin-top: 10px; }
  .pf-n-in h1 { font-size: 2.1rem; }
  .pf-n-in h1.pf-largo { font-size: 1.7rem; }
  .pf-n-foto { margin-top: 28px; }
  .pf-n-texto { font-size: 17px; line-height: 1.62; }
  .pf-n-sigue { margin-top: 80px; }
  /* Relacionadas en una fila que se desliza, con encastre en cada tarjeta. */
  .pf-n-rel__fila { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; overscroll-behavior-x: contain; }
  .pf-n-rel__fila::-webkit-scrollbar { display: none; }
  .pf-n-mini { flex: 0 0 76%; scroll-snap-align: start; gap: 12px; }
  .pf-n-mini__img .pf-etiqueta { top: 8px; left: 8px; --s: var(--etq-s); }
  .pf-n-mini b { font-size: 1.15rem; }
  /* Fecha, minutos, modo lectura y compartir en una sola línea. */
  .pf-n-datos { flex-wrap: nowrap; gap: 6px; font-size: var(--texto-mini); }
  .pf-n-fecha { margin-right: 4px; }
  .pf-n-fecha__larga { display: none; }
  .pf-n-fecha__corta { display: inline; }
  .pf-n-par, .pf-n-compartir { gap: 4px; }
  .pf-n-tiempo { height: 30px; padding: 0 10px 0 8px; gap: 5px; }
  .pf-n-compartir > *, .pf-n-foco { width: 30px; height: 30px; }
  .pf-n-compartir svg { width: 14px; height: 14px; }
  .pf-n-foco svg { width: 16px; height: 16px; }
  .pf-pie { margin-top: 80px; }
}
/*__PIE_CSS__*/
</style>

<script>
(function () {
  "use strict";
  var NOTAS = /*__NOTAS__*/[];
  var A = /*__ASSETS__*/{};
  function $(id) { return document.getElementById(id); }

/*__COMUN__*/

  var FLECHA_IZQ = '<svg class="pf-flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 12H7M11 8l-4 4 4 4"/></svg>';

  // Qué nota: ?n=<archivo>. Sin parámetro, la más reciente.
  var pedida = new URLSearchParams(location.search).get("n");
  var n = NOTAS.filter(function (x) { return x.ar === pedida; })[0] || NOTAS[NOTAS.length - 1];

  function url(x) { return "./?n=" + encodeURIComponent(x.ar); }
  function lectura(w) { return Math.max(1, Math.round(w / 200)) + " min de lectura"; }
  var ICO_CAL = A.iconos && A.iconos.calendario ? '<svg viewBox="' + A.iconos.calendario.vb + '" aria-hidden="true">' + A.iconos.calendario.d + "</svg>" : "";

  function cabecera(d) {
    var h = '<a class="pf-n-volver" href="../">' + FLECHA_IZQ + "Novedades</a>";
    h += etq(n.tp, { dato: n.anio });
    if (d.ante) h += '<p class="pf-n-ante">' + esc(d.ante) + "</p>";
    h += "<h1" + (n.t.length > 80 ? ' class="pf-largo"' : "") + ">" + esc(n.t) + "</h1>";
    if (d.b) h += '<p class="pf-n-bajada">' + esc(d.b) + "</p>";
    $("pf-cabIn").innerHTML = h;
    document.title = n.t + " · Novedades Profertil";
  }

  function foto(d) {
    var src = d.imgG || d.img;
    if (!src) return;
    var fig = $("pf-foto"), img = new Image();
    $("pf-grilla").classList.add("pf-con-foto");
    img.alt = ""; img.decoding = "async"; img.fetchPriority = "high";
    $("pf-fotoHoja").appendChild(img);
    fig.hidden = false;
    img.addEventListener("load", function () {
      // Una foto chica no se estira más de 1,5 veces su tamaño.
      fig.style.setProperty("--ancho-foto", Math.round(img.naturalWidth * 1.5) + "px");
      img.classList.add("pf-lista");
    });
    img.addEventListener("error", function () { fig.hidden = true; $("pf-grilla").classList.remove("pf-con-foto"); });
    img.src = src;
  }

  function baseFoto(u) { return (u || "").split("/").pop().toLowerCase().replace(/\.(jpe?g|png|webp|gif)$/, "").replace(/(-\d+x\d+|-scaled|-e\d{9,})+$/, ""); }
  function cuerpo(d) {
    var t = $("pf-texto");
    if (!d.cuerpo) { t.innerHTML = '<p class="pf-n-vacio">Esta nota no tiene texto en el sitio actual.</p>'; return; }
    t.innerHTML = d.cuerpo;
    // La foto de la cabecera no se repite en el cuerpo (en cualquier tamaño: -800x450, -scaled...).
    var arriba = baseFoto(d.imgG || d.img);
    [].forEach.call(t.querySelectorAll("figure img"), function (im) { if (arriba && baseFoto(im.getAttribute("src")) === arriba) im.closest("figure").remove(); });
    [].forEach.call(t.querySelectorAll("table"), function (tb) { var w = document.createElement("div"); w.className = "pf-n-tabla"; tb.parentNode.insertBefore(w, tb); w.appendChild(tb); });
    // Si una foto del cuerpo ya no existe en el sitio actual, sale.
    [].forEach.call(t.querySelectorAll("figure img"), function (im) { im.addEventListener("error", function () { var f = im.closest("figure"); if (f) f.remove(); }); });
  }

  // Datos, a la derecha de la foto: rótulo y valor por fila.
  var RELOJ = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
  var OJO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>';
  function datos(d) {
    // Sin rótulos: la fecha, el tiempo de lectura en un chip, compartir y el modo lectura.
    var h = '<p class="pf-n-fecha"><span class="pf-n-fecha__larga">' + fecha(n.f, true) + '</span><span class="pf-n-fecha__corta">' + fecha(n.f) + "</span></p>" +
      '<div class="pf-n-par"><span class="pf-n-tiempo">' + RELOJ + Math.max(1, Math.round(n.w / 200)) + " min</span>" +
      '<button class="pf-n-foco" type="button" id="pf-foco" aria-pressed="false" aria-label="Modo lectura" title="Modo lectura">' + OJO + "</button></div>";
    var aqui = encodeURIComponent(location.href), ttl = encodeURIComponent(n.t);
    h += '<div class="pf-n-compartir">' +
      '<button type="button" id="pf-copiar" aria-label="Copiar el link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>' +
      '<a href="https://api.whatsapp.com/send?text=' + ttl + "%20" + aqui + '" target="_blank" rel="noopener" aria-label="Compartir por WhatsApp"><svg class="pf-relleno" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a9.5 9.5 0 0 0-8.2 14.3L2.5 21.5l4.8-1.3A9.5 9.5 0 1 0 12 2.5Zm0 17.2c-1.5 0-2.9-.4-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A7.7 7.7 0 1 1 12 19.7Zm4.3-5.8c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.3 6.3 0 0 1-3.1-2.7c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.7-1.7c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6 11.2 11.2 0 0 0 4.3 3.8c1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.5-.3Z"/></svg></a>' +
      '<a href="https://www.linkedin.com/sharing/share-offsite/?url=' + aqui + '" target="_blank" rel="noopener" aria-label="Compartir en LinkedIn"><svg class="pf-relleno" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.3 8.6h3v10.1h-3V8.6Zm1.5-4.9a1.8 1.8 0 1 1 0 3.5 1.8 1.8 0 0 1 0-3.5Zm3.4 4.9h2.9v1.4c.4-.8 1.4-1.6 2.9-1.6 3.1 0 3.7 2 3.7 4.7v5.6h-3v-5c0-1.2 0-2.7-1.6-2.7s-1.9 1.3-1.9 2.6v5.1h-3V8.6Z"/></svg></a>' +
      '<a href="mailto:?subject=' + ttl + "&body=" + aqui + '" aria-label="Compartir por mail"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="3"/><path d="m4.5 7.5 7.5 5.5 7.5-5.5"/></svg></a>' +
      "</div>";
    $("pf-datos").innerHTML = h;
    $("pf-foco").addEventListener("click", function () { foco(!document.body.classList.contains("pf-foco")); });
    $("pf-copiar").addEventListener("click", function () {
      var ok = function () { avisar("Link copiado"); };
      if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(ok, function () { avisar("No se pudo copiar"); });
      else avisar("No se pudo copiar");
    });
  }
  // Curva del punto: un resorte apenas subamortiguado (pasa un poquito y vuelve), muestreado como linear().
  (function () {
    if (!CSS.supports || !CSS.supports("transition-timing-function", "linear(0, 1)")) return;
    var k = 230, c = 25, x = 0, v = 0, dt = 1 / 1000, pts = [], t = 0;
    while (t < 2) {
      for (var i = 0; i < 16; i++) { v += (-k * (x - 1) - c * v) * dt; x += v * dt; t += dt; }
      pts.push(x.toFixed(4));
      if (Math.abs(x - 1) < .0015 && Math.abs(v) < .02) break;
    }
    pts[pts.length - 1] = "1";
    var raiz = document.documentElement.style;
    raiz.setProperty("--punto-curva", "linear(0, " + pts.join(", ") + ")");
    raiz.setProperty("--punto-dura", Math.round(t * 1000) + "ms");
  })();

  // Índice, a la izquierda: solo si la nota tiene dos subtítulos o más.
  var titulos = [];
  function indice() {
    // En el sitio actual muchos h4 no son subtítulos: firmas ("Por ..."), fuentes o la primera frase en negrita.
    titulos = [].slice.call($("pf-texto").querySelectorAll("h2, h3, h4")).filter(function (t) {
      var x = t.textContent.trim();
      return x.length > 3 && x.length <= 80 && !/^(por|fuente|prensa|foto)\b/i.test(x) && !/\.(com|ar)\b/i.test(x);
    });
    if (titulos.length < 2) { titulos = []; return; }
    $("pf-indice").innerHTML = "<ol>" + titulos.map(function (t, i) {
      t.id = "pf-s" + (i + 1);
      return '<li><a href="#' + t.id + '">' + esc(t.textContent) + "</a></li>";
    }).join("") + '</ol>';
    $("pf-indice").firstChild.insertAdjacentHTML("afterbegin", '<span class="pf-n-indice__punto" aria-hidden="true"></span>');
    $("pf-indice").hidden = false;
    // Al tocar una sección, baja suave hasta ella.
    $("pf-indice").addEventListener("click", function (e) {
      var a = e.target.closest("a"); if (!a) return;
      var t = document.getElementById(a.hash.slice(1)); if (!t) return;
      e.preventDefault();
      t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      history.replaceState(null, "", a.hash);
    });
  }

  // Modo lectura: quedan el título, la foto y el texto. Se sale con el mismo botón, el de arriba o Esc.
  function foco(on) {
    var y = $("pf-texto").getBoundingClientRect().top;
    document.body.classList.toggle("pf-foco", on);
    $("pf-foco").setAttribute("aria-pressed", on);
    $("pf-focoSalir").hidden = !on;
    // Mantiene el punto de lectura al cambiar.
    window.scrollBy(0, $("pf-texto").getBoundingClientRect().top - y);
  }
  $("pf-focoSalir").addEventListener("click", function () { foco(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && document.body.classList.contains("pf-foco")) foco(false); });

  var ta;
  function avisar(txt) { var a = $("pf-aviso"); a.textContent = txt; a.classList.add("pf-on"); clearTimeout(ta); ta = setTimeout(function () { a.classList.remove("pf-on"); }, 2000); }

  // Tarjeta chica: la foto de la nota o, si no tiene, el arte de Novedades; etiqueta con el año y título.
  function mini(x) {
    var img = x.imgL ? "../" + x.imgL : x.img;
    var m = img ? '<img src="' + esc(img) + '" alt="" loading="lazy" decoding="async">' : arte(x, 180, 120, x.id * 7919 + 13);
    return '<a class="pf-n-mini" href="' + url(x) + '"><div class="pf-n-mini__img">' + m + etq(x.tp, { dato: x.anio }) + "</div><b>" + esc(x.t) + "</b></a>";
  }

  // Relacionadas: comparten temas de WordPress, cultivo, pilar o tipo; a igual puntaje, la más cercana en el tiempo.
  function relacionadas() {
    var et = n.et || [];
    var t0 = Date.parse(n.f || "2000-01-01");
    return NOTAS.filter(function (x) { return x !== n; }).map(function (x) {
      var s = 0;
      (x.et || []).forEach(function (e) { if (et.indexOf(e) !== -1) s += 3; });
      x.c.forEach(function (c) { if (n.c.indexOf(c) !== -1) s += 2; });
      x.p.forEach(function (p) { if (n.p.indexOf(p) !== -1) s += 1; });
      if (x.tp === n.tp) s += 1.5;
      return { x: x, s: s - Math.abs(Date.parse(x.f || "2000-01-01") - t0) / 3.15e11 };
    }).sort(function (a, b) { return b.s - a.s; }).slice(0, 3).map(function (r) { return r.x; });
  }

  function seguir() {
    $("pf-rel").innerHTML = relacionadas().map(mini).join("");
  }

  // La barra toma el azul al terminar la cabecera; la línea de abajo sigue la lectura del cuerpo.
  function alScroll() {
    var t = $("pf-texto"), ini = t.offsetTop - window.innerHeight * 0.4, fin = t.offsetTop + t.offsetHeight - window.innerHeight * 0.6;
    $("pf-progreso").style.setProperty("--p", Math.min(1, Math.max(0, (window.scrollY - ini) / Math.max(1, fin - ini))).toFixed(4));
  }
  function marcar() {
    if (!titulos.length) return;
    var act = 0;
    titulos.forEach(function (t, i) { if (t.getBoundingClientRect().top < 160) act = i; });
    var links = $("pf-indice").querySelectorAll("a");
    [].forEach.call(links, function (a, i) { a.classList.toggle("pf-on", i === act); });
    // El punto se centra en la primera línea del ítem activo.
    var a = links[act], ol = a.closest("ol");
    ol.style.setProperty("--y", Math.round(a.getBoundingClientRect().top - ol.getBoundingClientRect().top + parseFloat(getComputedStyle(a).lineHeight) / 2 - 3.5) + "px");
  }
  window.addEventListener("scroll", function () { alScroll(); marcar(); }, { passive: true });
  window.addEventListener("resize", alScroll);

  var base = { ante: "", b: n.b, lg: n.lg, img: n.img, imgG: n.imgG, et: n.et };
  cabecera(base); seguir(); alScroll();
  fetch("../notas/" + encodeURIComponent(n.ar) + ".json")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { cabecera(d); datos(d); foto(d); cuerpo(d); indice(); })
    .catch(function () { datos(base); foto(base); $("pf-texto").innerHTML = '<p class="pf-n-vacio">No se pudo cargar el texto de esta nota.</p>'; })
    .then(function () { $("pf-nota").removeAttribute("aria-busy"); alScroll(); marcar(); });
})();
</script>
