<title>Novedades Profertil</title>
<meta name="description" content="Maqueta del archivo de notas de profertil.com.ar sobre el concepto web del manual de marca: las 471 notas reales del sitio actual, con buscador y filtros.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Novedades Profertil: maqueta del archivo de notas.
   Layout: barra fija con logo, menu y la lupa que se expande en buscador;
   carrusel a pantalla completa con las cinco notas destacadas; grilla
   masonry de tarjetas y panel de filtros flotante (categoria y año).
   Paleta, pares de color, formas e iconos son los oficiales del manual de
   marca y de las herramientas del sistema. Un solo tema, a proposito: el
   manual define la web sobre tiza y no tiene version oscura.
   ========================================================================== */
:root {
  color-scheme: light;
  /* Tokens del sistema: los genera build.py desde tokens.json, que se
     exporta de las variables del Figma Master. No escribir valores aca:
     se cambian en Figma. */
  /*__TOKENS__*/

  --shadow: 0 1px 2px rgba(10, 30, 74, 0.06), 0 12px 28px -16px rgba(10, 30, 74, 0.28);
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, monospace;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--celeste); outline-offset: 2px; }
.wrap { width: min(100% - 32px, 1320px); margin-inline: auto; }
.ico { display: block; width: 100%; height: 100%; }

/* --- Barra superior fija ---------------------------------------------------
   Logo, menu y lupa. Arriba de la foto es transparente; al bajar toma el azul.
   La busqueda vive en la lupa: se expande hacia la izquierda y tapa el menu,
   asi la navegacion y el buscador no compiten. Abierta, en el lugar de la
   lupa aparece un boton circular igual con la X: se cierra donde se abrio. */
.top { position: fixed; inset: 0 0 auto; z-index: 50; padding-top: env(safe-area-inset-top, 0px); transition: background 260ms ease, box-shadow 260ms ease; }
.top.solid { background: var(--barra); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 30px -18px rgba(0, 20, 60, 0.7); }
.nav { position: relative; display: flex; align-items: center; gap: 14px; height: 76px; padding-right: 58px; transition: height 260ms var(--ease); }
.nav .menu, .nav .menu-mobile { margin-left: auto; margin-right: auto; }
.logo { display: block; flex: none; color: var(--tiza); fill: currentColor; line-height: 0; }
.logo svg { width: 74px; height: auto; aspect-ratio: 1458 / 1021; transition: width 260ms var(--ease); }
.menu {
  display: flex; gap: 2px; padding: 7px;
  border-radius: 999px;
  background: rgba(255, 254, 239, 0.14);
  border: 1px solid rgba(255, 254, 239, 0.22);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: opacity 220ms ease;
}
.menu span { padding: 7px 14px; border-radius: 999px; font-size: 0.82rem; white-space: nowrap; color: rgba(255, 254, 239, 0.9); }
.menu span[aria-current] { background: var(--tiza); color: var(--azul); font-weight: 500; }
.menu-mobile { display: none; align-items: center; gap: 8px; padding: 8px 14px; color: var(--tiza); transition: opacity 220ms ease; }
.menu-mobile i { display: grid; grid-template-columns: repeat(2, 7px); gap: 3px; }
.menu-mobile i b { width: 7px; height: 7px; border-radius: 999px; border: 1.5px solid currentColor; }
.nav.buscando .menu, .nav.buscando .menu-mobile { opacity: 0; pointer-events: none; }

.busca {
  position: absolute; right: 0; top: 50%; transform: translateY(-50%);
  display: flex; align-items: center;
  width: 48px; height: 48px;
  border-radius: 999px;
  background: rgba(255, 254, 239, 0.16);
  border: 1px solid rgba(255, 254, 239, 0.24);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  overflow: hidden;
  transition: width var(--t-buscador) var(--ease), right var(--t-buscador) var(--ease), background 220ms ease, border-color 220ms ease;
}
.busca.open { right: 56px; width: min(480px, calc(100% - 152px)); background: var(--tiza); border-color: #fff; box-shadow: var(--shadow); }
.busca-x {
  position: absolute; right: 0; top: 50%; transform: translateY(-50%) scale(0.6);
  width: 48px; height: 48px; padding: 0;
  border-radius: 999px;
  background: rgba(255, 254, 239, 0.16);
  border: 1px solid rgba(255, 254, 239, 0.24);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  color: var(--tiza); cursor: pointer;
  display: grid; place-items: center;
  opacity: 0; visibility: hidden;
  transition: opacity 200ms ease, transform var(--t-buscador) var(--ease), background 200ms ease, color 200ms ease, visibility 0s linear var(--t-buscador);
}
.busca-x svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.busca-x:hover { background: var(--tiza); color: var(--azul); }
.nav.buscando .busca-x { opacity: 1; visibility: visible; transform: translateY(-50%); transition: opacity 220ms ease 120ms, transform var(--t-buscador) var(--ease), background 200ms ease, color 200ms ease; }
.lupa { width: 46px; height: 46px; flex: none; border: 0; border-radius: 999px; background: transparent; color: var(--tiza); cursor: pointer; display: grid; place-items: center; }
.busca.open .lupa { color: var(--azul); }
.lupa svg { width: 20px; height: 20px; }
.busca input {
  flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
  font-family: var(--f-display); font-size: 1.04rem; color: var(--ink); padding: 0 4px;
  opacity: 0; transition: opacity 200ms ease;
}
.busca.open input { opacity: 1; }
.busca input::placeholder { color: var(--ink-3); }
.busca input::-webkit-search-cancel-button { display: none; }
.busca:not(.open) .q-count { display: none; }
.q-count { flex: none; margin-right: 5px; padding: 6px 10px; border-radius: 999px; background: #fff; color: var(--ink-2); font-size: 0.8rem; font-variant-numeric: tabular-nums; }

/* --- Destacadas: carrusel a pantalla completa ---------------------------
   Las cinco notas mas recientes (o las de DESTACADAS, si se cargan), una por
   pantalla, como en el archivo de waabi.ai/insights y como las stories: la
   barra de la nota se llena y al terminar entra la siguiente deslizandose de
   costado. Tocar a la derecha pasa, a la izquierda vuelve, mantener apretado
   pausa y en touch la placa sigue al dedo. Se frena tambien con el foco del
   teclado, fuera de vista o con la nota abierta.
   Cada placa es la foto de la nota recortada como una hoja (dos esquinas
   opuestas redondeadas) entre dos Flores del sistema enormes, una detras y
   otra delante: el mismo lenguaje que las piezas de redes (Figma Master,
   Header de noticias · con foto). Las tres capas se mueven lento y a distinta
   velocidad (parallax); ver "Profundidad" en el JS. */
.dest {
  position: relative; overflow: hidden;
  height: 100vh; height: 100svh; min-height: 540px;
  background: var(--azul); color: var(--tiza);
  touch-action: pan-y;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
/* La posicion de cada placa la maneja el JS (translateX); aca solo cual se ve. */
.d-slide { position: absolute; inset: 0; visibility: hidden; transform: translateX(100%); will-change: transform; }
.d-slide.vis { visibility: visible; }
.d-slide.on { z-index: 1; }
.d-slide { overflow: hidden; background: var(--fondo); }
.d-art { position: absolute; inset: 0; }
/* Escena: la caja de la foto. Las flores se ubican en unidades de su ancho
   (cqw), asi los arcos cruzan las mismas esquinas en cualquier pantalla. En
   desktop la foto va a la derecha y sangra por el borde. */
.d-esc { position: absolute; z-index: 1; top: 15.5%; bottom: 15.5%; right: -2.8vw; width: 50vw; container-type: size; }
.d-capa { position: absolute; display: block; height: auto; transform: translate3d(var(--x, 0px), var(--y, 0px), 0); will-change: transform; }
.d-capa svg { display: block; width: 100%; height: auto; }
.d-atras { --x: var(--a-x); --y: var(--a-y); width: 236cqw; left: 36cqw; top: -179cqw; color: var(--atras); }
.d-frente { --x: var(--f-x); --y: var(--f-y); z-index: 2; width: 181cqw; left: -76cqw; top: calc(100cqh - 9.7cqw); color: var(--frente); }
.d-foto { --x: var(--p-x); --y: var(--p-y); z-index: 1; inset: 0; overflow: hidden; border-radius: 0 37cqw 0 37cqw; background: rgba(255, 254, 239, 0.12); }
.d-foto img { display: block; width: 100%; height: 100%; object-fit: cover; transform: scale(1.1); transition: transform 9s linear, opacity 600ms ease; }
.d-foto img.carga { opacity: 0; }
.d-slide.on .d-foto img { transform: scale(1.02); }
.d-txt { position: absolute; z-index: 3; left: 0; right: 0; bottom: clamp(140px, 21vh, 200px); }
.d-in { display: grid; gap: 22px; justify-items: start; max-width: min(46vw, 680px); }
.d-kick { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 0.95rem; color: rgba(255, 254, 239, 0.88); }
.d-kick .etq { --s: var(--etq-l); }
.d-in h2 {
  margin: 0;
  font-family: var(--f-display); font-weight: 600;
  font-size: clamp(2.3rem, 5.4vw, 5.4rem); line-height: 0.94; letter-spacing: -0.04em;
  text-wrap: balance;
}
.d-bajada { margin: 0; max-width: 56ch; font-size: clamp(1rem, 1.4vw, 1.12rem); line-height: 1.5; color: rgba(255, 254, 239, 0.9); }
.d-cta {
  display: inline-flex; align-items: center; gap: 10px;
  height: var(--btn-l); padding: 0 22px 0 24px;
  border: 0; border-radius: 999px; cursor: pointer;
  background: var(--tiza); color: var(--azul);
  font-family: var(--f-display); font-size: 1.02rem; font-weight: 500;
  transition: background 200ms ease, color 200ms ease;
}
.d-cta:hover { background: #fff; }
.d-cta svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 260ms var(--ease); }
.d-cta:hover svg { transform: translateX(3px); }

/* Indicadores: una barra por nota, como en las stories: las anteriores
   llenas y la actual llenandose (las mueve el JS). Sin texto: el titulo ya
   esta en la placa. */
.d-nav { position: absolute; z-index: 2; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); }
.d-nav .wrap { display: flex; align-items: center; gap: 28px; }
.d-segs { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 16px; }
.d-seg { display: grid; padding: 14px 0; border: 0; background: transparent; cursor: pointer; text-align: left; color: rgba(255, 254, 239, 0.56); transition: color 240ms ease; }
.d-seg:hover, .d-seg.on { color: var(--tiza); }
.d-bar { display: block; height: 2px; border-radius: 2px; background: rgba(255, 254, 239, 0.26); overflow: hidden; }
.d-bar i { display: block; height: 100%; background: var(--tiza); transform: scaleX(0); transform-origin: left; }
.d-flechas { flex: none; display: flex; gap: 8px; }
.d-flecha {
  width: 46px; height: 46px; border-radius: 999px; cursor: pointer;
  border: 1px solid rgba(255, 254, 239, 0.3); background: rgba(255, 254, 239, 0.08); color: var(--tiza);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: grid; place-items: center; transition: background 200ms ease, color 200ms ease;
}
.d-flecha:hover { background: var(--tiza); color: var(--azul); }
.d-flecha svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* --- Resultado ------------------------------------------------------------ */
.result-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding-block: 22px 16px; }
.result-text { margin: 0; color: var(--ink-2); min-width: 0; }
.result-text b { color: var(--azul); font-weight: 600; font-variant-numeric: tabular-nums; }
.herramientas { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.seg { position: relative; isolation: isolate; display: inline-flex; padding: 3px; border-radius: 999px; background: var(--line); }
/* El elegido se marca con un indicador marfil que se desliza al boton tocado
   (lo ubica el JS). Al cambiar de vista lo mueve la View Transition, junto
   con las tarjetas; al cambiar el orden, esta transicion. */
.seg-ind {
  position: absolute; z-index: -1; top: 3px; left: 0; bottom: 3px; width: 0;
  border-radius: 999px; background: var(--card); box-shadow: 0 1px 3px rgba(10, 30, 74, 0.12);
  pointer-events: none;
  transition: transform var(--t-vista) var(--curva-vista), width var(--t-vista) var(--curva-vista);
}
.seg-ind.quieto { transition: none; }
.seg.vista .seg-ind { view-transition-name: ind-vista; }
/* Los botones tambien viajan como capa propia: si no, quedan en la foto de la
   pagina, que la View Transition pinta debajo del indicador, y el icono
   elegido se tapa mientras el indicador se mueve. */
.seg.vista [data-vista="chico"] { view-transition-name: vista-chico; }
.seg.vista [data-vista="medio"] { view-transition-name: vista-medio; }
.seg.vista [data-vista="grande"] { view-transition-name: vista-grande; }

/* --- Vista: tres tamaños de tarjeta (chico, medio, grande), un ícono cada
   uno, con el mismo estilo que el orden. El cambio se anima con View
   Transitions donde hay. En mobile no hay "chico". */
.seg.vista button { display: grid; place-items: center; padding: 6px 11px; }
.seg.vista svg { width: 15px; height: 15px; fill: currentColor; }
@media (max-width: 640px) { .seg.vista [data-vista="chico"] { display: none; } }
::view-transition-group(*) { animation-duration: var(--t-vista); animation-timing-function: var(--curva-vista); }
.seg button { border: 0; background: transparent; cursor: pointer; padding: 6px 13px; border-radius: 999px; font-size: 0.86rem; color: var(--ink-2); transition: color 240ms ease; }
.seg button[aria-pressed="true"] { color: var(--azul); font-weight: 500; }

/* --- Grilla --------------------------------------------------------------- */
.grid { display: flex; gap: 16px; align-items: flex-start; padding-bottom: 170px; }
.gcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.sentinel { height: 1px; }

.card {
  position: relative; display: grid; text-align: left;
  border: 0; padding: 0; cursor: pointer;
  background: var(--card);
  border-radius: 26px;
  box-shadow: var(--shadow);
  transition: transform 320ms var(--ease), box-shadow 320ms var(--ease);
  animation: entra 420ms var(--ease) both;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 1px 2px rgba(10, 30, 74, 0.06), 0 18px 34px -16px rgba(10, 30, 74, 0.34); }
@keyframes entra { from { transform: translateY(8px); } to { transform: none; } }

.media { position: relative; margin: 8px 8px 0; border-radius: 19px; overflow: hidden; line-height: 0; max-width: 100%; }
.media > svg { display: block; width: 100%; height: auto; }
.media .etq { position: absolute; top: 10px; left: 10px; }
.play { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 999px; background: rgba(255, 254, 239, 0.94); display: grid; place-items: center; }
.play svg { width: 12px; height: 12px; fill: var(--azul); margin-left: 2px; }

.lead { padding: 18px 18px 2px; display: grid; gap: 14px; justify-items: start; }
.lead h3 {
  margin: 0;
  font-family: var(--f-display); font-weight: 600;
  font-size: 1.36rem; line-height: 1.06; letter-spacing: -0.025em;
  color: var(--azul);
  text-wrap: balance;
}
.meta { padding: 12px 18px 18px; display: grid; gap: 8px; min-width: 0; }
.when { margin: 0; font-size: 0.84rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.when b { font-weight: 500; color: var(--ink-2); }
.ttl {
  margin: 0;
  font-family: var(--f-display); font-weight: 500;
  font-size: 1.1rem; line-height: 1.2; letter-spacing: -0.015em;
  color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
mark { background: rgba(234, 186, 44, 0.42); color: inherit; border-radius: 3px; padding: 0 1px; }
.tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
.more { font-size: 0.86rem; color: var(--ink-3); padding-left: 2px; }

/* --- Etiqueta: componente `Etiqueta` del Figma Master (manual p. 64) -------
   Badge (forma del sistema sobre el color de la familia) + rotulo blanco con
   el texto en el color de la familia + dato y flecha opcionales. Radio = 32%
   del alto (p. 66) y texto al 44% del alto, como en los tamanos S/M/L. */
.etq { --s: var(--etq-m); display: inline-flex; align-items: stretch; gap: calc(var(--s) * 0.06); height: var(--s); flex: none; font-family: var(--f-display); font-weight: 400; }
.etq .bd { width: var(--s); height: var(--s); flex: none; display: block; }
.etq .lb, .etq .dt, .etq .fl {
  display: inline-flex; align-items: center;
  padding: 0 calc(var(--s) * 0.36);
  border-radius: calc(var(--s) * 0.32);
  font-size: calc(var(--s) * 0.48);
  line-height: 1; white-space: nowrap;
}
.etq .lb { background: #fff; color: var(--tx); }
/* El dato (año) va en marfil sobre el color: el color de la familia sobre su
   complementario contrastaba poco. Mismo cambio en Uso/Dato tinta del master. */
.etq .dt { background: var(--fo); color: var(--tiza); font-variant-numeric: tabular-nums; }
.etq .fl { width: var(--s); padding: 0; justify-content: center; background: #fff; color: var(--tx); }
.etq .fl svg { width: 46%; height: 46%; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
button.etq { border: 0; padding: 0; background: transparent; cursor: pointer; color: inherit; }
button.etq .lb { transition: background 160ms ease, color 160ms ease; }
button.etq:hover .lb { box-shadow: inset 0 0 0 1.5px var(--tx); }
button.etq[aria-pressed="true"] .lb { background: var(--tx); color: #fff; }
a.etq { text-decoration: none; }
a.etq:hover .fl { background: var(--tx); color: #fff; }
.media .etq .lb, .m-art .etq .lb { box-shadow: none; }
.etq .corto { display: none; }
/* La etiqueta nunca se sale de la tarjeta: la tarjeta es contenedor y, si es
   angosta, la etiqueta pasa al nombre corto y suelta el año. Si aun asi no
   entra, el rotulo se corta con puntos suspensivos. */
.card { container-type: inline-size; }
.card .etq { max-width: 100%; }
.card .media .etq { max-width: calc(100% - 20px); }
.card .etq .lb { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.card .etq .lb > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Tarjetas anchas (vista con pocas columnas): la tipografia crece. */
@container (min-width: 420px) {
  .lead { padding: 26px 26px 4px; gap: 18px; }
  .lead h3 { font-size: 2.1rem; line-height: 1.02; }
  .meta { padding: 14px 18px 22px; }
  .ttl { font-size: 1.55rem; line-height: 1.12; -webkit-line-clamp: 3; }
  .when { font-size: 0.92rem; }
  .etq { --s: var(--etq-l); }
  .media .etq { top: 14px; left: 14px; }
}
@container (max-width: 250px) {
  .etq .full { display: none; }
  .etq .corto { display: inline; }
  .etq .dt { display: none; }
}

/* --- Pastilla principal de la barra: full rounded, relleno con el color de
   la familia del tipo y texto tiza. El azul oscuro queda reservado para la
   activa (sin aro); "Todas" sin elegir es transparente. */
.lbl {
  --h: 30px;
  display: inline-flex; align-items: center; flex: none;
  height: var(--h); padding: 0 calc(var(--h) * 0.48);
  border: 0; border-radius: 999px;
  background: var(--pc, var(--azul)); color: var(--tiza);
  font-family: var(--f-display); font-size: calc(var(--h) * 0.47); font-weight: 400;
  white-space: nowrap; cursor: pointer;
  transition: background 240ms var(--ease), color 240ms var(--ease);
}
.lbl:hover { background: color-mix(in srgb, var(--pc, var(--azul)) 86%, var(--ink)); }
.lbl[aria-pressed="true"] { background: var(--ink); color: var(--tiza); }
.lbl-todas { background: transparent; color: var(--ink); }
.lbl-todas:hover { background: var(--line); }

/* --- Subcategoria (cultivo): relleno del color, texto tiza. Sin badge
   ni flecha, para no competir con la etiqueta principal de la nota. */
.sub {
  --h: 22px;
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  height: var(--h); padding: 0 calc(var(--h) * 0.42);
  border: 0; border-radius: calc(var(--h) * 0.32);
  background: var(--c); color: var(--tiza);
  font-family: var(--f-body); font-size: calc(var(--h) * 0.5); font-weight: 500; line-height: 1;
  white-space: nowrap;
}
button.sub { cursor: pointer; transition: background 160ms ease, color 160ms ease; }
.f-body .sub { --h: 32px; background: color-mix(in srgb, var(--c) 16%, #fff); color: var(--c); }
.f-body .sub:hover { background: color-mix(in srgb, var(--c) 28%, #fff); }
.f-body .sub[aria-pressed="true"] { background: var(--c); color: var(--tiza); }

/* --- Panel de filtros: barra fija full rounded con "Todas" y las tres

  z-index: 40;

  border-bottom: 1px solid transparent;
  visibility: hidden; opacity: 0;

    new IntersectionObserver(function (en) { if (en[0].isIntersecting && pintadas < lista.length) pintarTanda(); }, { rootMargin: "900px 0px" }).observe($("sentinel"));
  } else { TANDA = 1000; }
  var nCols = cuantasCols();
  window.addEventListener("resize", function () { moverInds(); var n = cuantasCols(); if (n !== nCols) { nCols = n; repintar(true); } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moverInds);
  document.querySelector(".seg.vista").addEventListener("click", function (e) {
    var b = e.target.closest("[data-vista]"); if (!b || b.dataset.vista === vista) return;
    vista = b.dataset.vista;
    try { localStorage.setItem("novedades-vista", vista); } catch (err) {}
    var n = cuantasCols(), cambia = n !== nCols;
    nCols = n;
    // Las tarjetas viajan a su lugar nuevo (View Transitions) y el indicador
    // viaja con ellas; sin soporte, el indicador se desliza y la grilla cambia directo.
    if (cambia && document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(function () { marcarVista(false); repintar(true); });
    else { marcarVista(true); if (cambia) repintar(true); }
  });
  // En mobile no hay chico: si estaba elegido, se ve como medio.
  if (vista === "chico" && matchMedia("(max-width: 640px)").matches) vista = "medio";
  marcarVista(false);
  moverInds();

  /* --- Detalle ---------------------------------------------------------------- */
  var modal = $("modal");
  var actual = -1;
  // ctx: la lista que recorren las flechas (la grilla filtrada o las destacadas).
  var ctx = lista;
  function abrirNota(idx, l) {
    if (l) ctx = l;
    actual = idx;
    var n = ctx[idx];
    var q = plano(estado.q.trim());
    var h = '<div class="m-art">' + arte(n, 720, 300, n.id * 7919 + 13) + etq(n.tp, { dato: n.anio }) + "</div>";
    h += '<div class="m-body"><p class="m-date">' + fecha(n.f, true) + "</p>";
    h += '<h2 id="mTitle">' + resaltar(n.t, q) + "</h2>";
    h += '<div><a class="btn" href="https://www.profertil.com.ar/index.php/' + esc(n.u) + '" target="_blank" rel="noopener">Ver la nota original <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></a></div>';
    if (n.b) h += '<p class="m-bajada">' + resaltar(n.b, q) + "</p>";
    h += '<dl class="m-data">' +
      "<div><dt>Publicada</dt><dd>" + fecha(n.f) + "</dd></div>" +
      "<div><dt>Palabras</dt><dd>" + n.w.toLocaleString("es-AR") + "</dd></div>" +
      "<div><dt>Imágenes</dt><dd>" + n.i + (n.v ? " + video" : "") + "</dd></div>" +
      "<div><dt>Categoría</dt><dd>" + POR[n.tp].nombre + "</dd></div>" +
      '<div class="ruta"><dt>Ruta actual</dt><dd>/index.php/' + esc(n.u) + "</dd></div></dl></div>";
    $("mScroll").innerHTML = h;
    $("mScroll").scrollTop = 0;
    $("mPos").textContent = (idx + 1) + " / " + ctx.length;
    $("mPrev").disabled = idx === 0;
    $("mNext").disabled = idx === ctx.length - 1;
    if (!modal.open) modal.showModal();
  }
  grid.addEventListener("click", function (e) { var c = e.target.closest(".card"); if (c) abrirNota(Number(c.dataset.idx), lista); });
  $("mPrev").addEventListener("click", function () { if (actual > 0) abrirNota(actual - 1); });
  $("mNext").addEventListener("click", function () { if (actual < ctx.length - 1) abrirNota(actual + 1); });
  $("mClose").addEventListener("click", function () { modal.close(); });
  modal.addEventListener("click", function (e) { if (e.target === modal) modal.close(); });
  modal.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" && actual > 0) abrirNota(actual - 1);
    if (e.key === "ArrowRight" && actual < ctx.length - 1) abrirNota(actual + 1);
  });

  /* --- Destacadas ---------------------------------------------------------------
     Cinco notas a pantalla completa. Por defecto, las mas recientes; si
     DESTACADAS trae rutas (n.u), mandan esas, en ese orden. */
  var DESTACADAS = [];
  var dest = DESTACADAS.length
    ? DESTACADAS.map(function (u) { return NOTAS.filter(function (n) { return n.u === u; })[0]; }).filter(Boolean)
    : NOTAS.slice(-5).reverse();
  // Colores de cada placa: fondo, Flor de atras y Flor de adelante. Fondos
  // oscuros de la paleta (el texto tiza va encima) y flores en dos colores
  // vivos, como la historia de Practicas Profesionales (azul, verde, celeste).
  var PARES_DEST = [
    ["#2D8035", "#5EB53A", "#4086FF"],
    ["#003DA5", "#2D8035", "#4086FF"],
    ["#8A4818", "#E57F19", "#EABA2C"],
    ["#2D8035", "#EABA2C", "#5EB53A"],
    ["#003DA5", "#4086FF", "#EABA2C"]
  ];
  // Foto: la de la nota (n.img, la URL en el sitio actual) cuando este en los
  // datos; mientras, fotos de banco de la marca para ver la composicion.
  var FOTOS_DEMO = [1, 2, 3, 4, 5].map(function (i) { return "../novedades/fotos/demo-" + i + ".webp"; });
  function flor() {
    return '<svg viewBox="' + A.formas.flor.vb + '" aria-hidden="true"><use href="#f-flor" fill="currentColor"/></svg>';
  }
  function escena(n, k) {
    var demo = FOTOS_DEMO[k % FOTOS_DEMO.length];
    return '<div class="d-esc">' +
      '<div class="d-capa d-atras">' + flor() + "</div>" +
      '<div class="d-capa d-foto"><img class="carga" src="' + esc(n.img || demo) + '" data-demo="' + demo + '" alt="" decoding="async"' + (k ? ' loading="lazy"' : "") + "></div>" +
      '<div class="d-capa d-frente">' + flor() + "</div></div>";
  }
  var FLECHA_CTA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  $("dSlides").innerHTML = dest.map(function (n, k) {
    var c = PARES_DEST[k % PARES_DEST.length];
    return '<article class="d-slide" role="group" aria-roledescription="nota" aria-label="' + (k + 1) + " de " + dest.length + '" inert style="--fondo:' + c[0] + ";--atras:" + c[1] + ";--frente:" + c[2] + '">' +
      '<div class="d-art">' + escena(n, k) + "</div>" +
      '<div class="d-txt"><div class="wrap"><div class="d-in">' +
      '<div class="d-kick">' + etq(n.tp, { dato: fechaDato(n.f) }) + "</div>" +
      "<h2>" + esc(n.t) + "</h2>" +
      (n.b ? '<p class="d-bajada">' + esc(n.b) + "</p>" : "") +
      '<button class="d-cta" type="button" data-k="' + k + '">Leer la nota ' + FLECHA_CTA + "</button>" +
      "</div></div></div></article>";
  }).join("");
  $("dSegs").style.setProperty("--n", dest.length);
  $("dSegs").innerHTML = dest.map(function (n, k) {
    return '<button class="d-seg" type="button" data-k="' + k + '" aria-label="Ver destacada ' + (k + 1) + ": " + esc(n.t) + '">' +
      '<span class="d-bar"><i></i></span></button>';
  }).join("");
  // Las fotos aparecen con un fundido al cargar; si la de la nota falla, va la de prueba.
  [].forEach.call($("dSlides").querySelectorAll(".d-foto img"), function (img) {
    function lista() { img.classList.remove("carga"); }
    if (img.complete && img.naturalWidth) lista();
    img.addEventListener("load", lista);
    img.addEventListener("error", function () { if (img.getAttribute("src") !== img.dataset.demo) img.src = img.dataset.demo; });
  });
  var slides = $("dSlides").children, segs = $("dSegs").children, dk = -1;
  var barras = [].map.call(segs, function (s) { return s.querySelector(".d-bar i"); });
  // Tiempos del carrusel: salen de los tokens (--carrusel-*), como el resto.
  var raiz = getComputedStyle(document.documentElement);
  var DURA = parseFloat(raiz.getPropertyValue("--carrusel-dura")) || 7000;
  var PASE = parseFloat(raiz.getPropertyValue("--carrusel-pase")) || 700;
  var CURVA = raiz.getPropertyValue("--carrusel-curva").trim() || "cubic-bezier(0.65, 0, 0.25, 1)";
  var dEl = $("dest"), motivos = {}, pausado = false;
  function pausa(motivo, si) {
    motivos[motivo] = si;
    pausado = Object.keys(motivos).some(function (m) { return motivos[m]; });
  }
  function rot(k) { return (k + dest.length) % dest.length; }
  function poner(i, x, animar) {
    slides[i].style.transition = animar ? "transform " + PASE + "ms " + CURVA : "none";
    slides[i].style.transform = "translateX(" + x + ")";
  }
  // Pasa a la nota k. dir: 1 entra por la derecha, -1 por la izquierda.
  // yaPuesta: la placa nueva ya esta donde la dejo el dedo.
  function irA(k, dir, yaPuesta) {
    k = rot(k);
    var viejo = dk;
    transcurrido = 0;
    if (k === viejo) { poner(k, "0px", true); return; }
    dir = dir || (k > viejo ? 1 : -1);
    for (var i = 0; i < slides.length; i++) if (i !== viejo && i !== k) slides[i].classList.remove("vis");
    if (!yaPuesta) poner(k, dir * 100 + "%", false);
    slides[k].classList.add("vis");
    void slides[k].offsetWidth;
    poner(k, "0px", viejo >= 0);
    slides[k].classList.add("on"); slides[k].inert = false;
    if (viejo >= 0) {
      poner(viejo, -dir * 100 + "%", true);
      slides[viejo].classList.remove("on"); slides[viejo].inert = true;
      setTimeout(function () { if (viejo !== dk && !arrastre) slides[viejo].classList.remove("vis"); }, PASE + 40);
    }
    for (var j = 0; j < segs.length; j++) {
      segs[j].classList.toggle("on", j === k);
      if (j === k) segs[j].setAttribute("aria-current", "true"); else segs[j].removeAttribute("aria-current");
    }
    dk = k;
  }
  // Barras como en las stories: las anteriores llenas, la actual llenandose.
  // Las mueve el JS, asi andan aunque el sistema tenga reducido el movimiento.
  var transcurrido = 0, ultimo = 0;
  function tic(t) {
    var d = ultimo ? Math.min(t - ultimo, 100) : 0;
    ultimo = t;
    if (!pausado && !arrastre) {
      transcurrido += d;
      if (transcurrido >= DURA) irA(dk + 1, 1);
    }
    for (var i = 0; i < barras.length; i++) {
      var p = i < dk ? 1 : i > dk ? 0 : Math.min(1, transcurrido / DURA);
      barras[i].style.transform = "scaleX(" + p + ")";
    }
    requestAnimationFrame(tic);
  }
  $("dSegs").addEventListener("click", function (e) { var b = e.target.closest(".d-seg"); if (b) irA(Number(b.dataset.k)); });
  $("dPrev").addEventListener("click", function () { irA(dk - 1, -1); });
  $("dNext").addEventListener("click", function () { irA(dk + 1, 1); });
  $("dSlides").addEventListener("click", function (e) { var b = e.target.closest(".d-cta"); if (b) abrirNota(Number(b.dataset.k), dest); });
  dEl.addEventListener("focusin", function (e) { if (e.target.matches(":focus-visible")) pausa("foco", true); });
  dEl.addEventListener("focusout", function (e) { if (!dEl.contains(e.relatedTarget)) pausa("foco", false); });
  dEl.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") irA(dk - 1, -1);
    if (e.key === "ArrowRight") irA(dk + 1, 1);
  });
  modal.addEventListener("close", function () { pausa("modal", false); });
  new MutationObserver(function () { if (modal.open) pausa("modal", true); }).observe(modal, { attributes: true, attributeFilter: ["open"] });

  /* Gestos de stories sobre las placas (no sobre botones ni indicadores):
     toque corto a la derecha pasa y a la izquierda vuelve; mantener apretado
     pausa; en touch, arrastrar de costado mueve la placa con el dedo. */
  var arrastre = null;
  dEl.addEventListener("pointerdown", function (e) {
    if (e.button > 0 || e.target.closest("button, a, .d-nav")) return;
    arrastre = { x0: e.clientX, y0: e.clientY, t0: Date.now(), dx: 0, mueve: false, vecino: -1, touch: e.pointerType !== "mouse" };
    pausa("toque", true);
  });
  dEl.addEventListener("pointermove", function (e) {
    var a = arrastre; if (!a || !a.touch) return;
    a.dx = e.clientX - a.x0;
    if (!a.mueve) {
      if (Math.abs(a.dx) < 8) return;
      if (Math.abs(e.clientY - a.y0) > Math.abs(a.dx)) { soltar(e, true); return; }
      a.mueve = true;
      try { dEl.setPointerCapture(e.pointerId); } catch (err) {}
    }
    var dir = a.dx < 0 ? 1 : -1, v = rot(dk + dir);
    if (a.vecino !== v && a.vecino !== -1 && a.vecino !== dk) slides[a.vecino].classList.remove("vis");
    a.vecino = v; a.dir = dir;
    poner(dk, a.dx + "px", false);
    if (v !== dk) { slides[v].classList.add("vis"); poner(v, "calc(" + dir * 100 + "% + " + a.dx + "px)", false); }
  });
  function soltar(e, cancelar) {
    var a = arrastre; if (!a) return;
    arrastre = null;
    pausa("toque", false);
    if (cancelar && !a.mueve) return;
    if (a.mueve) {
      var rapido = Math.abs(a.dx) / Math.max(1, Date.now() - a.t0) > 0.5;
      if (!cancelar && (Math.abs(a.dx) > dEl.clientWidth * 0.2 || rapido)) irA(a.vecino, a.dir, true);
      else {
        poner(dk, "0px", true);
        if (a.vecino !== dk) { poner(a.vecino, a.dir * 100 + "%", true); var v = a.vecino; setTimeout(function () { if (v !== dk) slides[v].classList.remove("vis"); }, PASE + 40); }
      }
      return;
    }
    // Toque corto: pasa o vuelve. Mantenido: solo fue una pausa.
    if (Date.now() - a.t0 < 300) {
      if (e.clientX < dEl.clientWidth * 0.3) irA(dk - 1, -1); else irA(dk + 1, 1);
    }
  }
  dEl.addEventListener("pointerup", function (e) { soltar(e, false); });
  dEl.addEventListener("pointercancel", function (e) { soltar(e, true); });
  // Fuera de vista el carrusel se frena y el dock de filtros vuelve.
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (en) {
      var r = en[0].intersectionRatio;
      pausa("vista", r < 0.25);
      var tapa = en[0].isIntersecting && r > 0.4;
      if (tapa && $("filters").classList.contains("open")) abrirFiltros(false);
      $("filters").classList.toggle("fuera", tapa);
    }, { threshold: [0, 0.25, 0.4, 0.6, 1] }).observe(dEl);
  }
  /* Profundidad: las tres capas de la placa se mueven a distinta velocidad.
     La Flor de atras va lenta, la foto casi quieta y la de adelante mas rapida
     y en sentido contrario. Las mueve una deriva lenta, el puntero (desktop) y
     el scroll. Con reducir movimiento queda todo quieto. */
  (function () {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    // [px por unidad de puntero en x, en y, fraccion del scroll que se resta]
    var CAPAS = { a: [-26, -18, 0.32], p: [-8, -6, 0.16], f: [44, 30, -0.06] };
    var px = 0, py = 0, mx = 0, my = 0, est = dEl.style;
    if (matchMedia("(pointer: fine)").matches) {
      dEl.addEventListener("pointermove", function (e) {
        if (e.pointerType !== "mouse") return;
        var r = dEl.getBoundingClientRect();
        px = (e.clientX - r.left) / r.width * 2 - 1;
        py = (e.clientY - r.top) / r.height * 2 - 1;
      });
      dEl.addEventListener("pointerleave", function () { px = py = 0; });
    }
    function mover(t) {
      requestAnimationFrame(mover);
      var sy = window.scrollY;
      if (sy > dEl.offsetHeight) return;
      mx += (px - mx) * 0.04; my += (py - my) * 0.04;
      var dx = Math.sin(t / 6100) * 0.45, dy = Math.cos(t / 7900) * 0.45;
      Object.keys(CAPAS).forEach(function (k) {
        var c = CAPAS[k], deriva = k === "p" ? 0.25 : 1;
        est.setProperty("--" + k + "-x", ((mx + dx * deriva) * c[0]).toFixed(1) + "px");
        est.setProperty("--" + k + "-y", ((my + dy * deriva) * c[1] + sy * c[2]).toFixed(1) + "px");
      });
    }
    requestAnimationFrame(mover);
  })();

  irA(0);
  requestAnimationFrame(tic);

  aplicar();
})();
</script>
