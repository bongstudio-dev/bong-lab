<title>Novedades Profertil</title>
<meta name="description" content="Maqueta del archivo de notas de profertil.com.ar sobre el concepto web del manual de marca: las 471 notas reales del sitio actual, con buscador y filtros.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../componentes/tokens.css">
<link rel="stylesheet" href="../componentes/base.css">
<style>
/* ==========================================================================
   Novedades Profertil: maqueta del archivo de notas.
   Layout: barra fija con logo, menu y la lupa que se expande en buscador;
   carrusel a pantalla completa con las cinco notas destacadas; grilla
   masonry de tarjetas y panel de filtros flotante (categoria y año).
   Paleta, pares de color, formas e iconos son los oficiales del manual de
   marca y de las herramientas del sistema. Un solo tema, a proposito: el
   manual define la web sobre tiza y no tiene version oscura.
   ========================================================================== */
:root {
  color-scheme: light;
  /* Los tokens del sistema salen de ../componentes/tokens.css (generado desde el Figma Master) y las
     piezas compartidas (Barra, Selector, Pastilla, Chip, Etiqueta, Botón) de ../componentes/base.css:
     las mismas que usan la librería de componentes y el resto del Lab. Acá solo lo propio de la página. */
  --shadow: var(--sombra-tarjeta);
  --f-mono: "DM Mono", ui-monospace, Menlo, monospace;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--celeste); outline-offset: 2px; }
.pf-wrap { width: min(100% - 32px, 1320px); margin-inline: auto; }
.pf-ico { display: block; width: 100%; height: 100%; }

/* --- Tacto -----------------------------------------------------------------
   Los :hover van todos dentro de (hover: hover) and (pointer: fine): en el
   celular el primer toque deja el hover puesto hasta tocar otra cosa. Sin el
   destello gris de Safari al tocar; en su lugar, cada control responde al
   apoyar el dedo (:active) con el mismo cambio que el hover. */
html { -webkit-tap-highlight-color: transparent; }
button, a, [role="button"] { touch-action: manipulation; }
button, [role="button"] { -webkit-user-select: none; user-select: none; }
@media (hover: none) {
  .pf-card:active { transform: scale(0.985); transition-duration: 120ms; }
  .pf-d-flecha:active { background: var(--tiza); color: var(--azul); }
  .pf-d-cta:active { background: #fff; }
}

/* --- Barra superior: la pieza "barra" de base.css (transparente sobre el carrusel, sólida al bajar). */

/* --- Destacadas: carrusel a pantalla completa ---------------------------
   Las cinco notas mas recientes (o las de DESTACADAS, si se cargan), una por
   pantalla, como en el archivo de waabi.pf-ai/insights y como las stories: la
   barra de la nota se llena y al terminar entra la siguiente deslizandose de
   costado. Tocar a la derecha pasa, a la izquierda vuelve, mantener apretado
   pausa y en touch la placa sigue al dedo. Se frena tambien con el foco del
   teclado, fuera de vista o con la nota abierta.
   Cada placa es la foto de la nota recortada como una hoja (dos esquinas
   opuestas redondeadas) entre dos Flores del sistema enormes, una detras y
   otra delante: el mismo lenguaje que las piezas de redes (Figma Master,
   Header de noticias · con foto). Parallax al hacer scroll y al pasar de
   placa: ver "Profundidad" abajo. */
.pf-dest {
  position: relative; overflow: hidden;
  height: 100vh; height: 100svh; min-height: 540px;
  background: var(--azul); color: var(--tiza);
  touch-action: pan-y;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
/* La posicion de cada placa la maneja el JS (translateX); aca solo cual se ve. */
.pf-d-slide { position: absolute; inset: 0; visibility: hidden; transform: translateX(100%); will-change: transform; }
.pf-d-slide.pf-vis { visibility: visible; }
.pf-d-slide.pf-on { z-index: 1; }
.pf-d-slide { overflow: hidden; background: var(--fondo); }
.pf-d-art { position: absolute; inset: 0; }
/* Escena: la caja de la foto. Las flores se ubican en unidades de su ancho
   (cqw), asi los arcos cruzan las mismas esquinas en cualquier pantalla. Sin
   deriva ni reaccion al mouse: las capas solo se mueven con el scroll y el pase.
   Composicion: Figma Master, "Destacadas con foto" Desktop normal (1440 x 900),
   Desktop ancho (2011 x 900) y Mobile (375 x 812), ajustada a ojo:
   armonica, no simetrica. La Flor de adelante compensa el peso de la foto y
   de la Flor de atras. Hasta 1440 la foto es media pantalla y sangra por la
   derecha; de 1440 a 2011 los valores pasan de una composicion a la otra con
   --t (0 a 571 px) y desde 2011 quedan fijos: la foto deja de crecer y entra
   en pantalla, la Flor de atras baja y la de adelante crece hacia la izquierda.
   Los coeficientes de --t son la diferencia entre los dos frames (en px, con la
   foto de 720) dividida 571.
   Zona segura del texto: la columna va del margen del contenido (--m) hasta la
   foto menos 48 px (--g) y nunca es menor a 560 px (--col; en pantallas chicas,
   media pantalla). Si no entra, cede la foto: primero se corre a la derecha y
   sangra mas (hasta 12vw afuera) y despues se achica. El titulo se escala con
   esa columna (ver .pf-d-in h2). */
.pf-dest {
  --t: clamp(0px, 100vw - 1440px, 571px);
  --m: max(16px, (100vw - 1320px) / 2);
  --g: 48px;
  --col: min(560px, 50vw);
  --f-ini: calc(var(--m) + var(--col) + var(--g));
  --f-der0: calc(-2.8vw + var(--t) * 0.6);
  --f-ancho0: min(50vw, 80svh);
  --f-der: max(-12vw, min(var(--f-der0), 100vw - var(--f-ini) - var(--f-ancho0)));
  --f-ancho: min(var(--f-ancho0), 100vw - var(--f-der) - var(--f-ini));
}
.pf-d-esc { position: absolute; z-index: 1; top: 15.5%; bottom: 15.5%; right: var(--f-der); width: var(--f-ancho); container-type: size; }
.pf-d-capa { position: absolute; display: block; height: auto; }
.pf-d-capa svg { display: block; width: 100%; height: auto; }
/* Profundidad, en dos niveles y sin JS en cada cuadro:
   - Scroll: la capa (.pf-d-capa) sube con la pagina a su velocidad mediante una
     animacion atada al scroll (animation-timeline), que el navegador mueve en el
     mismo paso que la pagina. Asi no tironea en Safari (el parallax con JS
     llegaba un cuadro tarde). Donde no hay soporte (Safari < 26) queda quieta.
     --v es cuanto se queda atras por cada px de scroll: positivo va mas lento
     (lejos), negativo mas rapido (cerca).
   - Pase de placa: adentro, .pf-d-desliz acompana el deslizamiento con su propia
     velocidad: --sx es donde esta la placa (-1 a 1, lo escribe el JS al pasar)
     y --k cuanto se separa de ella. --tr es la misma transicion que la placa. */
.pf-d-desliz { display: block; transform: translate3d(calc(var(--sx, 0) * var(--k)), 0, 0); transition: var(--tr, none); }
@supports (animation-timeline: scroll()) {
  .pf-d-capa { animation: pf-d-prof linear both; animation-timeline: scroll(root block); animation-range: 0px 1000px; }
  @keyframes pf-d-prof { to { transform: translate3d(0, calc(var(--v) * 1000px), 0); } }
}
.pf-d-atras { --v: 0.45; --k: -48vw; width: 236cqw; left: calc(36.1cqw + var(--t) * 0.1475); top: calc(-179.2cqw + var(--t) * 1.1955); color: var(--atras); }
.pf-d-frente { --v: -0.25; --k: 38vw; z-index: 2; width: calc(180.6cqw + var(--t) * 0.2862); left: calc(-157.1cqw - var(--t) * 0.2875); top: calc(100cqh - 22.8cqw - var(--t) * 0.1122); color: var(--frente); }
.pf-d-foto { --v: 0.2; --k: -16vw; z-index: 1; inset: 0; }
.pf-d-foto .pf-d-desliz, .pf-d-recorte { position: absolute; inset: 0; }
.pf-d-recorte { overflow: hidden; border-radius: 0 37cqw 0 37cqw; background: rgba(255, 254, 239, 0.12); }
.pf-d-foto img { display: block; width: 100%; height: 100%; object-fit: cover; transform: scale(1.1); transition: transform 9s linear, opacity 600ms ease; }
.pf-d-foto img.pf-carga { opacity: 0; }
.pf-d-slide.pf-on .pf-d-foto img { transform: scale(1.02); }
/* El bloque de texto va centrado con la foto (Figma: 216 a 672 en 900 de alto). */
.pf-d-txt { position: absolute; z-index: 3; left: 0; right: 0; top: 50%; transform: translateY(calc(-50% - 6px)); }
.pf-d-in { display: grid; gap: 22px; justify-items: start; max-width: min(720px, 100vw - var(--f-der) - var(--f-ancho) - var(--g) - var(--m)); container-type: inline-size; }
.pf-d-kick { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 0.95rem; color: rgba(255, 254, 239, 0.88); }
.pf-d-kick .pf-etiqueta { --s: var(--etq-l); }
.pf-d-in h2 {
  margin: 0;
  font-family: var(--f-display); font-weight: 600;
  /* Entre 64 y 88: el 13.5% de la columna (unos 15 caracteres por linea) y,
     en pantallas bajas, lo que deja el alto para 5 lineas entre la barra y los
     indicadores. Los titulos de mas de 80 caracteres (el 10% de las notas) van
     a 64 (.pf-largo). Una palabra sin cortes (p. ej. "compartida.pf-Profertil") se
     parte antes que pisar la foto. */
  font-size: clamp(64px, min(13.5cqi, (100svh - 330px) / 4.7), 88px); line-height: 0.94; letter-spacing: -0.04em;
  text-wrap: balance; overflow-wrap: break-word;
}
.pf-d-in h2.pf-largo { font-size: 64px; }
.pf-d-bajada { margin: 0; max-width: 56ch; font-size: clamp(1rem, 1.4vw, 1.12rem); line-height: 1.5; color: rgba(255, 254, 239, 0.9); }
.pf-d-cta {
  display: inline-flex; align-items: center; gap: 10px;
  height: var(--btn-l); padding: 0 22px 0 24px;
  border: 0; border-radius: 999px; cursor: pointer;
  background: var(--tiza); color: var(--azul);
  font-family: var(--f-display); font-size: 1.02rem; font-weight: 500;
  transition: background 200ms ease, color 200ms ease;
}
@media (hover: hover) and (pointer: fine) { .pf-d-cta:hover { background: #fff; } }
.pf-d-cta svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 260ms var(--ease); }
@media (hover: hover) and (pointer: fine) { .pf-d-cta:hover svg { transform: translateX(3px); } }

/* Indicadores: una barra por nota, como en las stories: las anteriores
   llenas y la actual llenandose (las mueve el JS). Sin texto: el titulo ya
   esta en la placa. */
.pf-d-nav { position: absolute; z-index: 2; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); }
.pf-d-nav .pf-wrap { display: flex; align-items: center; gap: 28px; }
.pf-d-segs { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 16px; }
.pf-d-seg { display: grid; padding: 14px 0; border: 0; background: transparent; cursor: pointer; text-align: left; color: rgba(255, 254, 239, 0.56); transition: color 240ms ease; }
.pf-d-seg.pf-on { color: var(--tiza); }
@media (hover: hover) and (pointer: fine) { .pf-d-seg:hover { color: var(--tiza); } }
.pf-d-bar { display: block; height: 2px; border-radius: 2px; background: rgba(255, 254, 239, 0.26); overflow: hidden; }
.pf-d-bar i { display: block; height: 100%; background: var(--tiza); transform: scaleX(0); transform-origin: left; }
.pf-d-flechas { flex: none; display: flex; gap: 8px; }
.pf-d-flecha {
  width: 46px; height: 46px; border-radius: 999px; cursor: pointer;
  border: 1px solid rgba(255, 254, 239, 0.3); background: rgba(255, 254, 239, 0.08); color: var(--tiza);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: grid; place-items: center; transition: background 200ms ease, color 200ms ease;
}
@media (hover: hover) and (pointer: fine) { .pf-d-flecha:hover { background: var(--tiza); color: var(--azul); } }
.pf-d-flecha svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* --- Resultado ------------------------------------------------------------ */
.pf-result-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding-block: 22px 16px; }
.pf-result-text { margin: 0; color: var(--ink-2); min-width: 0; }
.pf-result-text b { color: var(--azul); font-weight: 600; font-variant-numeric: tabular-nums; }
.pf-herramientas { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
/* El Selector es la pieza "selector" de base.css. Al cambiar de vista el indicador lo mueve la View
   Transition, junto con las tarjetas; al cambiar el orden, su transición. */
.pf-selector.pf-vista .pf-selector__ind { view-transition-name: pf-ind-vista; }
/* Los botones tambien viajan como capa propia: si no, quedan en la foto de la
   pagina, que la View Transition pinta debajo del indicador, y el icono
   elegido se tapa mientras el indicador se mueve. */
.pf-selector.pf-vista [data-vista="chico"] { view-transition-name: pf-vista-chico; }
.pf-selector.pf-vista [data-vista="medio"] { view-transition-name: pf-vista-medio; }
.pf-selector.pf-vista [data-vista="grande"] { view-transition-name: pf-vista-grande; }

/* --- Vista: tres tamaños de tarjeta (chico, medio, grande), un ícono cada
   uno, con el mismo estilo que el orden. El cambio se anima con View
   Transitions donde hay. En mobile no hay "chico". */
@media (max-width: 640px) { .pf-selector.pf-vista [data-vista="chico"] { display: none; } }
::view-transition-group(*) { animation-duration: var(--t-vista); animation-timing-function: var(--curva-vista); }

/* --- Grilla --------------------------------------------------------------- */
.pf-grid { display: flex; gap: 16px; align-items: flex-start; padding-bottom: 170px; }
.pf-gcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.pf-sentinel { height: 1px; }

.pf-card {
  position: relative; display: grid; text-align: left;
  border: 0; padding: 0; cursor: pointer;
  background: var(--card);
  border-radius: 26px;
  box-shadow: var(--shadow);
  transition: transform 320ms var(--ease), box-shadow 320ms var(--ease);
  animation: pf-entra 420ms var(--ease) backwards;
}
@media (hover: hover) and (pointer: fine) { .pf-card:hover { transform: translateY(-3px); box-shadow: 0 1px 2px rgba(10, 30, 74, 0.06), 0 18px 34px -16px rgba(10, 30, 74, 0.34); } }
@keyframes pf-entra { from { transform: translateY(8px); } to { transform: none; } }

.pf-media { position: relative; margin: 8px 8px 0; border-radius: 19px; overflow: hidden; line-height: 0; max-width: 100%; }
.pf-media > svg { display: block; width: 100%; height: auto; }
.pf-media .pf-etiqueta { position: absolute; top: 10px; left: 10px; }
.pf-play { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 999px; background: rgba(255, 254, 239, 0.94); display: grid; place-items: center; }
.pf-play svg { width: 12px; height: 12px; fill: var(--azul); margin-left: 2px; }

.pf-lead { padding: 18px 18px 2px; display: grid; gap: 14px; justify-items: start; }
.pf-lead h3 {
  margin: 0;
  font-family: var(--f-display); font-weight: 600;
  font-size: 1.36rem; line-height: 1.06; letter-spacing: -0.025em;
  color: var(--azul);
  text-wrap: balance;
}
.pf-meta { padding: 12px 18px 18px; display: grid; gap: 8px; min-width: 0; }
.pf-when { margin: 0; font-size: 0.84rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pf-when b { font-weight: 500; color: var(--ink-2); }
.pf-ttl {
  margin: 0;
  font-family: var(--f-display); font-weight: 500;
  font-size: 1.1rem; line-height: 1.2; letter-spacing: -0.015em;
  color: var(--azul);
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
mark { background: rgba(234, 186, 44, 0.42); color: inherit; border-radius: 3px; padding: 0 1px; }
.pf-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
.pf-more { font-size: 0.86rem; color: var(--ink-3); padding-left: 2px; }

/* --- Etiqueta: la pieza "etiqueta" de base.css. Acá, solo cómo se acomoda en tarjetas y en el detalle. */
.pf-media .pf-etiqueta .pf-etiqueta__rotulo, .pf-m-art .pf-etiqueta .pf-etiqueta__rotulo { box-shadow: none; }
/* La etiqueta nunca se sale de la tarjeta: la tarjeta es contenedor y, si es
   angosta, la etiqueta pasa al nombre corto y suelta el año. Si aun asi no
   entra, el rotulo se corta con puntos suspensivos. */
.pf-card { container-type: inline-size; }
.pf-card .pf-etiqueta { max-width: 100%; }
.pf-card .pf-media .pf-etiqueta { max-width: calc(100% - 20px); }
.pf-card .pf-etiqueta .pf-etiqueta__rotulo { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pf-card .pf-etiqueta .pf-etiqueta__rotulo > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Tarjetas anchas (vista con pocas columnas): la tipografia crece. */
@container (min-width: 420px) {
  .pf-lead { padding: 26px 26px 4px; gap: 18px; }
  .pf-lead h3 { font-size: 2.1rem; line-height: 1.02; }
  .pf-meta { padding: 14px 18px 22px; }
  .pf-ttl { font-size: 1.55rem; line-height: 1.12; -webkit-line-clamp: 3; }
  .pf-when { font-size: 0.92rem; }
  .pf-etiqueta { --s: var(--etq-l); }
  .pf-media .pf-etiqueta { top: 14px; left: 14px; }
}
@container (max-width: 250px) {
  .pf-etiqueta .pf-etiqueta__completo { display: none; }
  .pf-etiqueta .pf-etiqueta__corto { display: inline; }
  .pf-etiqueta .pf-etiqueta__dato { display: none; }
}

/* --- Pastillas de categoría y chips de año: piezas "pastilla" y "chip" de base.css. */

/* --- Panel de filtros: barra fija full rounded con "Todas" y las tres
   categorias con mas notas; arriba se despliega el panel con las demas y el
   año. En mobile la barra se reduce a un boton "Filtros" y el panel trae
   todas las categorias. Abre y cierra animando el alto del panel (medido en
   JS: animar 0fr a 1fr en un contenedor de alto automatico falla en Chrome)
   y, en mobile, el ancho. */
.pf-filters {
  /* left y right en 0 con margen auto: con left 50% el ancho se calcula sobre
     media pantalla y las pastillas quedan cortadas. */
  position: fixed; left: 0; right: 0; margin-inline: auto;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  width: fit-content; max-width: min(100% - 24px, 980px);
  max-height: calc(100% - 110px);
  display: flex; flex-direction: column;
  border-radius: 24px;
  transition: width var(--f-cerrar) var(--f-curva), border-radius var(--f-cerrar) var(--f-curva), transform 520ms var(--ease), opacity 300ms ease;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.92);
  box-shadow: 0 24px 60px -24px rgba(10, 30, 74, 0.5);
  backdrop-filter: blur(22px) saturate(1.4);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
  overflow: hidden;
}
.pf-filters.pf-abierto { border-radius: 26px; transition-duration: var(--f-abrir), var(--f-abrir), 520ms, 300ms; }
/* Mientras el carrusel ocupa la pantalla el dock baja y no tapa los
   indicadores; vuelve cuando aparecen las tarjetas. */
.pf-filters.pf-fuera { transform: translateY(calc(100% + 40px)); opacity: 0; pointer-events: none; }
/* El panel no ensancha la barra: los años se acomodan al ancho que ya tiene.
   Cerrado queda invisible (fuera del tab) recien cuando termina de bajar. */
.pf-f-body {
  contain: inline-size; flex: 0 1 auto; min-height: 0; height: 0; overflow: hidden;
  border-bottom: 1px solid transparent;
  visibility: hidden; opacity: 0;
  transition: height var(--f-cerrar) var(--f-curva), opacity calc(var(--f-fundido) * 0.7) ease, border-color 260ms ease, visibility 0s linear var(--f-cerrar);
}
.pf-filters.pf-abierto .pf-f-body { visibility: visible; opacity: 1; border-bottom-color: var(--line); transition: height var(--f-abrir) var(--f-curva), opacity var(--f-fundido) ease var(--f-fundido-retraso), border-color 260ms ease; }
/* Mientras anima no hay scroll (si no, aparece la barra a mitad de camino):
   se habilita recien con .pf-listo, cuando el panel termino de abrir. */
.pf-filters.pf-abierto.pf-listo .pf-f-body { height: auto; overflow-y: auto; }
.pf-f-bar { flex: none; }
.pf-f-in { padding: 18px 20px 14px; display: grid; gap: 14px; }
.pf-filters .pf-f-cats { display: grid; }
.pf-f-group { display: grid; gap: 8px; }
.pf-f-label { margin: 0; font-size: 0.74rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.pf-f-row { display: flex; flex-wrap: wrap; gap: 7px; padding: 3px; }
.pf-f-bar { display: flex; align-items: center; gap: 4px; padding: 5px 5px 5px 6px; }
.pf-f-main { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; padding: 3px; }
.pf-f-main::-webkit-scrollbar { display: none; }
.pf-f-toggle {
  position: relative; flex: none;
  width: 36px; height: 36px; border: 0; border-radius: 999px;

/* --- Ancla: la accion principal, afuera del dock -------------------------
   Un circulo azul con la flecha, pegado a la derecha del dock pero separado
   de el. Es lo unico saturado de la barra. Baja o
   vuelve al principio de la lista; la mueve el JS (ver "Ancla" abajo).
   --a es el alto del dock cerrado: en desktop 30 de pastilla + 2 x 3 de
   f-main + 2 x 5 de f-bar + 2 de borde + 1 del borde del f-body = 49. La
   separacion y los resortes son tokens del Figma (--ancla-*, ver "Ancla" en
   el JS). */

   juntos. Si la altura la pusiera el JS desde arriba, la bola llegaria un
   cuadro tarde y saltaria. En mobile la x y el alto tambien salen del CSS,
   con la transicion del dock: su borde derecho es lineal en su ancho, asi
   que los dos se mueven juntos cuadro a cuadro. En desktop la x la pone el JS
   (--ancla-x: ahi el dock no se compacta). El JS solo pone la escala. */

  position: fixed; left: var(--ancla-x, -200px); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 41;
  width: var(--a); height: var(--a);
  padding: 0; border: 0; background: none; cursor: pointer;
  will-change: transform; transform: scale(0);
  transform-origin: left bottom; /* al compactarse no se abre el hueco con el dock */

.pf-ancla-cuerpo {

  border-radius: 50%; background: var(--azul); color: var(--tiza);
  will-change: transform;
}
.pf-ancla svg { width: 44%; height: 44%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; will-change: transform; }
.pf-ancla:focus-visible { outline: none; }
.pf-ancla:focus-visible .pf-ancla-cuerpo { outline: 2px solid var(--celeste); outline-offset: 3px; }

  .pf-filters.pf-abierto { width: calc(100% - 32px - var(--ancla-gap) - var(--a)); }
  /* Mobile: --a es 57, toggle 46 + 2 x 4 de f-bar + 2 de borde + 1 del
     f-body. El dock (ancho w) va centrado entre 0 y 100% - --a - gap: su borde
     derecho es (100% - --a - gap + w) / 2 y la bola arranca un gap despues.
     Con w = 100% - 32 - gap - --a da 100% - 16 - --a. Compacto, w es 104
     (128 con contador) y el alto 41: toggle 30 + 2 x 4 de f-bar + 2 de
     borde + 1 del borde del f-body. */

  .pf-ancla {
    left: calc(100% - 16px - var(--a));
    transition: bottom var(--f-chica) var(--f-chica-curva), left var(--f-chica) var(--f-chica-curva), width var(--f-chica) var(--f-chica-curva), height var(--f-chica) var(--f-chica-curva);
  }
  .pf-filters.pf-chica:not(.pf-abierto) ~ .pf-ancla {
    bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    left: calc((100% - var(--a) + var(--ancla-gap) + 104px) / 2);
    width: 41px; height: 41px;
  }
  .pf-filters.pf-chica:not(.pf-abierto):has(.pf-f-count:not([hidden])) ~ .pf-ancla { left: calc((100% - var(--a) + var(--ancla-gap) + 128px) / 2); }

     Datos reales: las 471 notas de /noticias-recientes/ del crawl del sitio

     (u), palabras (w), imagenes (i), video (v), bajada propia si tiene (b)

  $("pf-sortOld").addEventListener("click", function () { ordenar("old"); });

    new IntersectionObserver(function (en) { if (en[0].isIntersecting && pintadas < lista.length) pintarTanda(); }, { rootMargin: "900px 0px" }).observe($("pf-sentinel"));
  } else { TANDA = 1000; }
  var nCols = cuantasCols();
  window.addEventListener("resize", function () { moverInds(); var n = cuantasCols(); if (n !== nCols) { nCols = n; repintar(true); } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moverInds);
  document.querySelector(".pf-selector.pf-vista").addEventListener("click", function (e) {

  if (vista === "chico" && matchMedia("(max-width: 640px)").matches) vista = "medio";
  marcarVista(false);
  moverInds();

  /* --- Detalle ---------------------------------------------------------------- */
  var modal = $("pf-modal");
  var actual = -1;
  // ctx: la lista que recorren las flechas (la grilla filtrada o las destacadas).
  var ctx = lista;
  function abrirNota(idx, l) {
    if (l) ctx = l;
    actual = idx;
    var n = ctx[idx];
    var q = plano(estado.q.trim());
    var h = '<div class="pf-m-art">' + arte(n, 720, 300, n.id * 7919 + 13) + etq(n.tp, { dato: n.anio }) + "</div>";
    h += '<div class="pf-m-body"><p class="pf-m-date">' + fecha(n.f, true) + "</p>";
    h += '<h2 id="pf-mTitle">' + resaltar(n.t, q) + "</h2>";
    h += '<div><a class="pf-boton pf-boton--verde" href="https://www.profertil.com.ar/index.php/' + esc(n.u) + '" target="_blank" rel="noopener">Ver la nota original <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></a></div>';
    if (n.b) h += '<p class="pf-m-bajada">' + resaltar(n.b, q) + "</p>";
    h += '<dl class="pf-m-data">' +
      "<div><dt>Publicada</dt><dd>" + fecha(n.f) + "</dd></div>" +
      "<div><dt>Palabras</dt><dd>" + n.w.toLocaleString("es-AR") + "</dd></div>" +
      "<div><dt>Imágenes</dt><dd>" + n.i + (n.v ? " + video" : "") + "</dd></div>" +
      "<div><dt>Categoría</dt><dd>" + POR[n.tp].nombre + "</dd></div>" +
      '<div class="pf-ruta"><dt>Ruta actual</dt><dd>/index.php/' + esc(n.u) + "</dd></div></dl></div>";
    $("pf-mScroll").innerHTML = h;
    $("pf-mScroll").scrollTop = 0;
    $("pf-mPos").textContent = (idx + 1) + " / " + ctx.length;
    $("pf-mPrev").disabled = idx === 0;
    $("pf-mNext").disabled = idx === ctx.length - 1;

  }
  grid.addEventListener("click", function (e) { var c = e.target.closest(".pf-card"); if (c) abrirNota(Number(c.dataset.idx), lista); });
  $("pf-mPrev").addEventListener("click", function () { if (actual > 0) abrirNota(actual - 1); });
  $("pf-mNext").addEventListener("click", function () { if (actual < ctx.length - 1) abrirNota(actual + 1); });
  $("pf-mClose").addEventListener("click", function () { modal.close(); });
  modal.addEventListener("click", function (e) { if (e.target === modal) modal.close(); });
  modal.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" && actual > 0) abrirNota(actual - 1);
    if (e.key === "ArrowRight" && actual < ctx.length - 1) abrirNota(actual + 1);
  });


  /* --- Ancla --------------------------------------------------------------
     Una sola accion que cambia de sentido.
     Arriba de la lista apunta abajo y baja una pantalla; mas abajo apunta
     arriba y vuelve al principio de la lista (no al carrusel: ahi el dock se
     esconde, y al volver al principio de las notas quedan a mano el orden y
     los filtros). El rebote vive solo en el giro de la flecha; el circulo
     sigue al dock sin rebote y aparece y se aplasta con resortes amortiguados. */
  var ancla = $("pf-ancla"), cuerpo = ancla.firstElementChild, flecha = cuerpo.firstElementChild;
  var quieto = matchMedia("(prefers-reduced-motion: reduce)");
  // Resortes: masa 1, rigidez k, amortiguacion c. c = 2*raiz(k) no rebota.
  // Los valores son tokens del Figma Master (06 · Web, Web/Resorte/* y
  // Web/Proporción/*): build.py los pone en :root y aca se leen.
  var raiz = getComputedStyle(document.documentElement);
  function tk(n) { return parseFloat(raiz.getPropertyValue("--" + n)); }
  var GAP = tk("ancla-gap"), APRETAR = tk("ancla-apretar"), BAJAR = tk("ancla-bajar"), CAMBIO = tk("ancla-cambio");
  function R(x, k, c) { return { x: x, v: 0, t: x, k: k, c: c }; }
  var M = {
    s: R(0, tk("ancla-aparecer-k"), tk("ancla-aparecer-c")), // aparece y se va con el dock, sin rebote
    q: R(1, tk("ancla-apretar-k"), tk("ancla-apretar-c")),   // aplaste al apretar, sin rebote
    r: R(90, tk("ancla-giro-k"), tk("ancla-giro-c"))          // giro: el unico que rebota
  };
  function inicioLista() { return Math.max(0, document.querySelector("main").offsetTop - $("pf-top").offsetHeight - 8); }
  function arriba() { return window.scrollY > inicioLista() + window.innerHeight * CAMBIO; }
  function medir() {
    var f = $("pf-filters"), r = f.getBoundingClientRect();
    var fuera = f.classList.contains("pf-fuera");
    M.s.t = fuera || modal.open || !lista.length ? 0 : 1;
    var sube = arriba();
    M.r.t = sube ? -90 : 90;
    ancla.setAttribute("aria-label", sube ? "Volver al principio de las notas" : "Bajar");
    ancla.tabIndex = M.s.t ? 0 : -1;
    // Desktop: la x sale del dock (en mobile la pone el CSS).
    if (!esMobile.matches) document.documentElement.style.setProperty("--ancla-x", (r.right + GAP).toFixed(2) + "px");
  }
  function paso(s, dt) { var ac = -s.k * (s.x - s.t) - s.c * s.v; s.v += ac * dt; s.x += s.v * dt; }
  var tAntes = performance.now();
  function anim(now) {
    var dt = Math.min(0.05, (now - tAntes) / 1000); tAntes = now;
    medir();
    if (quieto.matches) { for (var k in M) { M[k].x = M[k].t; M[k].v = 0; } }
    else { var n = Math.ceil(dt / 0.004); for (var j = 0; j < n; j++) for (var k2 in M) paso(M[k2], dt / n); }
    var s = Math.max(0, M.s.x) * M.q.x;
    ancla.style.transform = "scale(" + s.toFixed(4) + ")";
    flecha.style.transform = "rotate(" + M.r.x.toFixed(2) + "deg)";
    requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);

  ancla.addEventListener("pointerdown", function () { M.q.t = APRETAR; });
  function soltarAncla() { M.q.t = 1; }
  ancla.addEventListener("pointerup", soltarAncla);
  ancla.addEventListener("pointercancel", soltarAncla);
  ancla.addEventListener("pointerleave", soltarAncla);
  ancla.addEventListener("click", function () {
    if ($("pf-filters").classList.contains("pf-abierto")) abrirFiltros(false);
    var suave = quieto.matches ? "auto" : "smooth";
    if (arriba()) window.scrollTo({ top: inicioLista(), behavior: suave });
    else window.scrollBy({ top: Math.round(window.innerHeight * BAJAR), behavior: suave });
  });

  /* --- Destacadas ---------------------------------------------------------------
     Cinco notas a pantalla completa. Por defecto, las mas recientes; si
     DESTACADAS trae rutas (n.u), mandan esas, en ese orden. */
  var DESTACADAS = [];
  var dest = DESTACADAS.length
    ? DESTACADAS.map(function (u) { return NOTAS.filter(function (n) { return n.u === u; })[0]; }).filter(Boolean)
    : NOTAS.slice(-5).reverse();
  // Colores de cada placa: fondo, Flor de atras y Flor de adelante. Fondos
  // oscuros de la paleta (el texto tiza va encima) y flores en dos colores
  // vivos, como la historia de Practicas Profesionales (azul, verde, celeste).
  var PARES_DEST = [
    ["#2D8035", "#5EB53A", "#4086FF"],
    ["#003DA5", "#2D8035", "#4086FF"],
    ["#8A4818", "#E57F19", "#EABA2C"],
    ["#2D8035", "#EABA2C", "#5EB53A"],
    ["#003DA5", "#4086FF", "#EABA2C"]
  ];
  // Foto: la de la nota (n.img, la URL en el sitio actual) cuando este en los
  // datos; mientras, fotos de banco de la marca para ver la composicion.
  var FOTOS_DEMO = [1, 2, 3, 4, 5].map(function (i) { return "../novedades/fotos/demo-" + i + ".webp"; });
  function flor() {
    return '<svg viewBox="' + A.formas.flor.vb + '" aria-hidden="true"><use href="#pf-forma-flor" fill="currentColor"/></svg>';
  }
  function escena(n, k) {
    var demo = FOTOS_DEMO[k % FOTOS_DEMO.length];
    return '<div class="pf-d-esc">' +
      '<div class="pf-d-capa pf-d-atras"><div class="pf-d-desliz">' + flor() + "</div></div>" +
      '<div class="pf-d-capa pf-d-foto"><div class="pf-d-desliz"><div class="pf-d-recorte"><img class="pf-carga" src="' + esc(n.img || demo) + '" data-demo="' + demo + '" alt="" decoding="async"' + (k ? ' loading="lazy"' : "") + "></div></div></div>" +
      '<div class="pf-d-capa pf-d-frente"><div class="pf-d-desliz">' + flor() + "</div></div></div>";
  }
  var FLECHA_CTA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  $("pf-dSlides").innerHTML = dest.map(function (n, k) {
    var c = PARES_DEST[k % PARES_DEST.length];
    return '<article class="pf-d-slide" role="group" aria-roledescription="nota" aria-label="' + (k + 1) + " de " + dest.length + '" inert style="--fondo:' + c[0] + ";--atras:" + c[1] + ";--frente:" + c[2] + '">' +
      '<div class="pf-d-art">' + escena(n, k) + "</div>" +
      '<div class="pf-d-txt"><div class="pf-wrap"><div class="pf-d-in">' +
      '<div class="pf-d-kick">' + etq(n.tp, { dato: fechaDato(n.f) }) + "</div>" +
      "<h2" + (n.t.length > 80 ? ' class="pf-largo"' : "") + ">" + esc(n.t) + "</h2>" +
      (n.b ? '<p class="pf-d-bajada">' + esc(n.b) + "</p>" : "") +
      '<button class="pf-d-cta" type="button" data-k="' + k + '">Leer la nota ' + FLECHA_CTA + "</button>" +
      "</div></div></div></article>";
  }).join("");
  $("pf-dSegs").style.setProperty("--n", dest.length);
  $("pf-dSegs").innerHTML = dest.map(function (n, k) {
    return '<button class="pf-d-seg" type="button" data-k="' + k + '" aria-label="Ver destacada ' + (k + 1) + ": " + esc(n.t) + '">' +
      '<span class="pf-d-bar"><i></i></span></button>';
  }).join("");
  // Las fotos aparecen con un fundido al cargar; si la de la nota falla, va la de prueba.
  [].forEach.call($("pf-dSlides").querySelectorAll(".pf-d-foto img"), function (img) {
    function lista() { img.classList.remove("pf-carga"); }
    if (img.complete && img.naturalWidth) lista();
    img.addEventListener("load", lista);
    img.addEventListener("error", function () { if (img.getAttribute("src") !== img.dataset.demo) img.src = img.dataset.demo; });
  });
  var slides = $("pf-dSlides").children, segs = $("pf-dSegs").children, dk = -1;
  var barras = [].map.call(segs, function (s) { return s.querySelector(".pf-d-bar i"); });
  // Tiempos del carrusel: salen de los tokens (--carrusel-*), como el resto.
  var raiz = getComputedStyle(document.documentElement);
  var DURA = parseFloat(raiz.getPropertyValue("--carrusel-dura")) || 7000;
  var PASE = parseFloat(raiz.getPropertyValue("--carrusel-pase")) || 700;
  var CURVA = raiz.getPropertyValue("--carrusel-curva").trim() || "cubic-bezier(0.65, 0, 0.25, 1)";
  var dEl = $("pf-dest"), motivos = {}, pausado = false;
  function pausa(motivo, si) {
    motivos[motivo] = si;
    pausado = Object.keys(motivos).some(function (m) { return motivos[m]; });
  }
  function rot(k) { return (k + dest.length) % dest.length; }
  // Pone la placa i en f anchos de pantalla (0 en el centro, 1 a la derecha).
  // Las capas de adentro leen --sx y --tr para moverse a su propia velocidad.
  function poner(i, f, animar) {
    var tr = animar ? "transform " + PASE + "ms " + CURVA : "none", s = slides[i].style;
    s.transition = tr;
    s.transform = "translateX(" + f * 100 + "%)";
    s.setProperty("--sx", f);
    s.setProperty("--tr", tr);
  }
  // Pasa a la nota k. dir: 1 entra por la derecha, -1 por la izquierda.
  // yaPuesta: la placa nueva ya esta donde la dejo el dedo.
  function irA(k, dir, yaPuesta) {
    k = rot(k);
    var viejo = dk;
    transcurrido = 0;
    if (k === viejo) { poner(k, 0, true); return; }
    dir = dir || (k > viejo ? 1 : -1);
    for (var i = 0; i < slides.length; i++) if (i !== viejo && i !== k) slides[i].classList.remove("pf-vis");
    if (!yaPuesta) poner(k, dir, false);
    slides[k].classList.add("pf-vis");
    void slides[k].offsetWidth;
    poner(k, 0, viejo >= 0);
    slides[k].classList.add("pf-on"); slides[k].inert = false;
    if (viejo >= 0) {
      poner(viejo, -dir, true);
      slides[viejo].classList.remove("pf-on"); slides[viejo].inert = true;
      setTimeout(function () { if (viejo !== dk && !arrastre) slides[viejo].classList.remove("pf-vis"); }, PASE + 40);
    }

      segs[j].classList.toggle("pf-on", j === k);
      if (j === k) segs[j].setAttribute("aria-current", "true"); else segs[j].removeAttribute("aria-current");
    }
    dk = k;
  }
  // Barras como en las stories: las anteriores llenas, la actual llenandose.
  // Las mueve el JS, asi andan aunque el sistema tenga reducido el movimiento.
  var transcurrido = 0, ultimo = 0;
  function tic(t) {
    var d = ultimo ? Math.min(t - ultimo, 100) : 0;
    ultimo = t;
    if (!pausado && !arrastre) {
      transcurrido += d;
      if (transcurrido >= DURA) irA(dk + 1, 1);
    }
    for (var i = 0; i < barras.length; i++) {
      var p = i < dk ? 1 : i > dk ? 0 : Math.min(1, transcurrido / DURA);
      barras[i].style.transform = "scaleX(" + p + ")";
    }
    requestAnimationFrame(tic);
  }
  $("pf-dSegs").addEventListener("click", function (e) { var b = e.target.closest(".pf-d-seg"); if (b) irA(Number(b.dataset.k)); });
  $("pf-dPrev").addEventListener("click", function () { irA(dk - 1, -1); });
  $("pf-dNext").addEventListener("click", function () { irA(dk + 1, 1); });
  $("pf-dSlides").addEventListener("click", function (e) { var b = e.target.closest(".pf-d-cta"); if (b) abrirNota(Number(b.dataset.k), dest); });
  dEl.addEventListener("focusin", function (e) { if (e.target.matches(":focus-visible")) pausa("foco", true); });
  dEl.addEventListener("focusout", function (e) { if (!dEl.contains(e.relatedTarget)) pausa("foco", false); });
  dEl.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") irA(dk - 1, -1);
    if (e.key === "ArrowRight") irA(dk + 1, 1);
  });
  modal.addEventListener("close", function () { pausa("modal", false); });
  new MutationObserver(function () { if (modal.open) pausa("modal", true); }).observe(modal, { attributes: true, attributeFilter: ["open"] });

  /* Gestos de stories sobre las placas (no sobre botones ni indicadores):
     toque corto a la derecha pasa y a la izquierda vuelve; mantener apretado
     pausa; en touch, arrastrar de costado mueve la placa con el dedo. */
  var arrastre = null;
  dEl.addEventListener("pointerdown", function (e) {
    if (e.button > 0 || e.target.closest("button, a, .pf-d-nav")) return;
    arrastre = { x0: e.clientX, y0: e.clientY, t0: Date.now(), dx: 0, mueve: false, vecino: -1, touch: e.pointerType !== "mouse" };
    pausa("toque", true);
  });
  dEl.addEventListener("pointermove", function (e) {
    var a = arrastre; if (!a || !a.touch) return;
    a.dx = e.clientX - a.x0;
    if (!a.mueve) {
      if (Math.abs(a.dx) < 8) return;
      if (Math.abs(e.clientY - a.y0) > Math.abs(a.dx)) { soltar(e, true); return; }
      a.mueve = true;
      try { dEl.setPointerCapture(e.pointerId); } catch (err) {}
    }
    var dir = a.dx < 0 ? 1 : -1, v = rot(dk + dir);
    if (a.vecino !== v && a.vecino !== -1 && a.vecino !== dk) slides[a.vecino].classList.remove("pf-vis");
    a.vecino = v; a.dir = dir;
    poner(dk, a.dx / dEl.clientWidth, false);
    if (v !== dk) { slides[v].classList.add("pf-vis"); poner(v, dir + a.dx / dEl.clientWidth, false); }
  });
  function soltar(e, cancelar) {
    var a = arrastre; if (!a) return;
    arrastre = null;
    pausa("toque", false);
    if (cancelar && !a.mueve) return;
    if (a.mueve) {
      var rapido = Math.abs(a.dx) / Math.max(1, Date.now() - a.t0) > 0.5;
      if (!cancelar && (Math.abs(a.dx) > dEl.clientWidth * 0.2 || rapido)) irA(a.vecino, a.dir, true);
      else {
        poner(dk, 0, true);
        if (a.vecino !== dk) { poner(a.vecino, a.dir, true); var v = a.vecino; setTimeout(function () { if (v !== dk) slides[v].classList.remove("pf-vis"); }, PASE + 40); }
      }
      return;
    }
    // Toque corto: pasa o vuelve. Mantenido: solo fue una pausa.
    if (Date.now() - a.t0 < 300) {
      if (e.clientX < dEl.clientWidth * 0.3) irA(dk - 1, -1); else irA(dk + 1, 1);
    }
  }
  dEl.addEventListener("pointerup", function (e) { soltar(e, false); });
  dEl.addEventListener("pointercancel", function (e) { soltar(e, true); });
  // Fuera de vista el carrusel se frena y el dock de filtros vuelve.
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (en) {
      var r = en[0].intersectionRatio;
      pausa("vista", r < 0.25);
      var tapa = en[0].isIntersecting && r > 0.4;
      if (tapa && $("pf-filters").classList.contains("pf-abierto")) abrirFiltros(false);
      $("pf-filters").classList.toggle("pf-fuera", tapa);
    }, { threshold: [0, 0.25, 0.4, 0.6, 1] }).observe(dEl);
  }
  irA(0);
  requestAnimationFrame(tic);

  aplicar();
})();
</script>
