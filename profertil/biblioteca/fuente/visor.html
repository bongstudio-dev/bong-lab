<style>
/* ==========================================================================
   Visor de documentos Profertil: la página de un documento (boletín, ensayo, hoja de seguridad, informe).
   Misma estructura que la Nota: título arriba a la izquierda y, abajo, tres columnas: el índice de páginas,
   el PDF (todas las páginas una debajo de otra, con scroll continuo) y los datos. Cierra con documentos
   de la misma categoría y el pie.
   Los datos son una copia fija del sitio actual (docs.json); el PDF se dibuja con pdf.js.
   ========================================================================== */
/* Sin sombras: las páginas se separan del fondo por el color y una línea. */
html { scroll-padding-top: 96px; }


/* --- Grilla de tres columnas: índice de páginas, documento y datos. Fila 1 el título, fila 2 el resto. */
.pf-v-grilla { width: min(100% - 32px, 1280px); margin-inline: auto; display: grid; grid-template-columns: 190px minmax(0, 780px) 190px; justify-content: center; gap: 0 56px; padding-top: calc(140px + env(safe-area-inset-top, 0px)); }

/* --- Cabecera: sin caja. La etiqueta completa (forma, rótulo y año) va junto al título. */
.pf-v-cab { grid-column: 2 / -1; grid-row: 1; }
.pf-v-in { display: grid; gap: 18px; justify-items: start; max-width: 900px; }
.pf-v-volver { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; color: var(--ink-2); font-size: var(--texto-chico); text-decoration: none; transition: color 200ms ease; }
@media (hover: hover) and (pointer: fine) { .pf-v-volver:hover { color: var(--azul); } }
.pf-v-in .pf-etiqueta { --s: var(--etq-m); margin-top: 14px; }
.pf-v-in .pf-etiqueta__rotulo { outline: 1px solid var(--line); outline-offset: -1px; }
.pf-v-in h1 { margin: 0; font: 600 clamp(32px, 3.8vw, 52px)/1.04 var(--f-display); letter-spacing: -0.03em; color: var(--azul); text-wrap: balance; overflow-wrap: break-word; }
.pf-v-in h1.pf-largo { font-size: clamp(28px, 3vw, 40px); line-height: 1.08; }

/* --- Documento: las páginas una debajo de otra, con el ancho de la columna. Cada una reserva su lugar con la proporción del PDF y muestra un brillo que pasa mientras se dibuja. */
.pf-v-doc { grid-column: 2; grid-row: 2; margin-top: 56px; min-width: 0; display: grid; gap: 16px; align-content: start; }
.pf-v-pag { position: relative; width: 100%; aspect-ratio: var(--r, 0.7071); overflow: hidden; border-radius: 6px; background: var(--color-blanco); outline: 1px solid var(--line); outline-offset: -1px; scroll-margin-top: 96px; }
.pf-v-pag canvas { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity 400ms ease; }
.pf-v-pag.pf-lista canvas { opacity: 1; }
.pf-v-pag.pf-esqueleto { background: linear-gradient(100deg, transparent 35%, color-mix(in srgb, var(--color-blanco) 70%, transparent) 50%, transparent 65%) var(--card); background-size: 250% 100%; animation: pf-brillo 1.5s linear infinite; }
@media (prefers-reduced-motion: reduce) { .pf-v-pag canvas, .pf-v-cuenta, .pf-aviso { transition: none; } }
.pf-v-num { position: absolute; z-index: 2; right: 10px; bottom: 8px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 62%, transparent); color: var(--tiza); font-size: var(--texto-mini); font-variant-numeric: tabular-nums; opacity: 0; transition: opacity 200ms ease; pointer-events: none; }
@media (hover: hover) and (pointer: fine) { .pf-v-pag:hover .pf-v-num { opacity: 1; } }

/* Capa de texto: el texto del PDF, invisible, encima del dibujo. Permite seleccionar y copiar, y que la búsqueda del
   navegador (Cmd+F) encuentre palabras dentro del documento. Las posiciones son relativas a la página y el tamaño de
   letra sale de --total-scale-factor (ancho en pantalla / ancho del PDF), así acompaña el zoom sin rehacerse.
   Reglas de pdf.js (web/pdf_viewer.css), reducidas a lo que usa este visor. */
.pf-v-pag .textLayer { position: absolute; inset: 0; width: 100% !important; height: 100% !important; overflow: clip; line-height: 1; text-align: initial; text-size-adjust: none; -webkit-text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; z-index: 1; }
.pf-v-pag .textLayer :is(span, br) { position: absolute; color: transparent; white-space: pre; cursor: text; transform-origin: 0% 0%; }
.pf-v-pag .textLayer span.markedContent { top: 0; height: 0; }
.pf-v-pag .textLayer ::selection { background: color-mix(in srgb, var(--azul) 28%, transparent); color: transparent; }
.pf-v-pag .textLayer br::selection { background: transparent; }

/* --- Zoom: las páginas crecen desde el ancho de la columna. El documento se come los márgenes (hasta 16 px del borde)
   y, si no entra, se desplaza de costado. En pantallas anchas el índice y los datos se ocultan mientras dura. */
body.pf-zoom .pf-v-doc { --w: min(var(--pw), 100vw - 32px); width: var(--w); margin-inline: min(0px, (100% - var(--w)) / 2); grid-template-columns: var(--pw); overflow-x: auto; overscroll-behavior-x: contain; }
@media (min-width: 1101px) { body.pf-zoom :is(.pf-v-indice, .pf-v-datos) { visibility: hidden; } }

/* Cuando el PDF no está en la maqueta o no se pudo leer: un aviso en el lugar del documento. */
.pf-v-aviso { display: grid; justify-items: start; gap: 14px; padding: 28px; border-radius: var(--radio-tarjeta); background: var(--card); }
.pf-v-aviso p { margin: 0; max-width: 52ch; font-size: var(--texto-destacado); line-height: 1.5; color: var(--ink-2); }
.pf-v-aviso strong { color: var(--azul); font-weight: 600; }

/* --- Datos, a la derecha: sin rótulos. Páginas y modo lectura pegados y en azul, descarga y compartir. */
.pf-v-datos { grid-column: 3; grid-row: 2; align-self: start; position: sticky; top: 112px; margin: 56px 0 0; display: grid; justify-items: start; gap: 14px; font-size: var(--texto-chico); }
.pf-v-par { display: flex; gap: 4px; }
.pf-v-pags { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 9px; border-radius: 999px; background: var(--azul); color: var(--tiza); font-size: var(--texto-mini); font-variant-numeric: tabular-nums; }
.pf-v-pags svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pf-v-foco, .pf-v-copiar { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border-radius: 999px; cursor: pointer; transition: color 200ms ease, border-color 200ms ease, background 200ms ease; }
.pf-v-foco { border: 0; background: var(--azul); color: var(--tiza); }
.pf-v-foco svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pf-v-copiar { border: 1px solid var(--line); background: transparent; color: var(--ink-2); }
.pf-v-copiar svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (hover: hover) and (pointer: fine) { .pf-v-foco:hover { background: var(--ink); } .pf-v-copiar:hover { color: var(--azul); border-color: var(--azul); } }
.pf-v-bajar { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.pf-doc__d::after { content: ""; position: absolute; inset: -8px; border-radius: 999px; }
/* Pastilla de abajo: aparece al entrar al documento. Dice en qué página se está (donde no hay índice: pantallas
   medianas, celular, modo lectura y zoom) y, con mouse, lleva el zoom: alejar, nivel (vuelve al ancho) y acercar.
   En pantallas táctiles el zoom es el de dos dedos y la página se vuelve a dibujar nítida al soltar. */
.pf-v-cuenta { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 50; translate: -50% 12px; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 86%, transparent); color: var(--tiza); font-size: var(--texto-chico); font-variant-numeric: tabular-nums; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 240ms ease, translate 320ms var(--ease), visibility 0s 320ms; }
.pf-v-cuenta.pf-on { opacity: 1; visibility: visible; translate: -50% 0; pointer-events: auto; transition-delay: 0s; }
.pf-v-cuenta__n { padding: 0 10px; line-height: 30px; pointer-events: none; }
.pf-v-cuenta__sep { width: 1px; height: 16px; margin-inline: 2px; background: color-mix(in srgb, var(--tiza) 28%, transparent); }
.pf-v-zoom { display: flex; align-items: center; gap: 2px; }
.pf-v-zoom button { display: grid; place-items: center; min-width: 30px; height: 30px; padding: 0; border: 0; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-size: var(--texto-mini); cursor: pointer; transition: background 160ms ease, opacity 160ms ease; }
.pf-v-zoom button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.pf-v-zoom .pf-v-zoom__nivel { min-width: 48px; }
.pf-v-zoom button:disabled { opacity: .38; cursor: default; }
.pf-v-zoom button:focus-visible { outline: 2px solid var(--tiza); outline-offset: -2px; }
@media (hover: hover) and (pointer: fine) { .pf-v-zoom button:not(:disabled):hover { background: color-mix(in srgb, var(--tiza) 14%, transparent); } }
@media (hover: none), (pointer: coarse) { .pf-v-zoom, .pf-v-cuenta__sep { display: none; } .pf-v-cuenta { padding: 3px 4px; } }
.pf-v-cuenta.pf-una :is(.pf-v-cuenta__n, .pf-v-cuenta__sep) { display: none; }
/* Con el índice a la vista, el número de página sobra: queda solo el zoom. */
@media (min-width: 1101px) { body:not(.pf-foco):not(.pf-zoom) :is(.pf-v-cuenta__n, .pf-v-cuenta__sep) { display: none; } }
.pf-v-bajar svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* --- Índice de páginas, a la izquierda: fijo al bajar. El punto azul viaja con un resorte (el de la librería) hasta la página que se está leyendo. */
.pf-v-indice { grid-column: 1; grid-row: 2; align-self: start; position: sticky; top: 112px; margin-top: 56px; max-height: calc(100vh - 150px); overflow-y: auto; scrollbar-width: none; font-size: var(--texto-chico); }
.pf-v-indice::-webkit-scrollbar { display: none; }
.pf-v-indice ol { position: relative; margin: 0; padding: 0 0 0 18px; list-style: none; display: grid; gap: 8px; }
.pf-v-indice a { display: block; color: var(--ink-2); line-height: 1.35; text-decoration: none; font-variant-numeric: tabular-nums; transition: color 200ms ease, translate var(--punto-dura, 320ms) var(--punto-curva, var(--ease)); }
.pf-v-indice a.pf-on { color: var(--azul); translate: 4px 0; }
@media (hover: hover) and (pointer: fine) { .pf-v-indice a:hover { color: var(--azul); translate: 4px 0; } }
.pf-v-indice__punto { position: absolute; left: 0; top: 0; width: 7px; height: 7px; border-radius: 999px; background: var(--azul); translate: 0 var(--y, 0px); transition: translate var(--punto-dura, 420ms) var(--punto-curva, var(--ease)); }
@media (prefers-reduced-motion: reduce) { .pf-v-indice a, .pf-v-indice__punto { transition: none; } }

/* --- Modo lectura: queda el documento, con más ancho. Se sale con el mismo botón, el de arriba a la derecha o Esc. */
body.pf-foco :is(.pf-barra, .pf-v-indice, .pf-v-datos, .pf-v-cab, .pf-v-sigue, .pf-pie) { display: none; }
body.pf-foco .pf-v-grilla { grid-template-columns: minmax(0, 860px); padding-top: 40px; }
body.pf-foco .pf-v-doc { grid-column: 1; grid-row: 1; margin-top: 0; padding-bottom: 120px; }
.pf-v-salir { position: fixed; top: calc(20px + env(safe-area-inset-top, 0px)); right: 20px; z-index: 60; display: inline-flex; align-items: center; gap: 10px; height: 38px; padding: 0 8px 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--ink-2); font-size: var(--texto-chico); cursor: pointer; }
.pf-v-salir kbd { padding: 3px 7px; border-radius: 999px; background: var(--card); font: inherit; font-size: var(--texto-mini); color: var(--ink-2); }
@media (hover: hover) and (pointer: fine) { .pf-v-salir:hover { color: var(--azul); border-color: var(--azul); } }
@media (hover: none) { .pf-v-salir kbd { display: none; } }

/* --- Más documentos: filas, las mismas de la lista. */
.pf-v-sigue { margin-top: 128px; }
.pf-v-sigue__cab { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; margin-bottom: 20px; }
.pf-v-sigue__cab h2 { margin: 0; font: 600 var(--texto-subtitulo)/1.1 var(--f-display); letter-spacing: -0.02em; color: var(--azul); }
.pf-v-sigue__cab a { display: inline-flex; align-items: center; gap: 6px; color: var(--azul); font-size: var(--texto-chico); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--celeste) 60%, transparent); }


/* --- Pantallas medianas y celular: una columna; el índice se va y los datos pasan arriba del documento. */
@media (max-width: 1100px) {
  .pf-v-grilla { grid-template-columns: minmax(0, 780px); }
  .pf-v-cab, .pf-v-datos, .pf-v-doc { grid-column: 1; }
  .pf-v-datos { grid-row: 2; position: static; margin: 28px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .pf-v-doc { grid-row: 3; margin-top: 28px; }
  .pf-v-indice { display: none; }
  /* Sin cursor fino, los controles redondos suben a 40 px (el alto del botón de descarga). */
  .pf-v-foco, .pf-v-copiar { width: 40px; height: 40px; }
  .pf-v-pags { height: 40px; padding: 0 14px 0 11px; }
}
@media (max-width: 640px) {
  .pf-v-grilla { padding-top: calc(108px + env(safe-area-inset-top, 0px)); }
  .pf-v-in { gap: 14px; }
  .pf-v-in .pf-etiqueta { margin-top: 10px; }
  /* Descarga, páginas, modo lectura y link en una sola línea. */
  .pf-v-datos { flex-wrap: nowrap; gap: 6px; }
  .pf-v-pdf { display: none; }
  .pf-v-datos .pf-boton { padding-inline: 14px; }
  .pf-v-in h1 { font-size: 2rem; }
  .pf-v-in h1.pf-largo { font-size: 1.65rem; }
  .pf-v-sigue { margin-top: 80px; }
  .pf-v-aviso { padding: 20px; }
}

<script>
(function () {
  "use strict";
  var DOCS = /*__DOCS__*/[];
  var A = /*__ASSETS__*/{};

  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  defs.insertAdjacentHTML("beforeend", simbolos);

/*__COMUN__*/

  var FLECHA_IZQ = '<svg class="pf-flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 12H7M11 8l-4 4 4 4"/></svg>';
  var FLECHA_DER = '<svg class="pf-flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10M13 8l4 4-4 4"/></svg>';
  var BAJAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13M6 13l6 6 6-6"/></svg>';

  // Qué documento: ?d=<id>. Sin parámetro, el primero de la lista.
  var pedido = new URLSearchParams(location.search).get("d");
  var d = DOCS.filter(function (x) { return x.id === pedido; })[0];
  // Un link a un documento que no existe vuelve a la lista.
  if (pedido && !d) { location.replace("../"); return; }
  d = d || DOCS[0];
  var cat = POR[d.c];
  // Dónde leer el PDF: la copia de la maqueta (la original no se puede leer desde otro dominio). `l` es un nombre de
  // archivo de ../pdf/ o una dirección completa de un alojamiento que permita leerlo.
  function copia(x) { return !x.l ? null : /^https?:\/\//.test(x.l) ? x.l : "../pdf/" + encodeURIComponent(x.l); }
  var url = copia(d);
  // La Biblioteca es la lista de esta maqueta. Las hojas de seguridad y los informes para inversores tienen su propia página
  // (fuera de esta maqueta): el visor los abre igual, sin el link de vuelta a una lista.
  var enBiblioteca = d.c !== "msds" && d.c !== "inversores";
  document.title = d.t + (enBiblioteca ? " · Biblioteca Virtual Profertil" : " · Profertil");

  /* --- Cabecera y datos -------------------------------------------------------------- */
  $("pf-cabIn").innerHTML =
    (enBiblioteca ? '<a class="pf-v-volver" href="../">' + FLECHA_IZQ + "Biblioteca</a>" : "") + etq(d.c, d.y || "") +
    "<h1" + (d.t.length > 90 ? ' class="pf-largo"' : "") + ">" + esc(d.t) + "</h1>";
  var bajarHref = url || d.u;
  function datos(paginas) {
    $("pf-datos").innerHTML =
      '<a class="pf-boton pf-boton--verde pf-v-bajar" href="' + esc(bajarHref) + '"' + (url ? " download" : ' target="_blank" rel="noopener"') + ">" + BAJAR + 'Descargar<span class="pf-v-pdf">&nbsp;PDF</span></a>' +
      '<div class="pf-v-par">' +
      (paginas ? '<span class="pf-v-pags"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5"/></svg>' + paginas + (paginas === 1 ? " página" : " páginas") + "</span>" : "") +
      (paginas ? '<button class="pf-v-foco" id="pf-foco" type="button" aria-pressed="false" aria-label="Modo lectura" title="Modo lectura"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>' : "") +
      "</div>" +
      '<button class="pf-v-copiar" id="pf-copiar" type="button" aria-label="Copiar el link" title="Copiar el link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>';
    if (paginas) $("pf-foco").addEventListener("click", function () { foco(!document.body.classList.contains("pf-foco")); });
    $("pf-copiar").addEventListener("click", function () {
      var ok = function () { avisar("Link copiado"); };
      if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(ok, function () { avisar("No se pudo copiar"); });
      else avisar("No se pudo copiar");
    });
  }
  datos(0);

  var ta;
  function avisar(txt) { var a = $("pf-aviso"); a.textContent = txt; a.classList.add("pf-on"); clearTimeout(ta); ta = setTimeout(function () { a.classList.remove("pf-on"); }, 2000); }

  // Modo lectura: queda el documento. Se sale con el mismo botón, el de arriba o Esc, sin perder el punto de lectura.
  function foco(on) {
    var ref = paginas[Math.max(0, actual)], y = ref ? ref.el.getBoundingClientRect().top : 0;
    document.body.classList.toggle("pf-foco", on);
    $("pf-foco").setAttribute("aria-pressed", on);
    $("pf-focoSalir").hidden = !on;
    anchoCambio();
    if (ref) window.scrollBy(0, ref.el.getBoundingClientRect().top - y);
    // El foco del teclado acompaña: al entrar va al botón de salir (el que se apretó deja de verse) y al salir vuelve.
    (on ? $("pf-focoSalir") : $("pf-foco")).focus({ preventScroll: true });
    cuenta();
  }
  $("pf-focoSalir").addEventListener("click", function () { foco(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && document.body.classList.contains("pf-foco")) foco(false); });

  /* --- Documentos de la misma categoría ----------------------------------------------- */
  function fila(x) {
    var li = document.createElement("li");
    li.className = "pf-doc";
    var bajar = x.l ? 'href="' + esc(copia(x)) + '" download' : 'href="' + esc(x.u) + '" target="_blank" rel="noopener"';
    li.innerHTML = etq(x.c) + '<h3 class="pf-doc__t"><a href="?d=' + encodeURIComponent(x.id) + '">' + esc(x.t) + "</a></h3>" +
      '<span class="pf-doc__y">' + (x.y || "") + "</span>" +
      '<a class="pf-doc__d" ' + bajar + ' aria-label="Descargar PDF: ' + esc(x.t) + '">' + BAJAR + "</a>";
    return li;
  }
  (function () {
    // Mismo año primero (si tiene), después los que tienen copia; el resto, por cercanía en el orden alfabético.
    var otros = DOCS.filter(function (x) { return x.c === d.c && x.id !== d.id; });
    var pos = DOCS.indexOf(d);
    otros.sort(function (a, b) {
      var pa = (d.y && a.y === d.y ? 0 : 2) + (a.l ? 0 : 1), pb = (d.y && b.y === d.y ? 0 : 2) + (b.l ? 0 : 1);
      if (pa !== pb) return pa - pb;
      return Math.abs(DOCS.indexOf(a) - pos) - Math.abs(DOCS.indexOf(b) - pos);
    });
    otros.slice(0, 4).forEach(function (x) { $("pf-rel").appendChild(fila(x)); });
    $("pf-sigueT").textContent = "Más de " + cat.nombre.toLowerCase();
    if (enBiblioteca) $("pf-sigueTodos").innerHTML = "Ver toda la Biblioteca " + FLECHA_DER;
    else $("pf-sigueTodos").hidden = true;
  })();

  /* --- Curva del punto: un resorte apenas subamortiguado, muestreado como linear(). --------- */
  (function () {
    if (!CSS.supports || !CSS.supports("transition-timing-function", "linear(0, 1)")) return;
    var k = 230, c = 25, x = 0, v = 0, dt = 1 / 1000, pts = [], t = 0;
    while (t < 2) {
      for (var i = 0; i < 16; i++) { v += (-k * (x - 1) - c * v) * dt; x += v * dt; t += dt; }
      pts.push(x.toFixed(4));
      if (Math.abs(x - 1) < .0015 && Math.abs(v) < .02) break;
    }
    pts[pts.length - 1] = "1";
    var raiz = document.documentElement.style;
    raiz.setProperty("--punto-curva", "linear(0, " + pts.join(", ") + ")");
    raiz.setProperty("--punto-dura", Math.round(t * 1000) + "ms");
  })();

  /* --- El documento ------------------------------------------------------------------------ */
  var paginas = [];   // { el, canvas, n, ratio, pdf, ancho }
  var actual = -1, pdfDoc = null, lib = null;

  function sinCopia(msg) {
    $("pf-doc").innerHTML = '<div class="pf-v-aviso"><p>' + msg + '</p><a class="pf-boton pf-boton--verde pf-v-bajar" href="' + esc(d.u) + '" target="_blank" rel="noopener">Abrir el PDF</a></div>';
    $("pf-visor").removeAttribute("aria-busy");
  }

  // Densidad con la que se dibuja una página: la de la pantalla (hasta 2x) y, si se agrandó con dos dedos y la página
  // está a la vista, también ese aumento (hasta 3x). Las que no se ven no lo pagan.
  var vv = window.visualViewport;
  function escala(p) {
    var e = Math.min(window.devicePixelRatio || 1, 2);
    if (vv && vv.scale > 1.05) {
      var r = p.el.getBoundingClientRect();
      if (r.bottom > vv.offsetTop && r.top < vv.offsetTop + vv.height) e *= Math.min(vv.scale, 3);
    }
    return Math.round(e * 100) / 100;
  }
  // Dibuja una página al ancho de su caja. El lienzo no pasa de 16 millones de píxeles (el tope de Safari en iPhone).
  function dibujar(p) {
    if (p.dibujando) return;
    var w = p.el.clientWidth; if (!w) return;
    var e = escala(p);
    if (p.hecha && p.ancho && Math.abs(p.ancho - w) < 24 && p.esc === e) return;
    p.dibujando = true;
    pdfDoc.getPage(p.n).then(function (pg) {
      var base = pg.getViewport({ scale: 1 });
      var s = (w * e) / base.width, area = base.width * base.height * s * s;
      if (area > 16e6) s *= Math.sqrt(16e6 / area);
      var vp = pg.getViewport({ scale: s });
      var c = document.createElement("canvas");
      c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      return pg.render({ canvasContext: c.getContext("2d"), viewport: vp, canvas: c }).promise.then(function () {
        pg.cleanup();
        if (p.lejos) { c.width = c.height = 0; return; }   // se alejó mientras se dibujaba
        if (p.canvas) p.canvas.remove();
        p.canvas = c; p.el.insertBefore(c, p.el.firstChild);
        p.ancho = w; p.esc = e; p.hecha = true;
        p.el.classList.remove("pf-esqueleto"); void c.offsetWidth; p.el.classList.add("pf-lista");
      });
    }).catch(function () {}).then(function () {
      p.dibujando = false;
      // Si mientras se dibujaba cambió el ancho (zoom, ventana) o el aumento, se vuelve a dibujar.
      if (p.hecha && !p.lejos && p.el.clientWidth && (Math.abs(p.el.clientWidth - p.ancho) >= 24 || escala(p) !== p.esc)) dibujar(p);
    });
  }
  // Vuelve a dibujar las páginas cercanas a la pantalla (después de un cambio de ancho o de zoom).
  function redibujar() {
    paginas.forEach(function (p) {
      var r = p.el.getBoundingClientRect();
      if (r.top < innerHeight * 3 && r.bottom > -innerHeight * 2) dibujar(p);
    });
  }
  if (vv) { var tVv; vv.addEventListener("resize", function () { clearTimeout(tVv); tVv = setTimeout(redibujar, 220); }); }
  var vigia = "IntersectionObserver" in window ? new IntersectionObserver(function (en) {
    en.forEach(function (e) { if (e.isIntersecting) dibujar(e.target.__p); });
  }, { rootMargin: "1400px 0px" }) : null;
  // Las páginas que quedan lejos de la pantalla sueltan su dibujo (un documento largo no acumula cientos de imágenes
  // en memoria) y vuelven a dibujarse al acercarse.
  function soltar(p) {
    if (!p.canvas) return;
    p.canvas.width = p.canvas.height = 0; p.canvas.remove(); p.canvas = null;
    p.hecha = false; p.el.classList.remove("pf-lista"); p.el.classList.add("pf-esqueleto");
  }
  var lejos = vigia ? new IntersectionObserver(function (en) {
    en.forEach(function (e) { var p = e.target.__p; p.lejos = !e.isIntersecting; if (p.lejos) soltar(p); });
  }, { rootMargin: "5000px 0px" }) : null;

  /* --- Zoom ---------------------------------------------------------------------------------- */
  var NIVELES = [1, 1.25, 1.5, 2], nivel = 0;
  var CON_ZOOM = matchMedia("(hover: hover) and (pointer: fine)").matches;
  // Ancho de la columna del documento, leído de la grilla (no cambia con el zoom).
  function anchoBase() {
    var t = getComputedStyle($("pf-grilla")).gridTemplateColumns.split(" ").map(parseFloat);
    return t.length >= 3 ? t[1] : t[0];
  }
  // Ancho de las páginas según el zoom, y la escala de la capa de texto de cada una.
  function medidas() {
    var doc = $("pf-doc");
    if (NIVELES[nivel] > 1) doc.style.setProperty("--pw", Math.round(anchoBase() * NIVELES[nivel]) + "px");
    else doc.style.removeProperty("--pw");
    if (!paginas.length) return;
    var w = paginas[0].el.clientWidth;
    paginas.forEach(function (p) { if (p.w0) p.el.style.setProperty("--total-scale-factor", (w / p.w0).toFixed(5)); });
  }
  // Cambia el nivel sin perder el punto de lectura: la línea que estaba a 40% de la pantalla sigue ahí, y de costado
  // se conserva el centro.
  var tZoom;
  function zoom(i) {
    i = Math.max(0, Math.min(NIVELES.length - 1, i));
    if (i === nivel || !paginas.length) return;
    var doc = $("pf-doc"), ref = paginas[Math.max(0, actual)], y0 = innerHeight * 0.4;
    var r = ref.el.getBoundingClientRect(), fy = (y0 - r.top) / r.height;
    var fx = doc.scrollWidth > doc.clientWidth ? (doc.scrollLeft + doc.clientWidth / 2) / doc.scrollWidth : 0.5;
    nivel = i;
    document.body.classList.toggle("pf-zoom", NIVELES[i] > 1);
    medidas();
    r = ref.el.getBoundingClientRect();
    window.scrollBy(0, r.top + fy * r.height - y0);
    doc.scrollLeft = fx * doc.scrollWidth - doc.clientWidth / 2;
    botonesZoom();
    alScroll(); marcar(); cuenta();
    clearTimeout(tZoom); tZoom = setTimeout(redibujar, 120);
  }
  function botonesZoom() {
    $("pf-zNivel").textContent = Math.round(NIVELES[nivel] * 100) + "%";
    $("pf-zNivel").disabled = nivel === 0;
    $("pf-zMenos").disabled = nivel === 0;
    $("pf-zMas").disabled = nivel === NIVELES.length - 1;
  }
  botonesZoom();
  $("pf-zMenos").addEventListener("click", function () { zoom(nivel - 1); });
  $("pf-zMas").addEventListener("click", function () { zoom(nivel + 1); });
  $("pf-zNivel").addEventListener("click", function () { zoom(0); });
  // Cmd/Ctrl + y − (y 0 para volver al ancho) manejan el zoom del documento en vez del de la página.
  document.addEventListener("keydown", function (e) {
    if (!CON_ZOOM || !paginas.length || !(e.metaKey || e.ctrlKey) || e.altKey) return;
    var k = e.key;
    if (k === "+" || k === "=") zoom(nivel + 1);
    else if (k === "-" || k === "_") zoom(nivel - 1);
    else if (k === "0") zoom(0);
    else return;
    e.preventDefault();
  });

  var tAncho;
  function anchoCambio() { medidas(); clearTimeout(tAncho); tAncho = setTimeout(redibujar, 160); }
  window.addEventListener("resize", anchoCambio);

  /* --- Capa de texto -------------------------------------------------------------------------- */
  // Se arma una vez por página, de a una y en los ratos libres, empezando por la que se está leyendo. No se suelta al
  // alejarse (pesa poco) para que la búsqueda del navegador encuentre palabras en todo el documento.
  function textos() {
    if (!lib.TextLayer) return;
    var desde = Math.max(0, actual), orden = paginas.slice(desde).concat(paginas.slice(0, desde)), i = 0;
    var luego = window.requestIdleCallback || function (f) { setTimeout(f, 30); };
    (function sig() {
      var p = orden[i++]; if (!p) return;
      pdfDoc.getPage(p.n).then(function (pg) {
        return pg.getTextContent().then(function (tc) {
          if (!tc.items.length) return;
          var capa = document.createElement("div");
          capa.className = "textLayer";
          p.el.appendChild(capa);
          return new lib.TextLayer({ textContentSource: tc, container: capa, viewport: pg.getViewport({ scale: 1 }) }).render();
        });
      }).catch(function () {}).then(function () { luego(sig); });
    })();
  }

  function armar(pdf) {
    pdfDoc = pdf;
    var n = pdf.numPages;
    datos(n);
    $("pf-doc").innerHTML = "";
    for (var i = 1; i <= n; i++) {
      var el = document.createElement("div");
      el.className = "pf-v-pag pf-esqueleto"; el.id = "pf-p" + i;
      el.setAttribute("role", "group"); el.setAttribute("aria-label", "Página " + i + " de " + n);
      el.insertAdjacentHTML("beforeend", '<span class="pf-v-num" aria-hidden="true">' + i + " / " + n + "</span>");
      var p = { el: el, n: i, canvas: null }; el.__p = p; paginas.push(p);
      $("pf-doc").appendChild(el);
    }
    // La proporción de cada página, para reservar su lugar sin saltos (las páginas pueden tener tamaños distintos).
    var ratios = paginas.map(function (p) {
      return pdf.getPage(p.n).then(function (pg) { var v = pg.getViewport({ scale: 1 }); p.w0 = v.width; p.el.style.setProperty("--r", (v.width / v.height).toFixed(5)); });
    });
    paginas.forEach(function (p) { if (vigia) { vigia.observe(p.el); lejos.observe(p.el); } else dibujar(p); });
    indice(n);
    $("pf-visor").removeAttribute("aria-busy");
    Promise.all(ratios).then(function () { medidas(); alScroll(); irAHash(); marcar(); textos(); });
  }

  // Índice de páginas, a la izquierda: solo si el documento tiene más de una.
  function indice(n) {
    if (n < 2) return;
    var h = "<ol>";
    for (var i = 1; i <= n; i++) h += '<li><a href="#p-' + i + '" data-p="' + i + '">Página ' + i + "</a></li>";
    $("pf-indice").innerHTML = h + "</ol>";
    $("pf-indice").firstChild.insertAdjacentHTML("afterbegin", '<span class="pf-v-indice__punto" aria-hidden="true"></span>');
    $("pf-indice").hidden = false;
    $("pf-indice").addEventListener("click", function (e) {
      var a = e.target.closest("a"); if (!a) return;
      e.preventDefault(); ir(Number(a.dataset.p));
    });
  }
  function ir(n) {
    var p = paginas[n - 1]; if (!p) return;
    p.el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    history.replaceState(null, "", "#p-" + n);
  }
  function irAHash() {
    var m = /^#p-(\d+)$/.exec(location.hash);
    if (m && paginas[Number(m[1]) - 1]) paginas[Number(m[1]) - 1].el.scrollIntoView({ behavior: "auto" });
  }
  function cuenta() {
    var c = $("pf-cuenta"), varias = paginas.length > 1;
    if (!paginas.length || (!varias && !CON_ZOOM)) { c.classList.remove("pf-on"); return; }
    var r = $("pf-doc").getBoundingClientRect();
    $("pf-cuentaN").textContent = (Math.max(0, actual) + 1) + " / " + paginas.length;
    c.classList.toggle("pf-una", !varias);
    var dentro = r.top < innerHeight * 0.5 && r.bottom > innerHeight * 0.6;
    // Si el foco del teclado está en la pastilla, no se esconde debajo.
    if (!dentro && c.contains(document.activeElement)) document.activeElement.blur();
    c.classList.toggle("pf-on", dentro);
  }
  function marcar() {
    if (!paginas.length) return;
    var act = 0, corte = innerHeight * 0.4;
    for (var i = 0; i < paginas.length; i++) { if (paginas[i].el.getBoundingClientRect().top < corte) act = i; else break; }
    var cambio = act !== actual;
    actual = act; cuenta();
    if (!cambio || $("pf-indice").hidden) return;
    var links = $("pf-indice").querySelectorAll("a");
    [].forEach.call(links, function (a, i) { a.classList.toggle("pf-on", i === act); });
    var a = links[act], ol = a.closest("ol");
    ol.style.setProperty("--y", Math.round(a.offsetTop + a.offsetHeight / 2 - 3.5) + "px");
    // En documentos largos el índice se desplaza para dejar a la vista la página activa.
    var ind = $("pf-indice"), top = a.offsetTop, bajo = top + a.offsetHeight;
    if (top < ind.scrollTop + 8) ind.scrollTo({ top: Math.max(0, top - 24), behavior: "smooth" });
    else if (bajo > ind.scrollTop + ind.clientHeight - 8) ind.scrollTo({ top: bajo - ind.clientHeight + 24, behavior: "smooth" });
  }
  // Progreso de lectura del documento (la línea de la barra).
  function alScroll() {
    var r = $("pf-doc").getBoundingClientRect();
    var ini = window.scrollY + r.top - 120, fin = window.scrollY + r.bottom - innerHeight;
    $("pf-progreso").style.setProperty("--p", Math.min(1, Math.max(0, (window.scrollY - ini) / Math.max(1, fin - ini))).toFixed(4));
  }
  window.addEventListener("scroll", function () { alScroll(); marcar(); }, { passive: true });

  /* --- Carga ------------------------------------------------------------------------------- */
  if (!url) {
    sinCopia("El PDF de este documento no está disponible en el sitio actual. Se puede probar abrirlo desde su dirección original.");
  } else {
    // Mientras llega, un lugar con la proporción de una hoja A4 y el brillo.
    $("pf-doc").innerHTML = '<div class="pf-v-pag pf-esqueleto"></div>';
    import("../vendor/pdf.min.mjs").then(function (m) {
      lib = m;
      lib.GlobalWorkerOptions.workerSrc = new URL("../vendor/pdf.worker.min.mjs", location.href).href;
      return lib.getDocument({ url: url }).promise;
    }).then(armar).catch(function () {
      sinCopia("No se pudo abrir el documento en la página. Se puede descargar o abrir desde su dirección original.");
    }).then(function () { alScroll(); });
  }
})();
</script>
