<head>

<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Los colores, tipografías y movimientos salen de tokens.css (generado desde el Master). Acá solo lo propio de la librería. */
:root {
  color-scheme: light;
  --suave: rgba(10, 30, 74, .055);
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --r: 10px;      /* controles y código */
  --r-l: 16px;    /* vistas previas */
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 13.5px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
::selection { background: var(--azul); color: var(--card); }
html { scrollbar-color: rgba(10, 30, 74, .25) transparent; }
.tabla, .ctl small { font-variant-numeric: tabular-nums; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Sidebar (sin cambios) ---------- */
.app { display: grid; grid-template-columns: 188px minmax(0, 1fr); min-height: 100vh; }
.lado { position: sticky; top: 0; height: 100vh; overflow: auto; padding: 18px 14px 24px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px; }
.lado__volver { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-3); text-decoration: none; }
.lado__volver .ico { width: 14px; height: 14px; stroke-width: 2; }
.lado__volver:hover { color: var(--azul); }
.lado__tit { display: block; color: inherit; text-decoration: none; margin: 0; border: 0; background: none; padding: 0; text-align: left; font: 600 15px/1.1 var(--f-display); letter-spacing: -.02em; }
.lado__tit small { display: block; margin-top: 4px; font: 400 11px/1.3 var(--f-body); letter-spacing: 0; color: var(--ink-3); }
.lado nav { display: flex; flex-direction: column; gap: 16px; }
.grupo__tit { margin: 0 0 5px; font: 500 10px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.grupo ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.item { text-decoration: none; display: flex; justify-content: space-between; align-items: center; gap: 6px; width: calc(100% + 12px); margin: 0 -6px; padding: 5px 6px; border: 0; border-radius: 7px; background: none; text-align: left; font-size: 12px; line-height: 1.25; color: var(--ink-2); transition: background .2s var(--ease), color .2s var(--ease); }
.item:hover { background: var(--suave); color: var(--ink); }
.item[aria-current="page"] { background: var(--azul); color: #fff; }
.item .n { font-size: 10px; opacity: .55; font-variant-numeric: tabular-nums; }

.centro { min-width: 0; }

/* ---------- Galería ---------- */
.gal { padding: 40px 32px 72px; max-width: 1400px; }
.gal h1 { margin: 0 0 6px; font: 600 28px/1.1 var(--f-display); letter-spacing: -.025em; }
.gal > p { margin: 0 0 32px; max-width: 56ch; color: var(--ink-2); }
.grilla { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 20px; }
.tar { color: inherit; text-decoration: none; display: flex; flex-direction: column; gap: 10px; border: 0; padding: 0; background: none; text-align: left; }
.tar__vista { position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-radius: var(--r-l); background: var(--bg); box-shadow: 0 0 0 1px var(--line); pointer-events: none; transition: box-shadow .15s var(--ease); }
.tar:hover .tar__vista { box-shadow: 0 0 0 1px rgba(10, 30, 74, .28); }
.tar__vista iframe { position: absolute; left: 50%; top: 50%; width: 1280px; height: 800px; border: 0; transform-origin: 50% 50%; transform: translate(-50%, -50%) scale(var(--esc, .3)); background: var(--bg); }
.tar b { font: 500 14px/1.2 var(--f-body); }
.tar span { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-3); }

/* ---------- Ficha ---------- */
.ficha { display: grid; grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); gap: 32px; padding: 16px 16px 16px 32px; }
.doc { min-width: 0; padding: 24px 0 56px; display: flex; flex-direction: column; gap: 32px; }
.migas { text-decoration: none; border: 0; background: none; padding: 0; font-size: 12px; color: var(--ink-3); }
.migas:hover { color: var(--ink); }
.doc h1 { margin: 8px 0 8px; font: 600 28px/1.1 var(--f-display); letter-spacing: -.025em; }
.doc .bajada { margin: 0; color: var(--ink-2); }
.doc h2 { margin: 0 0 12px; font: 500 13px/1.2 var(--f-body); color: var(--ink); }

/* Variantes: pestañas de texto, una sola vez. */
.tabsv { display: flex; gap: 18px; border-bottom: 1px solid var(--line); }
.tabsv button { position: relative; padding: 0 0 10px; border: 0; background: none; color: var(--ink-3); font-size: 13.5px; transition: color .15s var(--ease); }
.tabsv button:hover { color: var(--ink); }
.tabsv button[aria-pressed="true"] { color: var(--ink); }
.tabsv button[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px; background: var(--ink); }
.tabsv + p { margin: 12px 0 0; color: var(--ink-2); }

/* Ajustes: filas simples, sin caja. */
.ajustes { display: flex; flex-direction: column; }
.ctl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); align-items: center; gap: 12px; min-height: 44px; padding: 6px 0; border-top: 1px solid var(--line); }
.ctl:last-child { border-bottom: 1px solid var(--line); }
/* Con cuatro opciones o más, el control va debajo del rótulo para que no se corten. */
.ctl:has(.seg button:nth-child(4)) { grid-template-columns: 1fr; gap: 8px; padding: 10px 0; }
.ctl > .et { font-size: 12.5px; color: var(--ink-2); }
.ctl > .et small { display: block; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
/* El Selector del sistema (Web/Selector del Master): cápsula de línea, indicador marfil que se desliza. */
.seg { position: relative; isolation: isolate; display: flex; padding: 3px; border-radius: 999px; background: var(--line); }
.seg-ind { position: absolute; z-index: -1; top: 3px; left: 0; bottom: 3px; width: 0; border-radius: 999px; background: var(--card); box-shadow: 0 1px 3px rgba(10, 30, 74, .12); pointer-events: none; transition: transform 420ms cubic-bezier(.67, 0, .24, .99), width 420ms cubic-bezier(.67, 0, .24, .99); }
.seg-ind.quieto { transition: none; }
.seg button { flex: 1 1 0; min-width: 0; height: 28px; padding: 0 8px; border: 0; border-radius: 999px; background: transparent; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 240ms ease; }
.seg button[aria-pressed="true"] { color: var(--azul); font-weight: 500; }
input[type="range"] { width: 100%; accent-color: var(--ink); margin: 0; }
input[type="text"], select { width: 100%; height: 32px; padding: 0 10px; border: 0; border-radius: var(--r); background: var(--suave); font-size: 12.5px; }
/* El interruptor del sistema (UI/Toggle del Master): 56 × 32, perilla de 26, verde prendido. */
.interr { justify-self: end; position: relative; width: 56px; height: 32px; padding: 0; border: 0; border-radius: 16px; background: #D9D9D9; transition: background 200ms ease; }
.interr::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(10, 30, 74, .2); transition: transform 240ms var(--ease); }
.interr[aria-checked="true"] { background: #2D8035; }
.interr[aria-checked="true"]::after { transform: translateX(24px); }

/* Código: una sola acción principal, Copiar. */
.codigo__cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.codigo__cab h2 { margin: 0; }
.codigo__der { display: flex; align-items: center; gap: 14px; }
.tabsc { display: flex; gap: 12px; }
.tabsc button { border: 0; background: none; padding: 0; font: 400 12px/1 var(--f-mono); color: var(--ink-3); }
.tabsc button[aria-pressed="true"] { color: var(--ink); }
.btn { height: 30px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--azul); color: #fff; font-size: 12.5px; transition: transform .15s var(--ease); }
.btn:active { transform: scale(.97); }
pre { margin: 0; padding: 14px; max-height: 340px; overflow: auto; border-radius: var(--r); background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font: 400 11.5px/1.6 var(--f-mono); tab-size: 2; }

.claves { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); }

/* Referencia técnica: cerrada por defecto. */
details { border-top: 1px solid var(--line); padding-top: 14px; }
summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; font-weight: 500; font-size: 13px; }
summary::-webkit-details-marker { display: none; }
summary .ico { transition: transform .2s var(--ease); }
details[open] summary .ico { transform: rotate(90deg); }
.ref { display: flex; flex-direction: column; gap: 20px; padding-top: 16px; }
.ref p { margin: 0; color: var(--ink-2); }
.ref h3 { margin: 0 0 6px; font: 500 12px/1.2 var(--f-body); color: var(--ink-3); }
.tabla { width: 100%; border-collapse: collapse; font-size: 12px; }
.tabla th { padding: 0 8px 6px 0; text-align: left; font-weight: 400; color: var(--ink-3); }
.tabla td { padding: 8px 8px 8px 0; border-top: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
.tabla td:first-child { color: var(--ink); }
.tabla code { font: 400 11px/1.4 var(--f-mono); color: var(--ink); }

.vecinos { display: flex; justify-content: space-between; gap: 12px; }
.vecinos a { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; font-size: 12.5px; color: var(--ink-3); }
.vecinos a:hover { color: var(--ink); }

/* Vista previa. */
.previa { position: sticky; top: 16px; height: calc(100vh - 32px); border-radius: var(--r-l); overflow: hidden; background: var(--bg); box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; }
.previa__marco { width: 100%; height: 100%; transition: width .4s var(--ease), height .4s var(--ease); }
.previa[data-vista="mobile"] { background: #E2DFCC; }
.previa[data-vista="mobile"] .previa__marco { width: 390px; height: min(820px, calc(100% - 72px)); border-radius: 24px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.previa iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
.herr { position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; gap: 2px; padding: 2px; border-radius: var(--r); background: rgba(255, 254, 239, .9); box-shadow: 0 0 0 1px var(--line); }
.herr button { display: grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); transition: background .15s var(--ease), color .15s var(--ease); }
.herr button:hover { background: var(--suave); color: var(--ink); }
.previa:fullscreen { border-radius: 0; height: 100vh; }
.saltar { position: absolute; left: 12px; top: -48px; z-index: 10; padding: 8px 12px; border-radius: var(--r); background: var(--ink); color: var(--card); text-decoration: none; }
.saltar:focus { top: 12px; }
.oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }

@media (max-width: 1100px) {
  .grilla { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ficha { grid-template-columns: 1fr; padding: 16px; } .previa { position: relative; top: 0; height: 68vh; order: -1; } .doc { padding-top: 0; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .lado { position: static; height: auto; gap: 12px; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; }
  .lado nav { flex-direction: row; overflow-x: auto; gap: 16px; }
  .grupo { flex: none; } .grupo ul { flex-direction: row; gap: 4px; } .item { width: auto; margin: 0; white-space: nowrap; }
  .grilla { grid-template-columns: 1fr; } .gal { padding: 24px 16px 48px; }
}
</style>
</head>
<body>
<a class="saltar" href="#" onclick="event.preventDefault(); document.getElementById('centro').focus()">Saltar al contenido</a>
<p class="oculto" role="status" aria-live="polite" id="aviso"></p>
<div class="app">
  <aside class="lado">
    <a class="lado__volver" href="../../"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 12H7M11 8l-4 4 4 4"/></svg>Bong Lab</a>
    <a class="lado__tit" href="#">Componentes<small>Profertil · web</small></a>
    <nav id="nav" aria-label="Componentes"></nav>
  </aside>
  <main class="centro" id="centro" tabindex="-1"></main>
</div>

<script src="formas.js"></script>
<script>
/* ==========================================================================
   Librería. Cada componente vive en c/<id>.js y se suma con Libreria.sumar({...}).
     id, nombre, grupo, bajada, nota
     variantes   [[id, nombre, descripción], ...]
     alto        "auto" (el contenido, centrado) o un número (página con scroll propio)
     previa      0 a 1: hasta dónde scrollear la miniatura de la galería
     mini        ancho en px al que se dibuja la miniatura (1280 por defecto; menos = más cerca)
     tamano      "ancha" | "media" | "chica": lugar en la galería
     controles   {id, tipo: seg|rango|texto|interr|select, etiqueta, def, desc, aplica}
                 aplica: {var: "--x", unidad} | {attr: "data-x"} | {texto: "selector"} = en vivo;
                 sin aplica, el componente se vuelve a dibujar.
     claves      lista: cómo se comporta (lo que hay que respetar al llevarlo al sitio)
     accesibilidad, dependencias (se suman a las que se detectan solas)
     css(s), html(s), js(s)   lo que corre en la vista previa y lo que se copia.
   Las piezas que ya son una página del Lab se suman con {tipo: "pagina", src}.
   ========================================================================== */
window.Libreria = { lista: [], sumar: function (c) { this.lista.push(c); } };
var GRUPOS = ["Datos", "Navegación", "Controles", "Avisos", "Listas", "Scroll", "Transiciones", "Medios", "Texto", "Páginas"];
</script>
<script src="c/sistema.js"></script>
<script src="c/cifras.js"></script>
<script src="c/pie.js"></script>
<script src="c/boton-fijo.js"></script>
<script src="c/lista-valores.js"></script>
<script src="c/scroll-fotos.js"></script>
<script src="c/transicion-seccion.js"></script>
<script src="c/transicion-navegacion.js"></script>
<script src="c/controles.js"></script>
<script src="c/piezas-lab.js"></script>
<script>
(function () {
  var L = Libreria.lista, $ = function (id) { return document.getElementById(id); };
  var actual = null, estado = {}, vista = "desktop", tab = "html", iframe = null;
  var ICO = {
    desktop: '<path d="M4 5h16v11H4zM9 20h6M12 16v4"/>',
    mobile: '<path d="M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM11 18h2"/>',
    repetir: '<path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"/>',
    completa: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
    izq: '<path d="M17 12H7M11 8l-4 4 4 4"/>',
    der: '<path d="M7 12h10M13 8l4 4-4 4"/>',
    abre: '<path d="M10 7l5 5-5 5"/>'
  };
  function ico(n) { return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + ICO[n] + '</svg>'; }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function porId(id) { return L.filter(function (c) { return c.id === id; })[0]; }
  function ordenados() { var o = []; GRUPOS.forEach(function (g) { L.forEach(function (c) { if (c.grupo === g) o.push(c); }); }); return o; }
  function inicial(c) {
    var s = {}; if (c.variantes) s.variante = c.variantes[0][0];
    (c.controles || []).forEach(function (k) { if (k !== "---") s[k.id] = k.def; }); return s;
  }

  /* ---------------- el documento que corre adentro de cada vista previa ---------------- */
  function htmlFinal(c, s) {
    var attrs = s.variante ? ' data-variante="' + s.variante + '"' : '', vars = [];
    (c.controles || []).forEach(function (k) {
      if (!k.aplica) return;
      if (k.aplica.attr) attrs += ' ' + k.aplica.attr + '="' + esc(s[k.id]) + '"';
      if (k.aplica.var) vars.push(k.aplica.var + ': ' + s[k.id] + (k.aplica.unidad || ''));
    });
    if (vars.length) attrs += ' style="' + vars.join('; ') + '"';
    return c.html(s).replace(/data-c="([^"]+)"/, 'data-c="$1"' + attrs);
  }
  function documento(c, s, mini) {
    var js = c.js ? c.js(s) : "", auto = c.alto === "auto";
    return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">' +
      '<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="../animadores-texto/animadores.css">' +
      '<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}body{background:#E9E7D6;color:#0A1E4A;font-family:"DM Sans","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}::selection{background:#003DA5;color:#FFFEEF}' +
      (auto ? 'body{min-height:100vh;display:flex;flex-direction:column;justify-content:' + (c.sangrado ? 'flex-end' : 'center') + ';' + (c.sangrado ? '' : 'padding:clamp(20px,5vw,56px)') + '}body>*{width:100%}' : '') +
      (mini ? 'html{scrollbar-width:none}html::-webkit-scrollbar{display:none}' : '') + '</style>' +
      '<style>' + c.css(s) + '</style></head><body>' + (c.previo || '') + htmlFinal(c, s) +
      '<script src="formas.js"><\/script><script src="../animadores-texto/animadores.js"><\/script>' +
      (js ? '<script>' + js + '<\/script>' : '') + '</body></html>';
  }
  function cargar(fr, c, s, alCargar, mini) {
    fr.onload = function () { if (alCargar) alCargar(fr); };
    if (c.tipo === "pagina") fr.src = c.src; else fr.srcdoc = documento(c, s, mini);
  }

  /* ---------------- sidebar ---------------- */
  function dibujarNav() {
    $("nav").innerHTML = GRUPOS.map(function (g) {
      var cs = L.filter(function (c) { return c.grupo === g; }); if (!cs.length) return "";
      return '<div class="grupo"><p class="grupo__tit">' + g + '</p><ul>' + cs.map(function (c) {
        return '<li><a class="item" href="#' + c.id + '"' + (actual === c ? ' aria-current="page"' : '') + '><span>' + esc(c.nombre) + '</span>' +
          (c.variantes ? '<span class="n" aria-label="' + c.variantes.length + ' variantes">' + c.variantes.length + '</span>' : '') + '</a></li>';
      }).join("") + '</ul></div>';
    }).join("");
  }

  /* ---------------- galería ---------------- */
  function galeria() {
    actual = null; dibujarNav(); document.title = "Componentes Profertil";
    $("centro").innerHTML = '<div class="gal"><h1>Componentes</h1><p>Lo que vamos armando para el sitio, en vivo. Textos, números y fotos de ejemplo.</p><div class="grilla">' +
      ordenados().map(function (c) {
        return '<a class="tar" href="#' + c.id + '"><div class="tar__vista"><iframe tabindex="-1" loading="lazy" aria-hidden="true" title="" data-mini="' + c.id + '"></iframe></div>' +
          '<div><b>' + esc(c.nombre) + '</b><span>' + esc(c.grupo) + (c.variantes ? ' · ' + c.variantes.length + ' variantes' : '') + '</span></div></a>';
      }).join("") + '</div></div>';
    scrollTo(0, 0);
    // Miniaturas en vivo: el iframe se dibuja a 1280 × 800 y se achica para cubrir la tarjeta.
    document.querySelectorAll("[data-mini]").forEach(function (fr) {
      // Las piezas chicas (controles, avisos) se dibujan más angostas para que se vean de cerca.
      var c = porId(fr.dataset.mini), caja = fr.parentNode, ancho = c.mini || 1280, alto = Math.round(ancho * .625);
      fr.style.width = ancho + "px"; fr.style.height = alto + "px";
      var ajustar = function () { fr.style.setProperty("--esc", Math.max(caja.clientWidth / ancho, caja.clientHeight / alto)); };
      new ResizeObserver(ajustar).observe(caja); ajustar();
      cargar(fr, c, inicial(c), function () {
        if (typeof c.alto === "number" && c.previa) try {
          var w = fr.contentWindow, d = fr.contentDocument;
          setTimeout(function () { w.scrollTo(0, (d.documentElement.scrollHeight - w.innerHeight) * c.previa); }, 300);
        } catch (e) {}
      }, true);
    });
  }

  /* ---------------- ficha ---------------- */
  function dependencias(c) {
    var s = inicial(c), src = c.html(s) + (c.js ? c.js(s) : ""), d = ["tokens.css", "Familjen Grotesk", "DM Sans"];
    if (/data-anim=/.test(src)) d.push("animadores.css y animadores.js");
    if (/data:image\/svg|viewBox="0 0 \d/.test(src)) d.push("formas del sistema en línea");
    if (/\.webp/.test(src)) d.push("fotos de demo");
    if (c.js) d.push("JS propio, sin librerías");
    return d.concat(c.dependencias || []).join(", ") + ".";
  }
  function referencia(c) {
    var filas = (c.controles || []).filter(function (k) { return k !== "---"; }).map(function (k) {
      var donde = k.aplica ? (k.aplica.var || k.aplica.attr || "texto") : "estructura";
      var def = typeof k.def === "boolean" ? (k.def ? "sí" : "no") : k.def + (k.unidad && k.unidad !== "%" ? " " + k.unidad : k.unidad || "");
      return '<tr><td>' + esc(k.etiqueta.replace(/ \(.+\)$/, "")) + '</td><td><code>' + esc(donde) + '</code></td><td><code>' + esc(def) + '</code></td><td>' + esc(k.desc || "") + '</td></tr>';
    });
    if (c.variantes) filas.unshift('<tr><td>Variante</td><td><code>data-variante</code></td><td><code>' + c.variantes[0][0] + '</code></td><td>' + c.variantes.map(function (v) { return v[0]; }).join(", ") + '</td></tr>');
    return '<table class="tabla"><thead><tr><th>Ajuste</th><th>Dónde</th><th>Por defecto</th><th>Qué hace</th></tr></thead><tbody>' + filas.join("") + '</tbody></table>';
  }
  function control(k) {
    var v = estado[k.id], et = esc(k.etiqueta.replace(/ \(.+\)$/, ""));
    if (k.tipo === "rango") return '<div class="ctl"><label class="et" for="t-' + k.id + '">' + et + '<small id="v-' + k.id + '">' + v + ' ' + (k.unidad || '') + '</small></label><input type="range" id="t-' + k.id + '" data-k="' + k.id + '" min="' + k.min + '" max="' + k.max + '" step="' + (k.paso || 1) + '" value="' + v + '"></div>';
    if (k.tipo === "seg") return '<div class="ctl"><span class="et" id="e-' + k.id + '">' + et + '</span><div class="seg" role="group" aria-labelledby="e-' + k.id + '" data-k="' + k.id + '"><span class="seg-ind" aria-hidden="true"></span>' + k.opciones.map(function (o) {
      return '<button type="button" data-val="' + o[0] + '" aria-pressed="' + (String(v) === String(o[0])) + '">' + esc(o[1]) + '</button>'; }).join("") + '</div></div>';
    if (k.tipo === "select") return '<div class="ctl"><label class="et" for="t-' + k.id + '">' + et + '</label><select id="t-' + k.id + '" data-k="' + k.id + '">' + k.opciones.map(function (o) {
      return '<option value="' + o[0] + '"' + (String(v) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join("") + '</select></div>';
    if (k.tipo === "texto") return '<div class="ctl"><label class="et" for="t-' + k.id + '">' + et + '</label><input type="text" id="t-' + k.id + '" data-k="' + k.id + '" value="' + esc(v) + '"></div>';
    if (k.tipo === "interr") return '<div class="ctl"><span class="et" id="e-' + k.id + '">' + et + '</span><button type="button" class="interr" role="switch" aria-checked="' + v + '" aria-labelledby="e-' + k.id + '" data-k="' + k.id + '"></button></div>';
    return "";
  }
  function descVariante() { var v = actual.variantes.filter(function (x) { return x[0] === estado.variante; })[0]; return v && v[2] ? esc(v[2]) : ""; }

  function abrir(c) {
    actual = c; estado = inicial(c); dibujarNav(); document.title = c.nombre + " · Componentes Profertil";
    var pag = c.tipo === "pagina", o = ordenados(), i = o.indexOf(c), ant = o[i - 1], sig = o[i + 1];
    var h = '<div class="ficha"><div class="doc"><div><a class="migas" href="#">Componentes · ' + esc(c.grupo) + '</a>' +
      '<h1>' + esc(c.nombre) + '</h1><p class="bajada">' + esc(c.bajada) + '</p></div>';
    if (c.variantes) h += '<section><div class="tabsv" role="group" aria-label="Variantes">' + c.variantes.map(function (v) {
      return '<button type="button" data-var="' + v[0] + '" aria-pressed="' + (v[0] === estado.variante) + '">' + esc(v[1]) + '</button>'; }).join("") + '</div><p id="vdesc">' + descVariante() + '</p></section>';
    if (!pag && c.controles && c.controles.length) h += '<section><h2>Ajustes</h2><div class="ajustes" id="ajustes">' + c.controles.filter(function (k) { return k !== "---"; }).map(control).join("") + '</div></section>';
    if (!pag) h += '<section><div class="codigo__cab"><h2>Código</h2><div class="codigo__der"><div class="tabsc" id="tabs" role="group" aria-label="Lenguaje"></div><button type="button" class="btn" id="copiar">Copiar</button></div></div><pre id="pre" tabindex="0"></pre></section>';
    if (c.claves && c.claves.length) h += '<section><h2>Cómo se comporta</h2><ul class="claves">' + c.claves.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul></section>';
    if (!pag) h += '<details><summary>Referencia técnica' + ico("abre") + '</summary><div class="ref">' + referencia(c) +
      '<div><h3>Dependencias</h3><p>' + esc(dependencias(c)) + '</p></div>' +
      (c.accesibilidad ? '<div><h3>Accesibilidad</h3><p>' + esc(c.accesibilidad) + '</p></div>' : '') +
      (c.nota ? '<div><h3>Para tener en cuenta</h3><p>' + esc(c.nota) + '</p></div>' : '') + '</div></details>';
    else if (c.nota) h += '<p class="bajada">' + esc(c.nota) + '</p>';
    h += '<nav class="vecinos" aria-label="Otros componentes">' + (ant ? '<a href="#' + ant.id + '">' + ico("izq") + esc(ant.nombre) + '</a>' : '<span></span>') +
      (sig ? '<a href="#' + sig.id + '">' + esc(sig.nombre) + ico("der") + '</a>' : '') + '</nav></div>' +
      '<div class="previa" id="previa" data-vista="' + vista + '"><div class="previa__marco"><iframe id="ifr" title="Vista previa de ' + esc(c.nombre) + '"></iframe></div>' +
      '<div class="herr" role="toolbar" aria-label="Vista previa">' +
        '<button type="button" id="vista" aria-label="' + (vista === "desktop" ? "Ver en mobile" : "Ver en desktop") + '" title="' + (vista === "desktop" ? "Ver en mobile" : "Ver en desktop") + '">' + ico(vista === "desktop" ? "mobile" : "desktop") + '</button>' +
        '<button type="button" id="repetir" aria-label="Repetir" title="Repetir">' + ico("repetir") + '</button>' +
        '<button type="button" id="completa" aria-label="Pantalla completa" title="Pantalla completa">' + ico("completa") + '</button>' +
      '</div></div></div>';
    $("centro").innerHTML = h; scrollTo(0, 0);
    iframe = $("ifr"); dibujar(true); codigo(); moverInds();
  }

  function dibujar(nuevo) {
    var sy = 0; try { sy = nuevo ? 0 : iframe.contentWindow.scrollY; } catch (e) {}
    cargar(iframe, actual, estado, function () { try { if (sy) iframe.contentWindow.scrollTo(0, sy); } catch (e) {} });
  }
  function aplicar(k) {
    var d; try { d = iframe.contentDocument; } catch (e) { return false; }
    var r = d && d.querySelector("[data-c]"); if (!r || !k.aplica) return false;
    if (k.aplica.var) r.style.setProperty(k.aplica.var, estado[k.id] + (k.aplica.unidad || ""));
    if (k.aplica.attr) r.setAttribute(k.aplica.attr, estado[k.id]);
    if (k.aplica.texto) d.querySelectorAll(k.aplica.texto).forEach(function (e) { e.textContent = estado[k.id]; });
    return true;
  }
  function ctrl(id) { return (actual.controles || []).filter(function (k) { return k.id === id; })[0]; }
  function cambio(id, v) { estado[id] = v; var k = ctrl(id); if (!(k && aplicar(k))) dibujar(false); codigo(); }
  function codigo() {
    if (!actual || actual.tipo === "pagina" || !$("pre")) return;
    var p = { html: "<!-- " + actual.nombre + " · Profertil -->\n" + htmlFinal(actual, estado), css: actual.css(estado) };
    if (actual.js) { var j = actual.js(estado); if (j) p.js = j; }
    if (!p[tab]) tab = "html";
    $("tabs").innerHTML = Object.keys(p).map(function (t) { return '<button type="button" data-t="' + t + '" aria-pressed="' + (t === tab) + '">' + t.toUpperCase() + '</button>'; }).join("");
    $("pre").textContent = p[tab].trim();
  }

  /* ---------------- eventos ---------------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.var) {
      estado.variante = b.dataset.var;
      document.querySelectorAll("[data-var]").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
      $("vdesc").innerHTML = descVariante(); dibujar(true); codigo();
      // La variante queda en la dirección: #componente/variante se puede compartir.
      history.replaceState(null, "", "#" + actual.id + (estado.variante !== actual.variantes[0][0] ? "/" + estado.variante : ""));
      return;
    }
    if (b.id === "vista") {
      vista = vista === "desktop" ? "mobile" : "desktop"; $("previa").dataset.vista = vista;
      var t = vista === "desktop" ? "Ver en mobile" : "Ver en desktop";
      b.innerHTML = ico(vista === "desktop" ? "mobile" : "desktop"); b.setAttribute("aria-label", t); b.title = t; return;
    }
    if (b.id === "repetir") { dibujar(true); return; }
    if (b.id === "completa") { var pv = $("previa"); if (document.fullscreenElement) document.exitFullscreen(); else if (pv.requestFullscreen) pv.requestFullscreen(); return; }
    if (b.closest("#tabs")) { tab = b.dataset.t; codigo(); return; }
    if (b.id === "copiar") {
      var txt = $("pre").textContent, ok = function () { b.textContent = "Copiado"; $("aviso").textContent = "Código copiado"; setTimeout(function () { b.textContent = "Copiar"; }, 1500); };
      var falla = function () { var a = document.createElement("textarea"); a.value = txt; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); ok(); } catch (x) {} a.remove(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, falla); else falla();
      return;
    }
    var seg = b.closest("#ajustes .seg"), k = b.dataset.k || (seg && seg.dataset.k); if (!k) return;
    if (seg) {
      seg.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
      moverInd(seg, true);
      var c = ctrl(k), val = b.dataset.val; if (c && typeof c.def === "number") val = parseFloat(val); cambio(k, val);
    } else if (b.classList.contains("interr")) { var on = b.getAttribute("aria-checked") !== "true"; b.setAttribute("aria-checked", on); cambio(k, on); }
  });
  document.addEventListener("input", function (e) {
    var el = e.target, k = el.dataset && el.dataset.k; if (!k || !el.closest("#ajustes")) return;
    var c = ctrl(k);
    if (el.type === "range") { $("v-" + k).textContent = el.value + " " + (c.unidad || ""); if (c.aplica) cambio(k, parseFloat(el.value)); else estado[k] = parseFloat(el.value); }
    else cambio(k, el.value);
  });
  document.addEventListener("change", function (e) {
    var el = e.target, k = el.dataset && el.dataset.k, c = k && actual && ctrl(k);
    if (el.type === "range" && c && !c.aplica) cambio(k, parseFloat(el.value));
  });

  // El indicador del Selector va al botón elegido (igual que en Novedades).
  function moverInd(seg, animar) {
    var ind = seg.querySelector(".seg-ind"), b = seg.querySelector('button[aria-pressed="true"]');
    if (!ind || !b || !b.offsetWidth) return;
    if (!animar) ind.classList.add("quieto");
    ind.style.width = b.offsetWidth + "px"; ind.style.transform = "translateX(" + b.offsetLeft + "px)";
    if (!animar) { void ind.offsetWidth; ind.classList.remove("quieto"); }
  }
  function moverInds() { document.querySelectorAll("#ajustes .seg").forEach(function (s) { moverInd(s, false); }); }
  addEventListener("resize", moverInds);
  document.fonts && document.fonts.ready.then(moverInds);

  function ruta() {
    var p = decodeURIComponent(location.hash.slice(1)).split("/"), c = porId(p[0]);
    if (!c) { galeria(); return; }
    if (c !== actual) abrir(c);
    if (p[1] && c.variantes && c.variantes.some(function (v) { return v[0] === p[1]; }) && estado.variante !== p[1]) { var b = document.querySelector('[data-var="' + p[1] + '"]'); if (b) b.click(); }
  }
  addEventListener("hashchange", ruta);
  ruta();
})();
</script>
