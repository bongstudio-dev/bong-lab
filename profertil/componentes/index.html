<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Componentes Profertil</title>
<meta name="description" content="Librería de componentes de la web de Profertil: variantes, tweaks en vivo y código para copiar.">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
/* Tokens del sistema web de Profertil (Figma Master, colecciones 01 y 06). */
:root {
  color-scheme: light;
  --bg: #E9E7D6; --card: #FFFEEF; --ink: #0A1E4A; --ink-2: #44506E; --ink-3: #737D96;
  --azul: #003DA5; --line: rgba(10, 30, 74, .1); --chip: rgba(10, 30, 74, .06);
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --lado: 188px; --tw: 272px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.4 var(--f-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }

/* ---------- Estructura: sidebar fija | contenido | tweaks ---------- */
.app { display: grid; grid-template-columns: var(--lado) minmax(0, 1fr); height: 100vh; }
.app.con-tweaks { grid-template-columns: var(--lado) minmax(0, 1fr) var(--tw); }

.lado { height: 100vh; overflow: auto; padding: 18px 14px 24px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px; }
.lado__volver { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-3); text-decoration: none; }
.lado__volver svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.lado__volver:hover { color: var(--azul); }
.lado__tit { margin: 0; border: 0; background: none; padding: 0; text-align: left; font: 600 15px/1.1 var(--f-display); letter-spacing: -.02em; }
.lado__tit small { display: block; margin-top: 4px; font: 400 11px/1.3 var(--f-body); letter-spacing: 0; color: var(--ink-3); }
.lado nav { display: flex; flex-direction: column; gap: 16px; }
.grupo h2 { margin: 0 0 5px; font: 500 10px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.grupo ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.item { display: flex; justify-content: space-between; align-items: center; gap: 6px; width: calc(100% + 12px); margin: 0 -6px; padding: 5px 6px; border: 0; border-radius: 7px; background: none; text-align: left; font-size: 12px; line-height: 1.25; color: var(--ink-2); transition: background .2s var(--ease), color .2s var(--ease); }
.item:hover { background: var(--chip); color: var(--ink); }
.item[aria-current="true"] { background: var(--azul); color: #fff; }
.item .n { font-size: 10px; opacity: .55; font-variant-numeric: tabular-nums; }

.centro { min-width: 0; height: 100vh; overflow: auto; display: flex; flex-direction: column; }
.cab { position: sticky; top: 0; z-index: 3; display: flex; justify-content: space-between; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding: 14px 20px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.cab__tit { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.cab h1 { margin: 0; font: 600 20px/1.1 var(--f-display); letter-spacing: -.02em; }
.cab p { margin: 0; font-size: 12.5px; color: var(--ink-2); max-width: 70ch; }
.cab__der { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.escenario { flex: 1 0 auto; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.marco { width: 100%; max-width: 1440px; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 20px 50px -30px rgba(10, 30, 74, .35); transition: max-width .45s var(--ease); }
.marco[data-vista="mobile"] { max-width: 390px; }
.marco iframe { display: block; width: 100%; height: 640px; border: 0; background: var(--bg); }
.aviso { font-size: 11.5px; color: var(--ink-3); text-align: center; max-width: 70ch; }

/* ---------- Portada de la librería ---------- */
.portada { padding: 28px 24px 56px; display: flex; flex-direction: column; gap: 28px; }
.portada__intro h1 { margin: 0 0 8px; font: 600 clamp(28px, 3.4vw, 44px)/1 var(--f-display); letter-spacing: -.03em; }
.portada__intro p { margin: 0; max-width: 62ch; color: var(--ink-2); }
.portada h2 { margin: 0 0 10px; font: 500 10px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.tarjeta { display: flex; flex-direction: column; gap: 10px; min-height: 150px; padding: 18px; border: 0; border-radius: 22px; background: var(--card); text-align: left; transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
.tarjeta:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -20px rgba(10, 30, 74, .4); }
.tarjeta b { font: 600 18px/1.1 var(--f-display); letter-spacing: -.02em; }
.tarjeta span { font-size: 12.5px; color: var(--ink-2); }
.tarjeta i { margin-top: auto; font-style: normal; font-size: 11px; color: var(--azul); }

/* ---------- Controles ---------- */
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { flex: 1 1 auto; min-height: 28px; padding: 0 11px; border: 0; border-radius: 999px; background: var(--chip); font-size: 12px; color: var(--ink-2); white-space: nowrap; transition: background .2s var(--ease), color .2s var(--ease); }
.seg button:hover { background: rgba(10, 30, 74, .11); }
.seg button[aria-pressed="true"] { background: var(--azul); color: #fff; }
.cab .seg button { flex: none; }
.btn { min-height: 30px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--azul); color: #fff; font-size: 12.5px; white-space: nowrap; transition: transform .15s var(--ease), background .2s var(--ease); }
.btn:active { transform: scale(.97); }
.btn--claro { background: var(--chip); color: var(--ink); }
.btn--claro[aria-pressed="true"] { background: var(--ink); color: #fff; }

.tweaks { height: 100vh; overflow: auto; padding: 18px 16px 28px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.tweaks h2 { margin: 0; font: 500 10px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.ctl { display: flex; flex-direction: column; gap: 6px; }
.ctl > label, .ctl > .et { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--ink-2); }
.ctl .val { font-variant-numeric: tabular-nums; color: var(--ink-3); white-space: nowrap; }
input[type="range"] { width: 100%; accent-color: var(--azul); margin: 0; }
input[type="text"], select { height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--chip); font-size: 12.5px; }
.interr { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--ink-2); }
.interr button { position: relative; flex: none; width: 36px; height: 20px; border: 0; border-radius: 999px; background: rgba(10, 30, 74, .18); transition: background .2s var(--ease); }
.interr button::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease); }
.interr button[aria-pressed="true"] { background: var(--azul); }
.interr button[aria-pressed="true"]::after { transform: translateX(16px); }
hr { border: 0; border-top: 1px solid var(--line); width: 100%; margin: 2px 0; }

/* ---------- Código ---------- */
.codigo { width: 100%; max-width: 1440px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.codigo[hidden] { display: none; }
.codigo__barra { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--line); }
.codigo__barra .seg button { flex: none; min-height: 26px; }
.codigo small { color: var(--ink-3); font-size: 11px; flex: 1; text-align: right; }
.codigo pre { margin: 0; padding: 14px; max-height: 420px; overflow: auto; font: 400 12px/1.55 var(--f-mono); tab-size: 2; }

@media (max-width: 1180px) {
  .app.con-tweaks { grid-template-columns: var(--lado) minmax(0, 1fr); }
  .tweaks { position: fixed; right: 12px; bottom: 12px; top: auto; z-index: 10; height: auto; max-height: 70vh; width: min(300px, calc(100vw - 24px)); border: 0; border-radius: 18px; background: var(--card); box-shadow: 0 20px 50px -20px rgba(10, 30, 74, .45); transform: translateY(calc(100% + 24px)); transition: transform .4s var(--ease); }
  .tweaks.abierto { transform: none; }
  #verTweaks { display: inline-flex !important; }
}
@media (max-width: 760px) {
  body { overflow: auto; }
  .app, .app.con-tweaks { grid-template-columns: 1fr; height: auto; }
  .lado { height: auto; flex-direction: row; flex-wrap: wrap; gap: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; }
  .lado nav { flex-direction: row; overflow-x: auto; gap: 14px; width: 100%; }
  .grupo { flex: none; } .grupo ul { flex-direction: row; } .item { width: auto; margin: 0; }
  .centro { height: auto; } .escenario { padding: 12px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="lado">
    <a class="lado__volver" href="../../"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 12H7M11 8l-4 4 4 4"/></svg>Bong Lab</a>
    <button type="button" class="lado__tit" data-ir="">Componentes<small>Profertil · web</small></button>
    <nav id="nav" aria-label="Componentes"></nav>
  </aside>

  <main class="centro" id="centro"></main>

  <aside class="tweaks" id="tweaks" aria-label="Tweaks" hidden></aside>
</div>

<script src="formas.js"></script>
<script>
/* ==========================================================================
   Librería. Cada componente vive en c/<id>.js y se suma con Libreria.sumar({...}).
   Campos:
     id, nombre, grupo, bajada, nota
     variantes  [[id, nombre], ...]   (se eligen arriba, junto al nombre)
     alto       "auto" (la altura del contenido) o un número en px (escenario con scroll propio)
     controles  tweaks: {id, tipo: seg|rango|texto|interr|select|boton, etiqueta, def, ...}
                con aplica: {var: "--x", unidad: "px"} o {attr: "data-x"} o {texto: "selector"}
                se cambian en vivo; sin aplica, el componente se vuelve a dibujar.
     css(s), html(s), js(s)   lo que corre en el escenario y lo que se copia.
   Las piezas que ya son una página propia del Lab se suman con {tipo: "pagina", src}.
   ========================================================================== */
window.Libreria = { lista: [], sumar: function (c) { this.lista.push(c); } };
var GRUPOS = ["Datos", "Navegación", "Listas", "Scroll", "Transiciones", "Medios", "Texto", "Páginas"];
</script>
<script src="c/cifras.js"></script>
<script src="c/pie.js"></script>
<script src="c/boton-fijo.js"></script>
<script src="c/lista-valores.js"></script>
<script src="c/scroll-fotos.js"></script>
<script src="c/transicion-seccion.js"></script>
<script src="c/transicion-navegacion.js"></script>
<script src="c/piezas-lab.js"></script>
<script>
(function () {
  var L = Libreria.lista, $ = function (id) { return document.getElementById(id); };
  var actual = null, estado = {}, vista = "desktop", tab = "html", verCodigo = false, fondo = "web", iframe = null;
  var FONDOS = { web: "#E9E7D6", tiza: "#FFFEEF", blanco: "#FFFFFF" };
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function porId(id) { return L.filter(function (c) { return c.id === id; })[0]; }
  function ctrl(id) { return (actual.controles || []).filter(function (k) { return k.id === id; })[0]; }

  /* ---------------- sidebar ---------------- */
  function dibujarNav() {
    var h = GRUPOS.map(function (g) {
      var cs = L.filter(function (c) { return c.grupo === g; }); if (!cs.length) return "";
      return '<div class="grupo"><h2>' + g + '</h2><ul>' + cs.map(function (c) {
        return '<li><button type="button" class="item" data-ir="' + c.id + '" aria-current="' + (actual === c) + '"><span>' + esc(c.nombre) + '</span>' +
          (c.variantes ? '<span class="n">' + c.variantes.length + '</span>' : '') + '</button></li>';
      }).join("") + '</ul></div>';
    }).join("");
    $("nav").innerHTML = h;
  }

  /* ---------------- portada ---------------- */
  function portada() {
    actual = null; dibujarNav(); $("app").classList.remove("con-tweaks"); $("tweaks").hidden = true;
    var h = '<div class="portada"><div class="portada__intro"><h1>Componentes de la web</h1><p>Todo lo que vamos armando para el sitio de Profertil, en un solo lugar. Cada componente se ve en su lugar, con sus variantes, tweaks para ajustarlo en vivo y el código para copiar. Los textos, números y fotos son de ejemplo.</p></div>';
    h += GRUPOS.map(function (g) {
      var cs = L.filter(function (c) { return c.grupo === g; }); if (!cs.length) return "";
      return '<section><h2>' + g + '</h2><div class="tarjetas">' + cs.map(function (c) {
        return '<button type="button" class="tarjeta" data-ir="' + c.id + '"><b>' + esc(c.nombre) + '</b><span>' + esc(c.bajada) + '</span><i>' +
          (c.variantes ? c.variantes.length + ' variantes' : 'Página completa') + '</i></button>';
      }).join("") + '</div></section>';
    }).join("");
    $("centro").innerHTML = h + '</div>'; $("centro").scrollTop = 0;
  }

  /* ---------------- componente ---------------- */
  function abrir(c) {
    actual = c; estado = {};
    if (c.variantes) estado.variante = c.variantes[0][0];
    (c.controles || []).forEach(function (k) { if (k.tipo !== "boton") estado[k.id] = k.def; });
    dibujarNav();
    var pagina = c.tipo === "pagina";
    $("centro").innerHTML =
      '<div class="cab"><div class="cab__tit"><h1>' + esc(c.nombre) + '</h1><p>' + esc(c.bajada) + '</p></div><div class="cab__der">' +
      (c.variantes ? '<div class="seg" id="variantes" role="group" aria-label="Variante">' + c.variantes.map(function (v) {
        return '<button type="button" data-val="' + v[0] + '" aria-pressed="' + (v[0] === estado.variante) + '">' + esc(v[1]) + '</button>'; }).join("") + '</div>' : '') +
      '<div class="seg" id="vista" role="group" aria-label="Vista"><button type="button" data-v="desktop" aria-pressed="' + (vista === "desktop") + '">Desktop</button><button type="button" data-v="mobile" aria-pressed="' + (vista === "mobile") + '">Mobile</button></div>' +
      '<button type="button" class="btn btn--claro" id="recargar">Repetir</button>' +
      (pagina ? '' : '<button type="button" class="btn btn--claro" id="verCodigo" aria-pressed="' + verCodigo + '">Código</button>') +
      (pagina ? '' : '<button type="button" class="btn" id="verTweaks" style="display:none">Tweaks</button>') +
      '</div></div>' +
      '<div class="escenario"><div class="marco" id="marco" data-vista="' + vista + '"><iframe id="ifr" title="' + esc(c.nombre) + '"></iframe></div>' +
      (c.nota ? '<p class="aviso">' + esc(c.nota) + '</p>' : '') +
      (pagina ? '' : '<section class="codigo" id="codigo"' + (verCodigo ? '' : ' hidden') + '><div class="codigo__barra"><div class="seg" id="tabs"></div><small>Con los valores elegidos en los tweaks.</small><button type="button" class="btn" id="copiar">Copiar</button></div><pre id="pre" tabindex="0"></pre></section>') +
      '</div>';
    iframe = $("ifr");
    $("app").classList.toggle("con-tweaks", !pagina); $("tweaks").hidden = pagina;
    if (!pagina) dibujarTweaks();
    dibujar(true); codigo();
    $("centro").scrollTop = 0;
  }

  function dibujarTweaks() {
    var h = '<h2>Tweaks</h2>';
    (actual.controles || []).forEach(function (k) {
      if (k === "---") { h += "<hr>"; return; }
      var v = estado[k.id];
      if (k.tipo === "seg") h += '<div class="ctl"><div class="et">' + esc(k.etiqueta) + '</div><div class="seg" data-k="' + k.id + '">' + k.opciones.map(function (o) {
        return '<button type="button" data-val="' + o[0] + '" aria-pressed="' + (String(v) === String(o[0])) + '">' + esc(o[1]) + '</button>'; }).join("") + '</div></div>';
      else if (k.tipo === "select") h += '<div class="ctl"><label for="t-' + k.id + '"><span>' + esc(k.etiqueta) + '</span></label><select id="t-' + k.id + '" data-k="' + k.id + '">' + k.opciones.map(function (o) {
        return '<option value="' + o[0] + '"' + (String(v) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join("") + '</select></div>';
      else if (k.tipo === "rango") h += '<div class="ctl"><label for="t-' + k.id + '"><span>' + esc(k.etiqueta) + '</span><span class="val" id="v-' + k.id + '">' + v + ' ' + (k.unidad || '') + '</span></label><input type="range" id="t-' + k.id + '" data-k="' + k.id + '" min="' + k.min + '" max="' + k.max + '" step="' + (k.paso || 1) + '" value="' + v + '"></div>';
      else if (k.tipo === "texto") h += '<div class="ctl"><label for="t-' + k.id + '"><span>' + esc(k.etiqueta) + '</span></label><input type="text" id="t-' + k.id + '" data-k="' + k.id + '" value="' + esc(v) + '"></div>';
      else if (k.tipo === "interr") h += '<div class="interr"><span>' + esc(k.etiqueta) + '</span><button type="button" data-k="' + k.id + '" aria-pressed="' + v + '" aria-label="' + esc(k.etiqueta) + '"></button></div>';
    });
    if (actual.alto === "auto") h += '<hr><div class="ctl"><div class="et">Fondo del escenario</div><div class="seg" data-k="__fondo">' + [["web", "Web"], ["tiza", "Tiza"], ["blanco", "Blanco"]].map(function (o) {
      return '<button type="button" data-val="' + o[0] + '" aria-pressed="' + (fondo === o[0]) + '">' + o[1] + '</button>'; }).join("") + '</div></div>';
    $("tweaks").innerHTML = h;
  }

  /* El HTML del componente con los atributos y variables de los tweaks puestos en su raíz. */
  function htmlFinal() {
    var html = actual.html(estado), attrs = ' data-variante="' + estado.variante + '"', vars = [];
    (actual.controles || []).forEach(function (k) {
      if (!k.aplica) return;
      if (k.aplica.attr) attrs += ' ' + k.aplica.attr + '="' + esc(estado[k.id]) + '"';
      if (k.aplica.var) vars.push(k.aplica.var + ': ' + estado[k.id] + (k.aplica.unidad || ''));
    });
    if (vars.length) attrs += ' style="' + vars.join('; ') + '"';
    return html.replace(/data-c="([^"]+)"/, 'data-c="$1"' + attrs);
  }

  function documento() {
    var js = actual.js ? actual.js(estado) : "";
    return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">' +
      '<link rel="stylesheet" href="../animadores-texto/animadores.css">' +
      '<style>:root{--bg:#E9E7D6;--card:#FFFEEF;--ink:#0A1E4A;--azul:#003DA5}*,*::before,*::after{box-sizing:border-box}html,body{margin:0}' +
      'body{background:' + (actual.alto === "auto" ? FONDOS[fondo] : 'var(--bg)') + ';color:var(--ink);font-family:"DM Sans","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}' +
      (actual.alto === "auto" && !actual.sangrado ? 'body{padding:clamp(20px,5vw,56px)}' : '') + '</style>' +
      '<style>' + actual.css(estado) + '</style></head><body>' + (actual.previo || '') + htmlFinal() +
      '<script src="formas.js"><\/script><script src="../animadores-texto/animadores.js"><\/script>' +
      (js ? '<script>' + js + '<\/script>' : '') + '</body></html>';
  }

  function ajustarAlto() {
    if (!iframe) return;
    var alto = actual.alto, mob = vista === "mobile";
    if (actual.tipo === "pagina" || typeof alto === "number") { iframe.style.height = Math.max(520, $("centro").clientHeight - 150) + "px"; return; }
    // La altura del body (no la del documento, que nunca es menor que el iframe).
    try { var d = iframe.contentDocument; iframe.style.height = Math.max(120, Math.ceil(d.body.getBoundingClientRect().height)) + "px"; } catch (e) {}
  }

  function dibujar(nuevo) {
    var sy = 0;
    try { sy = nuevo ? 0 : iframe.contentWindow.scrollY; } catch (e) {}
    iframe.onload = function () {
      try { if (sy) iframe.contentWindow.scrollTo(0, sy); } catch (e) {}
      ajustarAlto();
      if (actual.alto === "auto") try {
        new iframe.contentWindow.ResizeObserver(ajustarAlto).observe(iframe.contentDocument.body);
        iframe.contentDocument.fonts.ready.then(ajustarAlto);
      } catch (e) {}
    };
    if (actual.tipo === "pagina") iframe.src = actual.src; else iframe.srcdoc = documento();
  }

  /* Cambios en vivo: sin volver a cargar el escenario. */
  function aplicar(k) {
    var d; try { d = iframe.contentDocument; } catch (e) { return false; }
    var r = d && d.querySelector("[data-c]"); if (!r || !k.aplica) return false;
    if (k.aplica.var) r.style.setProperty(k.aplica.var, estado[k.id] + (k.aplica.unidad || ""));
    if (k.aplica.attr) r.setAttribute(k.aplica.attr, estado[k.id]);
    if (k.aplica.texto) d.querySelectorAll(k.aplica.texto).forEach(function (e) { e.textContent = estado[k.id]; });
    return true;
  }

  function cambio(id, v) {
    estado[id] = v;
    var k = ctrl(id);
    if (!(k && aplicar(k))) dibujar(false);
    codigo();
  }

  function codigo() {
    if (!actual || actual.tipo === "pagina" || !$("pre")) return;
    var partes = { html: "<!-- " + actual.nombre + " · Profertil. " + (actual.nota || "") + " -->\n" + htmlFinal(), css: actual.css(estado) };
    if (actual.js) partes.js = actual.js(estado);
    if (!partes[tab]) tab = "html";
    $("tabs").innerHTML = Object.keys(partes).map(function (t) { return '<button type="button" data-t="' + t + '" aria-pressed="' + (t === tab) + '">' + t.toUpperCase() + '</button>'; }).join("");
    $("pre").textContent = partes[tab].trim();
  }

  /* ---------------- eventos ---------------- */
  document.addEventListener("click", function (e) {
    var ir = e.target.closest("[data-ir]");
    if (ir) { location.hash = ir.dataset.ir; return; }
    var b = e.target.closest("button"); if (!b) return;
    if (b.closest("#variantes")) { $("variantes").querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); estado.variante = b.dataset.val; dibujar(true); codigo(); return; }
    if (b.closest("#vista")) { vista = b.dataset.v; $("vista").querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); $("marco").dataset.vista = vista; setTimeout(ajustarAlto, 480); return; }
    if (b.id === "recargar") { dibujar(true); return; }
    if (b.id === "verCodigo") { verCodigo = !verCodigo; b.setAttribute("aria-pressed", verCodigo); $("codigo").hidden = !verCodigo; return; }
    if (b.id === "verTweaks") { $("tweaks").classList.toggle("abierto"); return; }
    if (b.closest("#tabs")) { tab = b.dataset.t; codigo(); return; }
    if (b.id === "copiar") {
      var t = $("pre").textContent;
      var ok = function () { b.textContent = "Copiado"; setTimeout(function () { b.textContent = "Copiar"; }, 1500); };
      var falla = function () { var a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); ok(); } catch (x) {} a.remove(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, falla); else falla();
      return;
    }
    var seg = b.closest("#tweaks .seg"), k = b.dataset.k || (seg && seg.dataset.k);
    if (!k) return;
    if (seg) {
      seg.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
      if (k === "__fondo") { fondo = b.dataset.val; try { iframe.contentDocument.body.style.background = FONDOS[fondo]; } catch (x) {} return; }
      var c = ctrl(k), val = b.dataset.val; if (c && typeof c.def === "number") val = parseFloat(val);
      cambio(k, val);
    } else if (b.closest(".interr")) { var on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); cambio(k, on); }
  });
  $("tweaks").addEventListener("input", function (e) {
    var el = e.target, k = el.dataset.k; if (!k) return;
    var c = ctrl(k);
    if (el.type === "range") {
      $("v-" + k).textContent = el.value + " " + (c.unidad || "");
      if (c.aplica) cambio(k, parseFloat(el.value)); else estado[k] = parseFloat(el.value);
    } else if (el.tagName === "SELECT") cambio(k, el.value);
    else cambio(k, el.value);
  });
  $("tweaks").addEventListener("change", function (e) {
    var el = e.target, k = el.dataset.k, c = k && ctrl(k);
    if (el.type === "range" && c && !c.aplica) cambio(k, parseFloat(el.value));
  });
  addEventListener("resize", ajustarAlto);

  function ruta() {
    var id = decodeURIComponent(location.hash.slice(1)), c = id && porId(id);
    if (c) abrir(c); else portada();
  }
  addEventListener("hashchange", ruta);
  ruta();
})();
</script>
