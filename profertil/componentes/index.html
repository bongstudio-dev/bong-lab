<html lang="es">
<head>

<title>Componentes Profertil</title>
<meta name="description" content="Librería de componentes de la web de Profertil: galería en vivo y ficha técnica de cada uno.">

<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">

<style>
/* Los colores, tipografías y movimientos salen de tokens.css (generado desde el Master). Acá solo lo propio de la librería. */
:root {
  color-scheme: light;
  --suave: rgba(10, 30, 74, .055);
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --r: 10px;      /* controles y código */
  --r-l: 16px;    /* vistas previas */
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 13.5px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
::selection { background: var(--azul); color: var(--card); }
html { scrollbar-color: rgba(10, 30, 74, .25) transparent; }
.tabla, .ctl small { font-variant-numeric: tabular-nums; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Sidebar (sin cambios) ---------- */
.app { display: grid; grid-template-columns: 188px minmax(0, 1fr); min-height: 100vh; }
.lado { position: sticky; top: 0; height: 100vh; overflow: auto; padding: 18px 14px 24px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px; }
.lado__volver { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-3); text-decoration: none; }
.lado__volver .ico { width: 14px; height: 14px; stroke-width: 2; }
.lado__volver:hover { color: var(--azul); }
.lado__tit { display: block; color: inherit; text-decoration: none; margin: 0; border: 0; background: none; padding: 0; text-align: left; font: 600 15px/1.1 var(--f-display); letter-spacing: -.02em; }
.lado__tit small { display: block; margin-top: 4px; font: 400 11px/1.3 var(--f-body); letter-spacing: 0; color: var(--ink-3); }
.lado nav { display: flex; flex-direction: column; gap: 16px; }
.grupo__tit { margin: 0 0 5px; font: 500 10px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.grupo ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.item { text-decoration: none; display: flex; justify-content: space-between; align-items: center; gap: 6px; width: calc(100% + 12px); margin: 0 -6px; padding: 5px 6px; border: 0; border-radius: 7px; background: none; text-align: left; font-size: 12px; line-height: 1.25; color: var(--ink-2); transition: background .2s var(--ease), color .2s var(--ease); }
.item:hover { background: var(--suave); color: var(--ink); }
.item[aria-current="page"] { background: var(--azul); color: #fff; }
.item .n { font-size: 10px; opacity: .55; font-variant-numeric: tabular-nums; }

.centro { min-width: 0; }

/* ---------- Galería ---------- */
.gal { padding: 40px 32px 72px; }
.gal h1 { margin: 0 0 6px; font: 600 28px/1.1 var(--f-display); letter-spacing: -.025em; }
.gal > p { margin: 0 0 32px; max-width: 56ch; color: var(--ink-2); }
/* Tantas columnas como entren: en pantallas anchas la grilla llega hasta el borde derecho. */
.grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 32px 20px; }
.tar { color: inherit; text-decoration: none; display: flex; flex-direction: column; gap: 10px; border: 0; padding: 0; background: none; text-align: left; }
.tar[hidden] { display: none; }
.tar__vista { position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-radius: var(--r-l); background: var(--bg); box-shadow: 0 0 0 1px var(--line); pointer-events: none; transition: box-shadow .15s var(--ease); }
.tar:hover .tar__vista { box-shadow: 0 0 0 1px rgba(10, 30, 74, .28); }
.tar__vista iframe { position: absolute; left: 50%; top: 50%; width: 1280px; height: 800px; border: 0; transform-origin: 50% 50%; transform: translate(-50%, -50%) scale(var(--esc, .3)); background: var(--bg); }
.tar b { font: 500 14px/1.2 var(--f-body); }
.tar span { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-3); }

/* ---------- Ficha ---------- */
.ficha { display: grid; grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); gap: 32px; padding: 16px 16px 16px 32px; }
.doc { min-width: 0; padding: 24px 0 56px; display: flex; flex-direction: column; gap: 32px; }
.migas { text-decoration: none; border: 0; background: none; padding: 0; font-size: 12px; color: var(--ink-3); }
.migas:hover { color: var(--ink); }
.doc h1 { margin: 8px 0 8px; font: 600 28px/1.1 var(--f-display); letter-spacing: -.025em; }
.doc .bajada { margin: 0; color: var(--ink-2); }
.doc h2 { margin: 0 0 12px; font: 500 13px/1.2 var(--f-body); color: var(--ink); }

/* Variantes: pestañas de texto, una sola vez. */
.tabsv { display: flex; gap: 18px; border-bottom: 1px solid var(--line); }
.tabsv button { position: relative; padding: 0 0 10px; border: 0; background: none; color: var(--ink-3); font-size: 13.5px; transition: color .15s var(--ease); }
.tabsv button:hover { color: var(--ink); }
.tabsv button[aria-pressed="true"] { color: var(--ink); }
.tabsv button[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px; background: var(--ink); }
.tabsv + p { margin: 12px 0 0; color: var(--ink-2); }

/* Ajustes: filas simples, sin caja. */
.ajustes { display: flex; flex-direction: column; }
.ctl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); min-width: 0; align-items: center; gap: 12px; min-height: 44px; padding: 6px 0; border-top: 1px solid var(--line); }
.ctl:last-child { border-bottom: 1px solid var(--line); }
.ctl--desc { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 10px 0; }
.ctl__desc { margin: 0; font-size: 12px; color: var(--ink-3); }
/* Con tres opciones o más, el control va debajo del rótulo para que no se corten.
   (El primer hijo del .seg es el indicador: la tercera opción es el cuarto hijo.) */
.ctl:has(.seg button:nth-child(4)) { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 10px 0; }
.ctl > .et { font-size: 12.5px; color: var(--ink-2); }
.ctl > .et small { display: block; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
/* El Selector del sistema (Web/Selector del Master): cápsula de línea, indicador marfil que se desliza. */
.seg { position: relative; isolation: isolate; display: flex; min-width: 0; padding: 3px; border-radius: 999px; background: var(--line); }
/* Si las opciones no entran (cinco en mobile), la cápsula se desliza de costado en vez de cortarlas. */
.seg.ancho { overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }
.seg.ancho::-webkit-scrollbar { display: none; }
.seg.ancho button { flex: 1 0 auto; text-overflow: clip; }
.seg-ind { position: absolute; z-index: -1; top: 3px; left: 0; bottom: 3px; width: 0; border-radius: 999px; background: var(--card); box-shadow: 0 1px 3px rgba(10, 30, 74, .12); pointer-events: none; transition: transform 420ms cubic-bezier(.67, 0, .24, .99), width 420ms cubic-bezier(.67, 0, .24, .99); }
.seg-ind.quieto { transition: none; }
.seg button { flex: 1 1 0; min-width: 0; height: 28px; padding: 0 8px; border: 0; border-radius: 999px; background: transparent; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 240ms ease; display: inline-flex; align-items: center; justify-content: center; text-box: trim-both cap alphabetic; }
.seg button[aria-pressed="true"] { color: var(--azul); font-weight: 500; }
input[type="range"] { width: 100%; accent-color: var(--ink); margin: 0; }
input[type="text"], select { width: 100%; height: 32px; padding: 0 10px; border: 0; border-radius: var(--r); background: var(--suave); font-size: 12.5px; }
/* El interruptor del sistema (UI/Toggle del Master): 56 × 32, perilla de 26, verde prendido. */
.interr { justify-self: end; position: relative; width: 56px; height: 32px; padding: 0; border: 0; border-radius: 16px; background: #D9D9D9; transition: background 200ms ease; }
.interr::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(10, 30, 74, .2); transition: transform 240ms var(--ease); }
.interr[aria-checked="true"] { background: #2D8035; }
.interr[aria-checked="true"]::after { transform: translateX(24px); }

/* Código: una sola acción principal, Copiar. */
.codigo__cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.codigo__cab h2 { margin: 0; }
.codigo__der { display: flex; align-items: center; gap: 14px; }
.tabsc { display: flex; gap: 12px; }
.tabsc button { border: 0; background: none; padding: 0; font: 400 12px/1 var(--f-mono); color: var(--ink-3); }
.tabsc button[aria-pressed="true"] { color: var(--ink); }
.btn { height: 30px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--azul); color: #fff; font-size: 12.5px; transition: transform .15s var(--ease); display: inline-flex; align-items: center; justify-content: center; text-box: trim-both cap alphabetic; }
.btn:active { transform: scale(.97); }
pre { margin: 0; padding: 14px; max-height: 340px; overflow: auto; border-radius: var(--r); background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font: 400 11.5px/1.6 var(--f-mono); tab-size: 2; }

.claves { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); }

/* Referencia técnica: cerrada por defecto. */
details { border-top: 1px solid var(--line); padding-top: 14px; }
summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; font-weight: 500; font-size: 13px; }
summary::-webkit-details-marker { display: none; }
summary .ico { transition: transform .2s var(--ease); }
details[open] summary .ico { transform: rotate(90deg); }
.ref { display: flex; flex-direction: column; gap: 20px; padding-top: 16px; }
.ref p { margin: 0; color: var(--ink-2); }
.ref h3 { margin: 0 0 6px; font: 500 12px/1.2 var(--f-body); color: var(--ink-3); }
.tabla { width: 100%; border-collapse: collapse; font-size: 12px; }
.tabla th { padding: 0 8px 6px 0; text-align: left; font-weight: 400; color: var(--ink-3); }
.tabla td { padding: 8px 8px 8px 0; border-top: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
.tabla td:first-child { color: var(--ink); }
.tabla code { font: 400 11px/1.4 var(--f-mono); color: var(--ink); }

.vecinos { display: flex; justify-content: space-between; gap: 12px; }
.vecinos a { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; font-size: 12.5px; color: var(--ink-3); }
.vecinos a:hover { color: var(--ink); }

/* Vista previa. */
.previa { position: sticky; top: 16px; height: calc(100vh - 32px); border-radius: var(--r-l); overflow: hidden; background: var(--bg); box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; }
.previa__marco { width: 100%; height: 100%; transition: width .4s var(--ease), height .4s var(--ease); }
.previa[data-vista="mobile"] { background: #E2DFCC; }
.previa[data-vista="mobile"] .previa__marco { width: 390px; height: min(820px, calc(100% - 72px)); border-radius: 24px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.previa iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
.herr { position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; gap: 2px; padding: 2px; border-radius: var(--r); background: rgba(255, 254, 239, .9); box-shadow: 0 0 0 1px var(--line); }
.herr button { display: grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); transition: background .15s var(--ease), color .15s var(--ease); }
.herr button:hover { background: var(--suave); color: var(--ink); }
.previa:fullscreen { border-radius: 0; height: 100vh; }
/* Pantalla completa sin la API (iPhone: Safari solo la da para video). La previa tapa todo con position: fixed. */
.previa.pleno { position: fixed; inset: 0; z-index: 100; width: auto; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
html.con-pleno { overflow: hidden; }
.saltar { position: absolute; left: 12px; top: -48px; z-index: 10; padding: 8px 12px; border-radius: var(--r); background: var(--ink); color: var(--card); text-decoration: none; }
.saltar:focus { top: 12px; }
.oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* ---------- Dock de componentes (mobile) ----------
   El dock de filtros de Novedades: una pastilla de vidrio abajo que abre un panel con las categorías
   (Pastilla filtro del Master) y la lista de componentes. A la derecha, separada, el Ancla del Master:
   el círculo azul con la flecha, la acción principal. En una ficha lleva al componente siguiente;
   en la galería baja una pantalla o vuelve arriba. La flechita de anterior va adentro del dock. */
.dock, .ancla { display: none; }
@media (max-width: 760px) {
  :root { --a: 57px; } /* alto del dock cerrado: 46 de botón + 2 × 4 de aire + 2 de borde + 1 del panel */
  .dock {
    position: fixed; z-index: 40; left: 16px; right: calc(16px + var(--a) + var(--ancla-gap));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px)); max-height: calc(100% - 110px);
    display: flex; flex-direction: column; border-radius: 28px; overflow: hidden;
    background: var(--glass); border: 1px solid var(--borde-vidrio); box-shadow: 0 24px 60px -24px rgba(10, 30, 74, .5);
    backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
    transition: border-radius var(--f-cerrar) var(--f-curva);
  }
  .dock.open { border-radius: 26px; transition-duration: var(--f-abrir); }
  .dk-body {
    flex: 0 1 auto; min-height: 0; height: 0; overflow: hidden; visibility: hidden; opacity: 0; border-bottom: 1px solid transparent;
    transition: height var(--f-cerrar) var(--f-curva), opacity calc(var(--f-fundido) * .7) ease, border-color 260ms ease, visibility 0s linear var(--f-cerrar);
  }
  .dock.open .dk-body { visibility: visible; opacity: 1; border-bottom-color: var(--line); transition: height var(--f-abrir) var(--f-curva), opacity var(--f-fundido) ease var(--f-fundido-retraso), border-color 260ms ease; }
  .dock.open.listo .dk-body { height: auto; overflow-y: auto; overscroll-behavior: contain; }
  .dk-in { padding: 16px 14px 10px; display: grid; gap: 10px; }
  .dk-label { margin: 0; font: 500 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .dk-cats { display: flex; flex-wrap: wrap; gap: 7px; padding: 3px 0 8px; }
  /* Web/Pastilla filtro: rellena (azul), la elegida en tinta; "Todas" sin elegir es transparente. */
  .lbl { --h: 30px; display: inline-flex; align-items: center; flex: none; height: var(--h); padding: 0 calc(var(--h) * .48); border: 0; border-radius: 999px; background: var(--azul); color: var(--sobre-color); font: 400 calc(var(--h) * .47)/1 var(--f-display); white-space: nowrap; transition: background 240ms var(--ease), color 240ms var(--ease); text-box: trim-both cap alphabetic; }
  .lbl[aria-pressed="true"] { background: var(--activo); color: var(--sobre-color); }
  .lbl-todas { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .dk-lista { list-style: none; margin: 0; padding: 0; display: grid; }
  .dk-item { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 2px; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; font: 500 15px/1.2 var(--f-display); letter-spacing: -.01em; }
  .dk-item small { flex: none; font: 400 12px/1 var(--f-body); letter-spacing: 0; color: var(--ink-3); }
  .dk-item[aria-current="page"] { color: var(--azul); }
  .dk-item[aria-current="page"]::before { content: ""; width: 7px; height: 7px; margin-right: -4px; border-radius: 50%; background: var(--azul); align-self: center; flex: none; }
  .dk-item[aria-current="page"] span { flex: 1; }
  .dk-bar { flex: none; display: flex; align-items: center; gap: 2px; padding: 4px; }
  .dk-prev { flex: none; width: 46px; height: 46px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); transition: opacity .2s ease, width var(--f-chica) var(--f-chica-curva); }
  .dk-prev .ico { width: 20px; height: 20px; stroke-width: 2; }
  .dk-prev:active { background: var(--line); }
  .dk-prev:disabled { opacity: .3; }
  .dock[data-modo="galeria"] .dk-prev { width: 0; opacity: 0; pointer-events: none; }
  .dk-toggle { flex: 1; min-width: 0; height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: var(--ink); font: 400 1.04rem/1 var(--f-display); }
  .dock[data-modo="ficha"] .dk-toggle { padding-left: 4px; justify-content: space-between; }
  .dk-txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-box: trim-both cap alphabetic; }
  .dk-n { flex: none; font: 400 12px/1 var(--f-body); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .dk-toggle svg { flex: none; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform var(--f-flecha) var(--f-curva); }
  .dock.open .dk-toggle svg { transform: rotate(180deg); }
  .dk-der { display: flex; align-items: center; gap: 10px; }
  /* Ancla: el círculo azul, pegado a la derecha del dock pero separado (Web/Ancla/Separación). La escala y el giro los pone el JS con resortes. */
  .ancla { display: block; position: fixed; z-index: 41; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: var(--a); height: var(--a); padding: 0; border: 0; background: none; transform: scale(0); transform-origin: 50% 50%; will-change: transform; }
  .ancla-cuerpo { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: var(--azul); color: var(--tiza); }
  .ancla svg { width: 44%; height: 44%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; will-change: transform; }
  .ancla:focus-visible { outline: none; } .ancla:focus-visible .ancla-cuerpo { outline: 2px solid var(--celeste); outline-offset: 3px; }
  html.con-pleno .dock, html.con-pleno .ancla { visibility: hidden; }
}

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }

@media (max-width: 1100px) {
  .ficha { grid-template-columns: 1fr; padding: 16px; } .previa { position: relative; top: 0; height: 68vh; order: -1; } .doc { padding-top: 0; }
}
@media (max-width: 760px) {
  /* Mobile: la navegación pasa al dock de abajo; arriba queda solo el encabezado. */
  .app { grid-template-columns: minmax(0, 1fr); }
  .lado { position: static; height: auto; flex-direction: row-reverse; justify-content: space-between; align-items: center; gap: 12px; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; }
  .lado nav { display: none; }
  body { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .gal { padding: 24px 16px 32px; }
  .ficha { padding: 12px 16px 16px; gap: 24px; }
  .previa { height: 64vh; height: 64svh; }
  .doc { gap: 28px; padding-bottom: 24px; }
  .doc h1 { font-size: 26px; }
  /* En el teléfono no tiene sentido el marco de mobile: la previa ya es mobile. */
  .herr #vista { display: none; }
  .herr button { width: 38px; height: 38px; }
  .ctl { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 10px 0; }
  .ctl > .et small { display: inline; margin-left: 6px; }
  .seg button { height: 32px; }
  /* 16 px: con menos, Safari de iPhone hace zoom al enfocar el campo y la página queda corrida. */
  input[type="text"], select { height: 40px; font-size: 16px; }
  input[type="range"] { height: 28px; }

<script>
/* ==========================================================================

<script>

          '<div><b>' + esc(c.nombre) + '</b><span>' + esc(c.grupo) + (c.variantes ? ' · ' + c.variantes.length + ' variantes' : '') + '</span></div></a>';

    var c = ctrl(k);

  /* ---------------- pantalla completa ----------------
     Con la API cuando existe (desktop, iPad). En iPhone Safari solo la da para video: ahí la previa
     pasa a ocupar la pantalla con position: fixed (.pleno) y el mismo botón la cierra. */
  function enCompleta() { return !!(document.fullscreenElement || document.webkitFullscreenElement) || !!document.querySelector(".previa.pleno"); }
  function marcarCompleta() {
    var b = $("completa"); if (!b) return; var si = enCompleta(), t = si ? "Salir de pantalla completa" : "Pantalla completa";
    b.innerHTML = ico(si ? "salir" : "completa"); b.setAttribute("aria-label", t); b.title = t;
  }

  // El indicador del Selector va al botón elegido (igual que en Novedades).
  function moverInd(seg, animar) {
    var ind = seg.querySelector(".seg-ind"), b = seg.querySelector('button[aria-pressed="true"]');
    if (!ind || !b || !b.offsetWidth) return;

    seg.classList.remove("ancho");
    var nat = 6; seg.querySelectorAll("button").forEach(function (x) { nat += x.scrollWidth; });
    if (nat > seg.clientWidth + 1) {

  addEventListener("resize", moverInds);
  document.fonts && document.fonts.ready.then(moverInds);

  function ruta() {
    var p = decodeURIComponent(location.hash.slice(1)).split("/"), c = porId(p[0]);
    if (!c) { galeria(); return; }
    if (c !== actual) abrir(c);
    if (p[1] && c.variantes && c.variantes.some(function (v) { return v[0] === p[1]; }) && estado.variante !== p[1]) { var b = document.querySelector('[data-var="' + p[1] + '"]'); if (b) b.click(); }
  }

  /* ---------------- dock (mobile) ----------------
     Mismo comportamiento que el dock de filtros de Novedades: el panel anima su alto en px (medido),
     y al terminar queda en auto con scroll (.listo). Elegir una categoría filtra la lista del panel
     y, en la galería, también las tarjetas. */
  var filtro = "", dock = $("dock"), dkBody = $("dkBody"), tListo;
  // Anterior y siguiente recorren siempre todos los componentes, en el orden de la galería (la categoría solo filtra la lista).
  function secuencia() { return ordenados(); }
  function dibujarDock() {
    var o = ordenados(), lista = filtro ? o.filter(function (c) { return c.grupo === filtro; }) : o;
    $("dkCats").innerHTML = '<button type="button" class="lbl lbl-todas" data-grupo="" aria-pressed="' + !filtro + '">Todas</button>' +
      GRUPOS.filter(function (g) { return L.some(function (c) { return c.grupo === g; }); }).map(function (g) {
        return '<button type="button" class="lbl" data-grupo="' + esc(g) + '" aria-pressed="' + (filtro === g) + '">' + esc(g) + '</button>'; }).join("");
    $("dkLista").innerHTML = lista.map(function (c) {
      return '<li><a class="dk-item" href="#' + c.id + '"' + (actual === c ? ' aria-current="page"' : '') + '><span>' + esc(c.nombre) + '</span><small>' + esc(c.grupo) + '</small></a></li>'; }).join("");
    var sq = secuencia(), i = actual ? sq.indexOf(actual) : -1;
    dock.dataset.modo = actual ? "ficha" : "galeria";
    $("dkTxt").textContent = actual ? actual.nombre : (filtro || "Componentes");
    $("dkN").textContent = actual ? (i + 1) + " / " + sq.length : lista.length;
    $("dkPrev").disabled = !(i > 0);
  }
  function abrirDock(si) {
    if (!dock.classList.contains("open") && !si) return;
    clearTimeout(tListo);
    var desde = dkBody.offsetHeight;
    dock.style.transition = dkBody.style.transition = "none";
    dock.classList.remove("listo"); dock.classList.toggle("open", si); dkBody.style.height = "";
    var hasta = si ? (dock.classList.add("listo"), dkBody.offsetHeight) : 0;
    dock.classList.remove("listo"); dock.classList.toggle("open", !si); dkBody.style.height = desde + "px";
    void dock.offsetWidth;
    dock.style.transition = dkBody.style.transition = "";
    dock.classList.toggle("open", si); dkBody.style.height = hasta + "px";
    $("dkToggle").setAttribute("aria-expanded", String(si));
    var dur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(si ? "--f-abrir" : "--f-cerrar")) || 500;
    tListo = setTimeout(terminarDock, dur + 60);
    if (si) { var a = dkBody.querySelector('[aria-current="page"]'); if (a) setTimeout(function () { a.scrollIntoView({ block: "nearest" }); }, dur + 80); }
  }
  function terminarDock() { clearTimeout(tListo); dkBody.style.height = ""; if (dock.classList.contains("open")) dock.classList.add("listo"); }
  dkBody.addEventListener("transitionend", function (e) { if (e.target === dkBody && e.propertyName === "height") terminarDock(); });
  $("dkToggle").addEventListener("click", function () { abrirDock(!dock.classList.contains("open")); });
  $("dkPrev").addEventListener("click", function () { var sq = secuencia(), i = sq.indexOf(actual); if (i > 0) location.hash = sq[i - 1].id; });
  $("dkCats").addEventListener("click", function (e) {
    var b = e.target.closest("[data-grupo]"); if (!b) return;
    var g = b.dataset.grupo; filtro = filtro === g ? "" : g;
    // Cambia el alto del panel: se anima desde el actual hasta el nuevo.
    var desde = dkBody.offsetHeight; dibujarDock();
    if (dock.classList.contains("listo")) {
      var hasta = dkBody.scrollHeight; dock.classList.remove("listo"); dkBody.style.height = desde + "px"; void dkBody.offsetHeight;
      dkBody.style.height = Math.min(hasta, dock.parentNode.clientHeight) + "px";
      clearTimeout(tListo); tListo = setTimeout(terminarDock, 660);
    }
    if (!actual) {
      document.querySelectorAll(".tar").forEach(function (t) { t.hidden = !!filtro && t.dataset.grupo !== filtro; });
      if ($("galTit")) $("galTit").textContent = filtro ? "Componentes · " + filtro : "Componentes";
    }
  });
  document.addEventListener("pointerdown", function (e) { if (dock.classList.contains("open") && !dock.contains(e.target) && !ancla.contains(e.target)) abrirDock(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") abrirDock(false); });

  /* ---------------- ancla (mobile) ----------------
     El Ancla del Master (como en Novedades): resortes con los tokens Web/Resorte/Ancla*. En una ficha la
     flecha apunta a la derecha y lleva al siguiente; en la galería apunta abajo y baja una pantalla, y
     pasada una pantalla gira hacia arriba y vuelve al principio. El giro es lo único que rebota. */
  var ancla = $("ancla"), flecha = ancla.querySelector("svg"), movil = matchMedia("(max-width: 760px)"), quieto = matchMedia("(prefers-reduced-motion: reduce)");

  function siguiente() { var sq = secuencia(), i = sq.indexOf(actual); return i >= 0 ? sq[i + 1] : null; }
  function objetivos() {
    var sube = !actual && scrollY > innerHeight * CAMBIO;
    M.s.t = !movil.matches || enCompleta() ? 0 : actual ? (siguiente() ? 1 : 0) : (document.documentElement.scrollHeight > innerHeight * 1.2 ? 1 : 0);
    M.r.t = actual ? 0 : sube ? -90 : 90;
    var t = actual ? (siguiente() ? "Siguiente: " + siguiente().nombre : "") : sube ? "Volver arriba" : "Bajar";
    ancla.setAttribute("aria-label", t); ancla.tabIndex = M.s.t ? 0 : -1;
  }
  function paso(s, dt) { var ac = -s.k * (s.x - s.t) - s.c * s.v; s.v += ac * dt; s.x += s.v * dt; }
  var tAntes = 0, andando = false;
  function anim(now) {
    var dt = Math.min(.05, (now - tAntes) / 1000); tAntes = now; objetivos();
    var quietos = true;
    for (var k in M) {
      if (quieto.matches) { M[k].x = M[k].t; M[k].v = 0; continue; }
      var n = Math.ceil(dt / .004); for (var j = 0; j < n; j++) paso(M[k], dt / n);
      if (Math.abs(M[k].x - M[k].t) > .001 || Math.abs(M[k].v) > .001) quietos = false; else { M[k].x = M[k].t; M[k].v = 0; }
    }
    ancla.style.transform = "scale(" + (Math.max(0, M.s.x) * M.q.x).toFixed(4) + ")";
    flecha.style.transform = "rotate(" + M.r.x.toFixed(2) + "deg)";
    if (quietos) andando = false; else requestAnimationFrame(anim);
  }
  function mover() { if (!andando && movil.matches) { andando = true; tAntes = performance.now(); requestAnimationFrame(anim); } }
  addEventListener("scroll", mover, { passive: true }); addEventListener("resize", mover); addEventListener("hashchange", mover);
  if (movil.addEventListener) movil.addEventListener("change", mover);
  ancla.addEventListener("pointerdown", function () { M.q.t = APRETAR; mover(); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) { ancla.addEventListener(ev, function () { M.q.t = 1; mover(); }); });
  ancla.addEventListener("click", function () {
    abrirDock(false);
    if (actual) { var s = siguiente(); if (s) location.hash = s.id; return; }
    var suave = quieto.matches ? "auto" : "smooth";
    if (scrollY > innerHeight * CAMBIO) scrollTo({ top: 0, behavior: suave }); else scrollBy({ top: Math.round(innerHeight * BAJAR), behavior: suave });
  });

  ruta(); mover();
})();
</script>
