<style>
:root{--bg:#003DA5;--fg:#FFFEEF;--ac:#EABA2C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#003DA5;--fg:#FFFEEF;--ac:#EABA2C}}
:root[data-theme="dark"]{--bg:#003DA5;--fg:#FFFEEF;--ac:#EABA2C}
*{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
.top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.top span{font-size:13px;font-weight:500;opacity:.8;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.top div{display:flex;gap:6px;pointer-events:auto}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin:2px 4px -2px}
button{font:inherit;font-size:14px;font-weight:700;padding:10px 4px;border-radius:999px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer;white-space:nowrap}
.top button{padding:8px 14px;background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>

const VERT=`
precision highp float;
attribute vec3 aPosition;
void main(){vec4 p=vec4(aPosition,1.0);p.xy=p.xy*2.0-1.0;gl_Position=p;}`;
const FRAG=`
precision highp float;
uniform sampler2D tex;
uniform vec2 res,p1,p2,s1,s2;
uniform float r1,r2,kMerge,str,disp,frost,bevel,wob,tint,time,dens;
float sdRB(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float map(vec2 p){
  float d=smin(sdRB(p-p1,s1,r1),sdRB(p-p2,s2,r2),kMerge);
  d+=wob*sin(p.x*.018/dens+time*2.6)*sin(p.y*.021/dens+time*2.1)*5.*dens;
  return d;
}
vec3 T(vec2 p){return texture2D(tex,clamp(p/res,0.001,.999)).rgb;}
void main(){
  vec2 p=vec2(gl_FragCoord.x,res.y-gl_FragCoord.y);
  float d=map(p);
  vec3 outside=T(p);
  float sh=(1.-smoothstep(0.,28.*dens,d))*.22*step(0.,d);
  outside*=1.-sh;
  vec2 e=vec2(1.,0.);
  vec2 g=vec2(map(p+e.xy)-map(p-e.xy),map(p+e.yx)-map(p-e.yx));
  g=g/(length(g)+1e-5);
  float bv=bevel*dens;
  float tt=clamp(-d/bv,0.,1.);
  float edge=1.-tt;
  float h=sqrt(max(1.-edge*edge,.0025));
  float slope=min(edge/h,6.);
  vec2 off=-g*slope*str*bv*.35;
  vec3 col;
  if(frost>0.){
    vec3 acc=vec3(0.);float fr=frost*dens*2.5;
    for(int i=0;i<8;i++){float a=float(i)*.785398+time*0.;acc+=T(p+off+vec2(cos(a),sin(a))*fr*(1.+.5*mod(float(i),2.)));}
    col=acc/8.;
  }else{
    col=vec3(T(p+off*(1.+disp)).r,T(p+off).g,T(p+off*(1.-disp)).b);
  }
  col=mix(col,vec3(1.),tint);
  vec2 L=normalize(vec2(-.55,-.85));
  float rim=smoothstep(.55,1.,edge);
  float spec=pow(max(dot(g,L),0.),2.)*rim*.85+pow(max(dot(g,-L),0.),3.)*rim*.35;
  float line=smoothstep(.9,1.,edge)*.25;
  col+=spec+line;
  float a=smoothstep(.75,-.75,d);
  gl_FragColor=vec4(mix(outside,col,a),1.);
}`;

function setup(){
  D=Math.min(1.5,window.devicePixelRatio||1);
  pixelDensity(D);
  cv=createCanvas(windowWidth,windowHeight,WEBGL);cv.parent('stage');
  sh=createShader(VERT,FRAG);
  makeBg();
  const u=usable();
  lens.x=tgt.x=u.cx;lens.y=tgt.y=u.cy;drop.x=u.cx;drop.y=u.cy;
  const el=cv.elt;
  const setP=e=>{const r=el.getBoundingClientRect();tgt.x=e.clientX-r.left;tgt.y=e.clientY-r.top};
  el.addEventListener('pointerdown',e=>{ptr.down=true;setP(e);try{el.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener('pointermove',e=>{if(ptr.down)setP(e)});
  ['pointerup','pointercancel'].forEach(n=>el.addEventListener(n,()=>{ptr.down=false}));
  applyCss();
}
function makeBg(){if(bgG)bgG.remove();bgG=createGraphics(width,height);bgG.pixelDensity(D)}
function usable(){const b=document.getElementById('bar').getBoundingClientRect().height;return{cx:width/2,cy:(height-b)/2+20}}
function applyCss(){const P=PALS[pi],r=document.documentElement.style;
  const light=P.bg==='#FFFEEF';r.setProperty('--bg',P.bg);r.setProperty('--fg',light?'#003DA5':'#FFFEEF');r.setProperty('--ac',P.c[0])}

/* Fondo animado: mosaico de formas o rayas */
function drawBg(){
  const P=PALS[pi],c=bgG.drawingContext;
  c.setTransform(D,0,0,D,0,0);
  c.fillStyle=P.bg;c.fillRect(0,0,width,height);
  if(bgMode===0){
    const cell=Math.max(64,Math.round(Math.min(width,height)/5.2)),off=(t*18)%cell;
    let k=0;
    for(let y=-cell;y<height+cell;y+=cell){
      const row=Math.floor((y+t*18)/cell);
      for(let x=cell/2;x<width+cell/2;x+=cell){
        const i=((Math.floor(x/cell)*5+row*3)%NAMES.length+NAMES.length)%NAMES.length,s=SHAPES[NAMES[i]];
        const sc=cell*.62/s.m;
        c.save();c.translate(x,y-off+cell/2);c.scale(sc,sc);c.translate(-s.vb[0]/2,-s.vb[1]/2);
        c.fillStyle=P.c[((Math.floor(x/cell)+row)%4+4)%4];
        s.p.forEach(pp=>c.fill(pp,s.eo?'evenodd':'nonzero'));c.restore();k++;
      }
    }
  }else{
    const w=Math.max(18,Math.round(width/16)),off=(t*14)%(w*4);
    for(let x=-w*4;x<width+w*4;x+=w){
      const i=Math.round((x+w*4)/w)%4;
      if(i%2===0){c.fillStyle=P.c[i];c.fillRect(x+off,0,w*.55,height)}
    }
    c.fillStyle=P.c[2];c.font='700 '+Math.round(width/5.5)+'px Archivo, system-ui, sans-serif';
    c.textAlign='center';c.textBaseline='middle';
    c.fillText('Profertil',width/2,height*.3);
  }
}

function draw(){
  const dt=Math.min(deltaTime,50)*.001;t+=dt;
  for(const k in mat)matT[k]+=(mat[k]-matT[k])*.12;
  drawBg();
  /* resorte: el cristal persigue el dedo */
  const ax=(tgt.x-lens.x)*.09,ay=(tgt.y-lens.y)*.09;
  lens.vx=(lens.vx+ax)*.74;lens.vy=(lens.vy+ay)*.74;lens.x+=lens.vx;lens.y+=lens.vy;
  const S=Math.min(width,height)/390,u=usable();
  const st=Math.min(Math.hypot(lens.vx,lens.vy)*.9,40);
  const sx=Math.abs(lens.vx)/(Math.abs(lens.vx)+Math.abs(lens.vy)+.01);
  let s1=[0,0],r1=0,s2=[1,1],r2=1,p2=[-9999,-9999],k=1;
  if(shapeMode==='pill'){s1=[125*S,52*S];r1=52*S}
  else if(shapeMode==='circle'){s1=[82*S,82*S];r1=82*S}
  else if(shapeMode==='card'){s1=[135*S,88*S];r1=34*S}
  else{
    s1=[62*S,62*S];r1=62*S;s2=[48*S,48*S];r2=48*S;k=55*S;
    drop.x=u.cx+Math.cos(t*.7)*width*.22;drop.y=u.cy+Math.sin(t*1.1)*height*.16;
    p2=[drop.x*D,drop.y*D];
  }
  s1=[s1[0]+st*sx*S,s1[1]+st*(1-sx)*S];
  shader(sh);
  sh.setUniform('tex',bgG);
  sh.setUniform('res',[width*D,height*D]);
  sh.setUniform('dens',D);
  sh.setUniform('p1',[lens.x*D,lens.y*D]);
  sh.setUniform('s1',[s1[0]*D,s1[1]*D]);sh.setUniform('r1',Math.min(r1*D,Math.min(s1[0],s1[1])*D));
  sh.setUniform('p2',p2);sh.setUniform('s2',[s2[0]*D,s2[1]*D]);sh.setUniform('r2',r2*D);
  sh.setUniform('kMerge',k*D);
  sh.setUniform('str',matT.str);sh.setUniform('disp',matT.disp);sh.setUniform('frost',matT.frost);
  sh.setUniform('bevel',matT.bevel*S);sh.setUniform('wob',matT.wob);sh.setUniform('tint',matT.tint);
  sh.setUniform('time',t);
  noStroke();rect(0,0,width,height);
}

function windowResized(){resizeCanvas(windowWidth,windowHeight);makeBg()}

function group(id,fn){const row=document.getElementById(id);row.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  row.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset.v)}))}
group('shapeRow',v=>{shapeMode=v});
group('matRow',v=>{mat=MATS[+v]});
document.getElementById('pal').addEventListener('click',()=>{pi=(pi+1)%PALS.length;applyCss()});
document.getElementById('bgb').addEventListener('click',()=>{bgMode=1-bgMode});
</script>
</body>
</html>
