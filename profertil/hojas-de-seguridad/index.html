<style>
/* Biblioteca Virtual Profertil: los documentos técnicos del sitio actual (boletines, ensayos, informes de campaña).
   Misma lógica que Novedades (barra, filtros en el dock, buscador en la lupa, ancla) y la cabecera de la Nota (campo de Formas con tarjeta); en vez de tarjetas, filas.
   Los filtros son las etiquetas del sitio actual: cultivo, zona, año y nutriente. */

html { scrollbar-gutter: stable; scroll-padding-block: 96px 96px; } /* el lugar de la barra de scroll queda reservado: si aparece y desaparece según el largo de la lista, el contenido se corre de costado */

/* Sin el destello gris de Safari al tocar (el resto del tacto está en la pieza "pagina" de base.css). */

/* --- Resultado ------------------------------------------------------------ */
.pf-herramientas { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

/* --- Panel de filtros: barra fija full rounded con los cuatro
   grupos (cultivo, zona, año, nutriente); arriba se despliega el panel con los
   grupos en acordeón, uno abierto por vez. En mobile la barra se reduce a un
   boton "Filtros" y el panel trae los cuatro grupos. Abre y cierra animando el alto del panel (medido en
   JS: animar 0fr a 1fr en un contenedor de alto automatico falla en Chrome)
   y, en mobile, el ancho. */

/* --- Grupos del panel: acordeón. Un grupo abierto por vez; cerrado muestra sus filtros activos (se sacan tocándolos).
   Dentro de un grupo las opciones suman (o); entre grupos se cruzan (y). Las que darían 0 resultados quedan atenuadas. */
/* Desktop: cerrada, la barra abraza sus cinco pastillas (con un ancho fijo
   quedaba un hueco entre Nutriente y la flecha); abierta crece a 680 para
   que entren los grupos. Lo que se anima es el min-width (el width sigue en
   fit-content), con la misma curva y tiempos que el alto del panel. Parte del
   ancho cerrado medido (--f-w-cerrada, lo pone abrirFiltros): desde 0 la
   barra no se movía hasta que el min-width pasaba su ancho. */
@media (min-width: 641px) {
  .pf-filters { min-width: var(--f-w-cerrada, 0px); transition: min-width var(--f-cerrar) var(--f-curva), border-radius var(--f-cerrar) var(--f-curva), transform 520ms var(--ease), opacity 300ms ease; }
  .pf-filters.pf-abierto { min-width: min(100% - 32px - var(--a), 680px); transition-duration: var(--f-abrir), var(--f-abrir), 520ms, 300ms; }
}
.pf-f-in { gap: 10px; }
.pf-f-grupos { display: grid; grid-template-columns: minmax(0, 1fr); }
.pf-f-gr + .pf-f-gr { border-top: 1px solid var(--line); }
.pf-f-gr__cab { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 6px 2px; border: 0; background: transparent; cursor: pointer; text-align: left; }
.pf-f-gr__cab .pf-f-label { flex: none; font-size: 0.8rem; color: var(--ink); }
.pf-f-gr__res { flex: 1; min-width: 0; font-size: var(--texto-chico); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pf-f-gr__cab svg { flex: none; width: 18px; height: 18px; fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transform: rotate(180deg); transition: transform var(--f-acordeon, 260ms) var(--f-curva); }
.pf-f-gr.pf-abierto .pf-f-gr__cab svg { transform: none; }
@media (hover: hover) and (pointer: fine) { .pf-f-gr__cab:hover .pf-f-label { color: var(--azul); } }
.pf-f-gr__cab .pf-f-n { position: static; }
.pf-f-gr__activos { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 12px; }
.pf-f-gr__activos:empty, .pf-f-gr.pf-abierto .pf-f-gr__activos { display: none; }
/* Las elegidas se sacan tocándolas: la cruz no se dibuja, y sin ella tampoco cuenta el hueco del gap (dejaba más aire a la derecha). */
.pf-f-gr__activos svg { display: none; }
/* Acordeón: el alto lo anima cambiarGrupo() cuadro a cuadro (ver ahí por qué); el CSS solo da los dos estados.
   El contenido acompaña con un fundido del mismo largo; al cerrar se va antes (mitad del tiempo) para no verse cortado. */
.pf-f-gr__cuerpo { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 0fr; visibility: hidden; }
.pf-f-gr.pf-abierto .pf-f-gr__cuerpo { grid-template-rows: 1fr; visibility: visible; }
.pf-f-gr__cuerpo > div { min-height: 0; min-width: 0; overflow: hidden; opacity: 0; transition: opacity calc(var(--f-acordeon, 260ms) * .5) ease; }
.pf-f-gr.pf-abierto .pf-f-gr__cuerpo > div { opacity: 1; transition: opacity var(--f-acordeon, 260ms) ease; }
.pf-quieto .pf-f-gr__cuerpo, .pf-quieto .pf-f-gr__cuerpo > div { transition: none !important; }
.pf-f-gr__in { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 0 0 14px; }
.pf-f-sub { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.pf-f-sub__t { margin: 0; padding-left: 3px; font-size: 0.74rem; color: var(--ink-2); }
.pf-f-gr .pf-f-row { padding: 2px; gap: 6px; }
/* Zona: una fila por provincia; la primera pastilla es la provincia entera, separada de sus localidades. */
.pf-f-prov { margin-right: 6px; }
.pf-f-gr .pf-pastilla, .pf-f-gr .pf-chip { gap: 7px; }
/* El número va más chico. Centrados por separado, el número quedaba 1 px más alto que el nombre: con número, la pastilla alinea
   por línea de base y el nombre sube 1 px (padding de arriba = aire parejo - 1), así los dos se apoyan en la misma línea. */
.pf-pastilla__n { font: 400 round(0.86em, 1px)/1 var(--f-body); font-variant-numeric: tabular-nums; opacity: .72; }
.pf-pastilla:has(> .pf-pastilla__n) { align-items: baseline; padding-top: calc((var(--h) - var(--fs)) / 2 - 1px); }
.pf-f-gr .pf-cero:not([aria-pressed="true"]) { opacity: .34; cursor: default; }
.pf-f-gr .pf-cero:not([aria-pressed="true"]):active { transform: none; }
/* Contador de filtros activos en la barra y en cada grupo. */
/* Centrado del número: todo cae en píxel entero. Con 17 px el círculo quedaba
   en medio píxel dentro de la pastilla de 30 y la cifra, ajustada al píxel,
   se corría. 18 px de alto, cuerpo de 11 px. Centrada sola, la línea de base cae en 12,75 px y Safari la redondea
   distinto según dónde esté el círculo en la pantalla (un contador se veía más alto que otro): el medio píxel de
   arriba la deja en 13 justos. Cifras proporcionales: el 1 tabular queda corrido. */
.pf-f-n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: .5px 4px 0; border-radius: 999px; background: var(--verde); color: #fff; font: 400 11px/12px var(--f-body); }
.pf-f-main .pf-pastilla { gap: 6px; }
.pf-f-main .pf-pastilla[aria-expanded="true"] { background: var(--line); }
@media (max-width: 640px) {
  .pf-f-gr__cab { min-height: 52px; }
  .pf-f-gr .pf-pastilla { --h: 34px; }
  .pf-f-gr .pf-chip { --h: 34px; }
  .pf-f-gr .pf-f-row { gap: 8px; }
}
/* Sin sombras: la barra y el indicador de los selectores (piezas de base.css) quedan planos en esta página. */
.pf-selector__ind { box-shadow: none; }

/* --- Vacio ---------------------------------------------------------------- */

@media (max-width: 640px) {
  /* Vista y orden tienen que entrar en una línea (en 375 sobran pocos px). */
  /* Mobile: como la historia. Texto arriba y la foto abajo, a todo el ancho. */
  /* Mobile: la barra es solo el boton "Filtros"; el panel trae categorias y año. */
  /* Cerrado y abierto ocupan la columna del contenido (.pf-wrap deja 16 px por
     lado): el ancho no se anima. El tweak puede probar un cerrado mas angosto
     con --f-ancho-cerrado. */
  /* Bajando, la pastilla se compacta como la barra de direcciones de Safari:
     angosta, mas baja, con el texto y la flecha mas chicos y pegada al borde.
     Subiendo (o al llegar al final) vuelve. Abierta nunca esta chica. El ancho
     del cerrado y el abierto es el mismo, asi que esta transicion solo corre
     al compactar y al volver. */
}
/* --- Ancla: la accion principal, afuera del dock -------------------------
   Un circulo azul con la flecha, pegado a la derecha del dock pero separado
   de el. Es lo unico saturado de la barra. Baja o
   vuelve al principio de la lista; la mueve el JS (ver "Ancla" abajo).
   --a es el alto del dock cerrado: en desktop 30 de pastilla + 2 x 3 de
   f-main + 2 x 5 de f-bar + 2 de borde + 1 del borde del f-body = 49. La
   separacion y los resortes son tokens del Figma (--ancla-*, ver "Ancla" en
   el JS). */
/* Abajo se ancla con el mismo bottom que el dock (y la misma transicion al
   compactarse): asi Safari, al mostrar o esconder su barra, mueve los dos
   juntos. Si la altura la pusiera el JS desde arriba, la bola llegaria un
   cuadro tarde y saltaria. En mobile la x y el alto tambien salen del CSS,
   con la transicion del dock: su borde derecho es lineal en su ancho, asi
   que los dos se mueven juntos cuadro a cuadro. En desktop la x la pone el JS
   (--ancla-x: ahi el dock no se compacta). El JS solo pone la escala. */
@media (max-width: 640px) {
  /* Mobile: --a es 57, toggle 46 + 2 x 4 de f-bar + 2 de borde + 1 del
     f-body. El dock (ancho w) va centrado entre 0 y 100% - --a - gap: su borde
     derecho es (100% - --a - gap + w) / 2 y la bola arranca un gap despues.
     Con w = 100% - 32 - gap - --a da 100% - 16 - --a. Compacto, w es 104
     (128 con contador) y el alto 41: toggle 30 + 2 x 4 de f-bar + 2 de
     borde + 1 del borde del f-body. */
}

/* --- Encabezado: la cabecera de la Nota. Un campo fijo de Formas (campo.js, el mismo de la Nota) con el título y la bajada
   en una tarjeta; la lista sube por encima al hacer scroll. */
#pf-campo { position: fixed; inset: 0; width: 100%; height: 100lvh; z-index: 0; display: block; pointer-events: none; }
.pf-campo-cab { position: relative; z-index: 1; min-height: var(--pf-campo-alto, 70svh); padding: calc(var(--pf-barra-h, 64px) + 12px) 12px 88px; }
.pf-bh { display: grid; gap: 16px; justify-items: start; width: min(100%, 760px); margin-inline: auto;
  background: var(--pf-papel, #fff); border-radius: var(--radio-tarjeta, 24px); padding: 22px 20px 26px; }
.pf-bh h1 { margin: 0; font: 600 2.1rem/1.02 var(--f-display); letter-spacing: -0.035em; color: var(--azul); text-wrap: balance; }
.pf-bh p { margin: 0; max-width: 60ch; font-size: var(--texto-cuerpo); line-height: 1.5; color: var(--ink-2); text-wrap: pretty; }
/* Pista de scroll */
.pf-campo-seguir { position: absolute; left: 50%; bottom: 24px; translate: -50% 0; width: 44px; height: 44px; border-radius: 50%;
  background: var(--pf-papel, #fff); color: var(--ink, #111); display: grid; place-items: center; transition: opacity 300ms ease; }
.pf-campo-seguir svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pf-campo-bajo .pf-campo-seguir { opacity: 0; }
/* La hoja con la lista es opaca y tapa el campo; de borde a borde, con la columna adentro. */
/* overflow-x: clip: al cambiar de vista las filas se deslizan desde su lugar viejo (una tarjeta de la columna derecha arranca corrida a
   la derecha) y, sin recorte, la página se ensanchaba un instante: Safari en iPhone la alejaba entera para que entre. */
.pf-hoja { position: relative; z-index: 2; min-height: 100svh; padding-top: 8px; background: var(--pf-papel, #fff); overflow-x: clip;
  border-radius: var(--radio-tarjeta, 24px) var(--radio-tarjeta, 24px) 0 0; }
@media (min-width: 720px) {
  .pf-campo-cab { padding: calc(var(--pf-barra-h, 64px) + 24px) 24px 96px; }
  .pf-bh { margin-inline: 0; width: auto; padding: 32px 36px 36px; gap: 18px; }
  .pf-bh h1 { font-size: clamp(36px, 4.4vw, 60px); }
  .pf-bh p { font-size: var(--texto-destacado); }
  .pf-hoja { padding-top: 24px; }
}
.pf-result-row { margin-top: 8px; }

/* --- Filas: una por documento, separadas por una línea (sin cajas ni sombras). */
.pf-docs:not(:empty) { min-height: 60vh; }
/* La fila de base.css (pieza "documento") más el cursor y la entrada al aparecer. */
.pf-doc { cursor: pointer; animation: pf-entra 380ms var(--ease) backwards; }
@keyframes pf-entra { from { opacity: 0; } } /* solo aparece: sin desplazamiento, para que al filtrar nada parezca moverse */
/* Toda la fila es el enlace; el botón de descarga queda por encima. */
/* Área de toque: el botón se ve igual pero responde en 44 px o más (también los selectores y el botón de filtros). */
.pf-doc__d::after, .pf-f-toggle::after { content: ""; position: absolute; inset: -8px; border-radius: 999px; }
.pf-f-toggle::after { inset: -8px -4px; }
.pf-herramientas .pf-selector button { position: relative; }
.pf-herramientas .pf-selector button::after { content: ""; position: absolute; inset: -9px 0; }
.pf-doc__d:active { scale: .94; }
}

/* --- Filtros activos: un chip por filtro (categoría, año y búsqueda); tocarlo lo saca. */
/* Van en la misma fila que el contador (con el alto de los selectores): al sumar o sacar un filtro la lista no se corre. */
.pf-result-main { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-width: 0; min-height: 36px; }
.pf-activos { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
/* Celular: los selectores van arriba y el contador con los chips en una sola línea. El contador queda fijo y solo los chips se
   desplazan de costado, hasta el borde de la pantalla. El alto no cambia al sumar o sacar filtros y no queda un hueco reservado
   entre el contador y la lista. */
@media (max-width: 640px) {
  .pf-result-row { padding-block: 18px 12px; gap: 12px; }
  .pf-herramientas { order: -1; width: 100%; justify-content: space-between; flex-wrap: nowrap; }
  .pf-result-main { min-height: 32px; flex-wrap: nowrap; gap: 12px; margin-right: -16px; width: calc(100% + 16px); }
  .pf-result-text { flex: none; white-space: nowrap; }
  .pf-activos { flex-wrap: nowrap; flex: 1; min-width: 0; align-self: stretch; overflow-x: auto; scrollbar-width: none; padding-right: 16px; }
  .pf-activos::-webkit-scrollbar { display: none; }
  .pf-activos > * { flex: none; }
  .pf-activos__limpiar { flex: none; white-space: nowrap; }
}
/* Tenues y bajos: dicen qué está filtrando sin competir con la lista. El tono es el del chip sin elegir. */
.pf-activos .pf-chip { --h: 26px; gap: 6px; padding: 0 8px 0 10px; font-size: 12px; background: var(--chip-fondo); color: var(--chip-texto); }
@media (hover: hover) and (pointer: fine) { .pf-activos .pf-chip:hover { background: color-mix(in srgb, var(--azul) 26%, #fff); } }
.pf-activos .pf-chip svg { width: 9px; height: 9px; opacity: .7; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.pf-activos__limpiar { align-self: center; border: 0; background: transparent; cursor: pointer; padding: 4px 6px; color: var(--azul); font-size: var(--texto-chico); text-decoration: underline; text-underline-offset: 3px; }

/* --- Vistas: compacta, lista (la de siempre) y miniaturas. El selector es el de Novedades; al cambiar, solo la lista se funde y el
   indicador viaja a su lugar. No usa View Transitions: capturan la página entera y activarían la animación de página de
   transicion.css (::view-transition-old/new(root)). */
.pf-doc.pf-quieta { animation: none; } /* filas que se arman al cambiar de vista: nacen sin la entrada y no la reciben después */
.pf-doc__arte { display: none; }

/* Compacta: una línea por documento, solo el ícono de la categoría. */
.pf-docs[data-vista="compacta"] .pf-doc { grid-template-columns: 22px minmax(0, 1fr) 44px 30px; column-gap: 14px; padding: 7px 0; }
.pf-docs[data-vista="compacta"] .pf-etiqueta__rotulo, .pf-docs[data-vista="compacta"] .pf-etiqueta__dato { display: none; }
.pf-docs[data-vista="compacta"] .pf-doc__t { font-size: 1rem; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pf-docs[data-vista="compacta"] .pf-doc__d { width: 28px; height: 28px; }
.pf-docs[data-vista="compacta"] .pf-doc__d svg { width: 14px; height: 14px; }

/* Miniaturas: cuadrados con el arte de la categoría (las Formas del sistema), el título abajo. */
/* align-content start: con pocos resultados el min-height de la lista (60vh) no se reparte entre las filas. */
.pf-docs[data-vista="mini"] { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); align-content: start; gap: 30px 18px; border-top: 0; padding-top: 4px; }
.pf-docs[data-vista="mini"] .pf-doc { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; align-items: start; row-gap: 10px; padding: 0; border: 0; }
.pf-docs[data-vista="mini"] .pf-doc__arte { display: block; grid-row: 1; aspect-ratio: 1; border-radius: var(--radio-media); overflow: hidden; line-height: 0; transition: transform 320ms var(--ease); }
.pf-docs[data-vista="mini"] .pf-doc__arte svg { width: 100%; height: 100%; }
.pf-docs[data-vista="mini"] .pf-doc .pf-etiqueta { position: absolute; top: 10px; left: 10px; z-index: 1; max-width: calc(100% - 20px); }
.pf-docs[data-vista="mini"] .pf-etiqueta__rotulo { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pf-docs[data-vista="mini"] .pf-doc__t { grid-row: 2; padding: 0 2px; font-size: 1.04rem; line-height: 1.18; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pf-docs[data-vista="mini"] .pf-doc__y { grid-row: 3; padding: 0 2px; text-align: left; margin-top: -4px; }
.pf-docs[data-vista="mini"] .pf-doc__y:empty { display: none; }
.pf-docs[data-vista="mini"] .pf-doc__d { position: absolute; top: 10px; right: 10px; z-index: 2; width: 30px; height: 30px; background: var(--color-blanco); border-color: transparent; }
@media (hover: hover) and (pointer: fine) {
  .pf-docs[data-vista="mini"] .pf-doc:hover { translate: 0 -5px; }
  .pf-docs[data-vista="mini"] .pf-doc__d:hover { background: var(--azul); border-color: var(--azul); color: var(--tiza); }
  .pf-docs[data-vista="mini"] .pf-doc:hover .pf-doc__t { translate: 0 0; }
}
.pf-docs[data-vista="mini"] .pf-doc:active { translate: 0 -2px; }
/* La tarjeta entera sube y toda es el enlace (la etiqueta deja pasar el clic). El enlace llega 8 px más abajo para que, al subir, el cursor
   no quede afuera de la tarjeta y la haga titilar en el borde inferior. */
.pf-docs[data-vista="mini"] .pf-doc { transition: translate 320ms var(--ease); }
.pf-docs[data-vista="mini"] .pf-doc .pf-etiqueta { pointer-events: none; }
.pf-docs[data-vista="mini"] .pf-doc__t a::after { inset: 0 0 -8px 0; }
@media (max-width: 640px) {
  .pf-docs[data-vista="compacta"] .pf-doc { grid-template-columns: 22px minmax(0, 1fr) 30px; padding: 9px 0; row-gap: 0; }
  .pf-docs[data-vista="compacta"] .pf-doc .pf-etiqueta, .pf-docs[data-vista="compacta"] .pf-doc__t { grid-row: 1; }
  .pf-docs[data-vista="compacta"] .pf-doc .pf-etiqueta { grid-column: 1; }
  .pf-docs[data-vista="compacta"] .pf-doc__t { grid-column: 2; font-size: .98rem; }
  .pf-docs[data-vista="compacta"] .pf-doc__y { display: none; }
  .pf-docs[data-vista="compacta"] .pf-doc__d { grid-column: 3; grid-row: 1; align-self: center; }
  .pf-docs[data-vista="mini"] { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px; }
  .pf-docs[data-vista="mini"] .pf-doc .pf-etiqueta { grid-column: auto; grid-row: auto; }

/* Hojas de seguridad: sin filtros, ancla ni orden por año. La fila es el ícono, el producto y la descarga: el rótulo de la
   etiqueta y el año sobran (todas son hojas de seguridad y ninguna tiene año). */
.pf-filters, .pf-ancla, .pf-orden { display: none; }
.pf-docs[data-vista="lista"] .pf-doc { grid-template-columns: 34px minmax(0, 1fr) 36px; }

/* Transición entre páginas: el componente "Transiciones de página" de la librería
   (persiana con logo, persiana con logo animado o fundido), usado entre Novedades y cada Nota. La elección vive
   en el navegador de quien prueba y se cambia con el panel de abajo a la izquierda. */
:root { --pf-tr-dur: 700ms; --pf-tr-curva: cubic-bezier(.67, 0, .24, .99); --pf-tr-color: var(--azul); }

.pf-tr-velo.pf-entra { transition: transform var(--pf-tr-dur) var(--pf-tr-curva); transform: none; }
.pf-tr-velo.pf-entra svg { transition: opacity calc(var(--pf-tr-dur) * .6) var(--pf-tr-curva) calc(var(--pf-tr-dur) * .45), transform calc(var(--pf-tr-dur) * .8) var(--pf-tr-curva) calc(var(--pf-tr-dur) * .45); opacity: 1; transform: none; }
/* Al llegar a la página nueva el paño ya está arriba (lo pone el script del head) y sigue de largo. */
:root.pf-tr-tapa .pf-tr-velo { transform: none; }
/* Una sola persiana con dos logos: el fijo o el que se arma. */
:root:not([data-tr-v="animada"]) .pf-tr-velo .pf-la, :root[data-tr-v="animada"] .pf-tr-velo .pf-tr-logo { display: none; }
:root[data-tr-v="animada"] .pf-tr-velo { --pf-la-dur: var(--pf-tr-la, 1100ms); }
:root.pf-tr-tapa .pf-tr-velo svg { opacity: 1; transform: none; }
.pf-tr-velo.pf-sale { transition: transform var(--pf-tr-dur) var(--pf-tr-curva); transform: translateY(-100%); }
.pf-tr-velo.pf-sale svg { opacity: 1; transform: none; }

/* Fundido: la página vieja se va hacia arriba y la nueva sube. */
@keyframes pf-tr-sale { to { opacity: 0; transform: translateY(-24px); } }
@keyframes pf-tr-entra { from { opacity: 0; transform: translateY(40px); } }
::view-transition-old(root) { animation: pf-tr-sale calc(var(--pf-tr-dur) * .7) var(--pf-tr-curva) both; }
::view-transition-new(root) { animation: pf-tr-entra var(--pf-tr-dur) var(--pf-tr-curva) calc(var(--pf-tr-dur) * .25) both; }
/* Sin View Transitions entre páginas: el mismo gesto con clases. */
:root.pf-tr-fuera body { animation: pf-tr-sale calc(var(--pf-tr-dur) * .7) var(--pf-tr-curva) both; }
:root.pf-tr-llega body { animation: pf-tr-entra var(--pf-tr-dur) var(--pf-tr-curva) both; }

@media (prefers-reduced-motion: reduce) { .pf-tr-velo { display: none; } ::view-transition-old(root), ::view-transition-new(root), :root.pf-tr-fuera body, :root.pf-tr-llega body { animation: none; } }

/* Persiana con logo animado. Arranca antes de que el logo entre en pantalla, así el brote ya está creciendo cuando se ve,
   y dura --pf-la-dur; la página cambia cuando termina (más la pausa --pf-la-pausa).
   Solo transform, clip-path y opacity: lo dibuja la placa de video, sin recalcular la página. */
.pf-tr-velo svg.pf-la, .pf-tr-velo.pf-entra svg.pf-la { opacity: 1; transform: none; transition: none; width: min(28vw, var(--pf-la-ancho, 180px)); }

@keyframes pf-la-hoja { from { transform: scale(var(--desde)); } }

@keyframes pf-la-sube { from { transform: translateY(calc(var(--pf-la-sube, 14) * 2.28px)); } }

.pf-tr-velo.pf-entra .pf-la__tallo { animation: pf-la-crece calc(var(--t) * .31) cubic-bezier(.72, 0, .4, 1) var(--t0) backwards; }
.pf-tr-velo.pf-entra .pf-la__p { animation: pf-la-crece calc(var(--t) * .38) var(--pf-la-curva-p, cubic-bezier(.83, 0, .18, 1)) calc(var(--t0) + var(--t) * .07) backwards; }
.pf-tr-velo.pf-entra .pf-la__h2 { --desde: .76; animation: pf-la-hoja calc(var(--t) * .63) cubic-bezier(.03, 0, .02, 1) calc(var(--t0) + var(--t) * .24) backwards, pf-la-destapa calc(var(--t) * .64) cubic-bezier(.09, 0, .04, 1) calc(var(--t0) + var(--t) * .24) backwards; }
.pf-tr-velo.pf-entra .pf-la__h1 { --desde: .57; animation: pf-la-hoja calc(var(--t) * .64) cubic-bezier(.03, 0, .02, 1) calc(var(--t0) + var(--t) * .27) backwards, pf-la-destapa calc(var(--t) * .63) cubic-bezier(.09, 0, .04, 1) calc(var(--t0) + var(--t) * .29) backwards; }

.pf-tr-velo.pf-entra .pf-la__letras path { --d: calc(var(--t0) + var(--t) * .2 + var(--i) * var(--pf-la-desfase, 45ms)); animation: pf-la-sube calc(var(--t) * .36) cubic-bezier(.17, 0, .03, 1) var(--d) backwards, pf-la-aparece 1ms var(--d) backwards; }

  // El bucle corre solo mientras algo se mueve: se duerme cuando los resortes llegaron y lo despiertan el scroll, el tamaño de la
  // ventana, los filtros (el dock cambia de ancho) y el dedo. En reposo la página no mide ni pinta nada.
  var tAntes = 0, corriendo = false, hasta = 0;
  function enReposo() { for (var k in M) if (Math.abs(M[k].x - M[k].t) > 0.001 || Math.abs(M[k].v) > 0.001) return false; return true; }
  function anim(now) {
    var dt = tAntes ? Math.min(0.05, (now - tAntes) / 1000) : 0.016; tAntes = now;
    medir();
    if (quieto.matches) { for (var k in M) { M[k].x = M[k].t; M[k].v = 0; } }
    else { var n = Math.ceil(dt / 0.004); for (var j = 0; j < n; j++) for (var k2 in M) paso(M[k2], dt / n); }
    ancla.style.transform = "scale(" + (Math.max(0, M.s.x) * M.q.x).toFixed(4) + ")";
    flecha.style.transform = "rotate(" + M.r.x.toFixed(2) + "deg)";
    if (now < hasta || !enReposo()) requestAnimationFrame(anim);
    else { corriendo = false; tAntes = 0; }
  }
  despertar = function (ms) {
    hasta = Math.max(hasta, performance.now() + (ms || 0));
    if (!corriendo) { corriendo = true; requestAnimationFrame(anim); }
  };
  despertar(900);
  window.addEventListener("scroll", function () { despertar(200); }, { passive: true });
  window.addEventListener("resize", function () { despertar(700); });
  $("pf-filters").addEventListener("click", function () { despertar(900); });
  $("pf-filters").addEventListener("transitionend", function () { despertar(120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { despertar(300); });
  ancla.addEventListener("pointerdown", function () { M.q.t = APRETAR; despertar(); });
  function soltarAncla() { M.q.t = 1; despertar(); }
  ancla.addEventListener("pointerup", soltarAncla);
  ancla.addEventListener("pointercancel", soltarAncla);
  ancla.addEventListener("pointerleave", soltarAncla);
  ancla.addEventListener("click", function () {
    if ($("pf-filters").classList.contains("pf-abierto")) abrirFiltros(false);
    var suave = quieto.matches ? "auto" : "smooth";
    if (arriba()) window.scrollTo({ top: inicioLista(), behavior: suave });
    else window.scrollBy({ top: Math.round(window.innerHeight * BAJAR_P), behavior: suave });
  });

  // La dirección trae la selección: #buscar abre el buscador; #cultivo=avena, #zona=pergamino,balcarce, #anio=2011, #nutriente=n,
  // #q=texto y #orden=anio se pueden combinar con &. Una opción que no existe se ignora.
  var pedido = location.hash.slice(1), conBusca = pedido === "buscar";
  pedido.split("&").forEach(function (par) {
    var i = par.indexOf("="); if (i < 1) return;
    var k = par.slice(0, i), v = par.slice(i + 1);
    try { v = decodeURIComponent(v); } catch (e) {}
    if (POR_G[k]) v.split(",").forEach(function (o) { if (o === SIN ? TOTAL[k][SIN] : NOMBRE[k][o] && TOTAL[k][o]) estado.sel[k][o] = true; });
    else if (k === "q" && v) { $("pf-q").value = estado.q = v; conBusca = true; }
    else if (k === "orden" && v === "anio") estado.orden = "anio";
  });
  if (estado.orden === "anio") { $("pf-sortAz").setAttribute("aria-pressed", "false"); $("pf-sortAnio").setAttribute("aria-pressed", "true"); moverInds(); }
  aplicar();
  urlLista = true;
  if (conBusca) abrirBusca(true);
})();
</script>
<script>
/* Transición entre Novedades, la Biblioteca y sus páginas. En la Biblioteca va fija, sin panel para elegirla:
   usa la que dejó la cabeza (la misma que Novedades, así entrar y salir coinciden). */
(function () {
  var d = document.documentElement, T = window.PF_TR, c = T.c;
  var quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var velo = document.getElementById("pf-tr-velo");
  function esPersiana() { return c.v === "persiana" || c.v === "animada"; }
  // Cuánto se queda tapando antes de cambiar: con el logo animado, hasta que termina de armarse.
  function sostiene() { return c.v === "animada" ? c.dur * .2 + c.la : c.dur * 1.45; }
  var ocupado = false;
  function espera(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  /* Llegada: la persiana sigue de largo; el fundido sin View Transitions termina de subir. */
  function llegar() {
    if (d.classList.contains("pf-tr-tapa")) {
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        velo.className = "pf-tr-velo pf-sale"; d.classList.remove("pf-tr-tapa");
        setTimeout(function () { velo.className = "pf-tr-velo"; }, c.dur + 40);
      }); });
    }
    if (d.classList.contains("pf-tr-llega")) setTimeout(function () { d.classList.remove("pf-tr-llega"); }, c.dur + 40);
  }
  llegar();

  /* Salida: se tapa (o se funde) y recién ahí se cambia de página. */
  async function tapar() {
    if (esPersiana()) { velo.className = "pf-tr-velo pf-entra"; await espera(sostiene()); }
    else { d.classList.add("pf-tr-fuera"); await espera(c.dur * .7); }
  }
  document.addEventListener("click", function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest("a[href]");
    if (!a || (a.target && a.target !== "_self") || a.hasAttribute("download")) return;
    var u = new URL(a.href, location.href);
    if (u.origin !== location.origin || !/\/(novedades|biblioteca|hojas-de-seguridad)\//.test(u.pathname)) return;
    if (u.pathname === location.pathname && u.search === location.search) return;
    if (c.v === "ninguna" || quieto || ocupado) return;
    if (c.v === "fundido" && T.vt) return;
    e.preventDefault(); ocupado = true;
    tapar().then(function () {
      try { sessionStorage.setItem("pf-tr-llega", c.v); } catch (err) {}
      location.href = u.href;
    });
  });
  // Al volver con el botón del navegador la página puede venir congelada tal cual quedó.
  addEventListener("pageshow", function (e) {
    if (!e.persisted) return;
    ocupado = false; velo.className = "pf-tr-velo"; d.classList.remove("pf-tr-fuera", "pf-tr-llega", "pf-tr-tapa");
  });

})();
</script>
<script>
/* Cabecera con campo (Nota y Biblioteca): el campo generativo detrás de la cabecera.
   Grilla de Formas que crecen en grupos (una Forma por grupo), se quedan quietas
   un rato y se deshacen mientras nacen otras. En la Nota el color sale del tipo de nota
   (el de su etiqueta) y la Forma, de su categoría; otras páginas los pasan en window.PF_CAMPO. */
(function () {
  "use strict";
  // Configuración: la página puede pasar window.PF_CAMPO (la Biblioteca); la Nota la arma desde su nota (PF_NOTA).
  //   formas: las Formas del sistema · color: azul|verde|amarillo|naranja · forma: la del badge · tema: Formas para el modo "varias"
  //   cab: id de la tarjeta · main: id del contenido que sube encima · columna: id de la columna a la que se alinea la tarjeta (escritorio)
  var Q = new URLSearchParams(location.search);
  var P = window.PF_CAMPO || (function () {
    var N = window.PF_NOTA; if (!N) return null;
    var n = N.n, tema = [];
    // Automático: el color de la etiqueta del tipo de nota (la familia del componente Etiqueta).
    var FAMILIA = { institucional: "azul", financiera: "azul", somos: "verde", tecnico: "verde", aviso: "amarillo", comercial: "naranja" };
    // Modo "una": todo el campo con la forma de la categoría (la del badge de la etiqueta).
    var FORMA_TIPO = { institucional: "escudo", comercial: "barras", somos: "circulos", tecnico: "lupa", aviso: "casco", financiera: "grafico" };
    try { tema = N.formasDe(n) || []; } catch (e) {}
    return { formas: N.formas, color: FAMILIA[n.tp], forma: FORMA_TIPO[n.tp], tema: tema, cab: "pf-cab", main: "pf-nota", columna: "pf-texto" };
  })();
  if (!P) return;

  // --- Paleta: fondo, figura y acento, siempre una combinación del sistema. El fondo es azul, verde, amarillo o terra.
  // Azul, Celeste y Verde · Verde, Verde Claro y Amarillo · Amarillo, Naranja y Verde · Naranja con Terra (secundaria: sin acento).
  var PALETAS = {
    azul:     { fondo: "#003DA5", figura: "#4086FF", acento: "#2D8035" },
    verde:    { fondo: "#2D8035", figura: "#5EB53A", acento: "#EABA2C" },
    amarillo: { fondo: "#EABA2C", figura: "#E57F19", acento: "#2D8035" },
    naranja:  { fondo: "#8A4818", figura: "#E57F19", acento: null }
  };
  var pedida = Q.get("p");
  // ?p=azul|verde|amarillo|naranja fuerza otro color (solo para probar).
  var paleta = PALETAS[PALETAS[pedida] ? pedida : (PALETAS[P.color] ? P.color : "azul")];
  // ?campo=fondo-figura-acento (hex sin #, el acento puede faltar) prueba otra combinación (lo usa el tweak de la barra).
  var probada = (Q.get("campo") || "").split("-").filter(function (h) { return /^[0-9a-f]{6}$/i.test(h); });
  if (probada.length >= 2) paleta = { fondo: "#" + probada[0], figura: "#" + probada[1], acento: probada[2] ? "#" + probada[2] : null };

  // --- Formas: las del tema pesan más; el resto aparece de vez en cuando.
  var TODAS = Object.keys(P.formas);
  var TEMA = (P.tema || []).filter(function (f) { return P.formas[f]; });
  if (!TEMA.length) TEMA = TODAS;
  var DEL_TIPO = P.formas[P.forma] ? P.forma : TEMA[0];
  // Por defecto "una"; ?formas=varias vuelve a la mezcla.
  var modoFormas = Q.get("formas") === "varias" ? "varias" : "una";
  function unaForma() { if (modoFormas === "una") return DEL_TIPO; return Math.random() < 0.7 ? TEMA[Math.floor(Math.random() * TEMA.length)] : TODAS[Math.floor(Math.random() * TODAS.length)]; }

  var cache = {}, prop = {};
  TODAS.forEach(function (k) { var v = P.formas[k].vb.split(/\s+/); prop[k] = +v[2] / +v[3]; });
  function tenida(k, color) {
    var c = k + color;
    if (cache[c]) return cache[c];
    var im = new Image();
    im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + P.formas[k].vb + '" fill="' + color + '">' + P.formas[k].d + "</svg>");
    return (cache[c] = im);
  }
  TODAS.forEach(function (k) { tenida(k, paleta.figura); if (paleta.acento) tenida(k, paleta.acento); });

  // --- Armado: la cabecera sale de la grilla y pasa a una tarjeta sobre el campo.
  var cv = document.createElement("canvas");
  cv.id = "pf-campo"; cv.setAttribute("aria-hidden", "true");
  document.body.insertBefore(cv, document.body.firstChild);
  var main = document.getElementById(P.main), cab = document.getElementById(P.cab);
  var papel = getComputedStyle(document.body).backgroundColor;
  document.documentElement.style.setProperty("--pf-papel", papel === "rgba(0, 0, 0, 0)" ? "#fff" : papel);
  var sec = document.createElement("section");
  sec.className = "pf-campo-cab";
  sec.appendChild(cab);
  sec.insertAdjacentHTML("beforeend", '<span class="pf-campo-seguir" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span>');
  main.parentNode.insertBefore(sec, main);
  // Alto de la cabecera: 70% de la pantalla. Para probar otro, ?alto=60 (de 40 a 100).
  var alto = +Q.get("alto") || 70;
  document.documentElement.style.setProperty("--pf-campo-alto", Math.max(40, Math.min(100, Math.round(alto))) + "svh");

  // Escritorio: la tarjeta toma el ancho y la posición de la columna central (la del texto).
  function alinear() {
    var t = P.columna && document.getElementById(P.columna);
    if (!t || window.innerWidth < 720) { cab.style.width = ""; cab.style.marginLeft = ""; return; }
    var r = t.getBoundingClientRect(), s = sec.getBoundingClientRect();
    if (!r.width) return;
    cab.style.width = r.width + "px";
    cab.style.marginLeft = (r.left - s.left - parseFloat(getComputedStyle(sec).paddingLeft)) + "px";
  }

  function barra() { var b = document.getElementById("pf-top"); if (b) document.documentElement.style.setProperty("--pf-barra-h", b.offsetHeight + "px"); }
  barra();

  // --- Campo
  var ctx = cv.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var reducir = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W, H, CELDA, cols, filas, grilla, grupos = [], sembrado = false;
  var VEC = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  function azar(a, b) { return a + Math.random() * (b - a); }
  function idx(x, y) { return y * cols + x; }

  function medir() {
    W = window.innerWidth; H = Math.max(window.innerHeight, document.documentElement.clientHeight);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + "px";
    CELDA = W < 720 ? 26 : 34;
    cols = Math.ceil(W / CELDA) + 1; filas = Math.ceil(H / CELDA) + 1;
    grilla = new Array(cols * filas).fill(null);
    grupos = []; sembrado = false;
  }
  // Donde conviene que nazcan: entre la tarjeta y el final de la cabecera (se mide cada vez: la tarjeta cambia de alto al llegar el texto).
  function zona() {
    var t = cab.getBoundingClientRect(), c = sec.getBoundingClientRect();
    var z = { y0: Math.floor((t.bottom + 8) / CELDA), y1: Math.min(filas - 1, Math.floor(c.bottom / CELDA)) };
    return z.y1 - z.y0 < 3 ? { y0: 0, y1: filas - 1 } : z;
  }
  function nuevoGrupo(ahora) {
    var z = zona();
    for (var i = 0; i < 30; i++) {
      var x = Math.floor(azar(0, cols - 1));
      var y = Math.random() < 0.25 ? Math.floor(azar(0, filas - 1)) : Math.floor(azar(z.y0, z.y1));
      if (grilla[idx(x, y)]) continue;
      grupos.push({ forma: unaForma(), celdas: [], borde: [[x, y]], meta: Math.floor(azar(8, 26)),
        estado: "crece", proximo: ahora, ritmo: azar(70, 140), espera: azar(2500, 5000) });
      return grupos[grupos.length - 1];
    }
  }
  function paso(g, ahora) {
    if (ahora < g.proximo) return;
    g.proximo = ahora + g.ritmo;
    if (g.estado === "crece") {
      while (g.borde.length) {
        var p = g.borde.splice(Math.floor(Math.random() * g.borde.length), 1)[0];
        if (p[0] < 0 || p[1] < 0 || p[0] >= cols || p[1] >= filas || grilla[idx(p[0], p[1])]) continue;
        var c = { x: p[0], y: p[1], nace: ahora, muere: 0, forma: g.forma, color: paleta.acento && Math.random() < 0.08 ? paleta.acento : paleta.figura, v: Math.random() };
        grilla[idx(p[0], p[1])] = c; g.celdas.push(c);
        VEC.forEach(function (v) { g.borde.push([p[0] + v[0], p[1] + v[1]]); });
        break;
      }
      if (g.celdas.length >= g.meta || !g.borde.length) { g.estado = "quieto"; g.proximo = ahora + g.espera; }
    } else if (g.estado === "quieto") {
      g.estado = "decrece";
    } else if (g.estado === "decrece") {
      var m = g.celdas.shift();
      if (m) { m.muere = ahora; setTimeout(function () { if (grilla[idx(m.x, m.y)] === m) grilla[idx(m.x, m.y)] = null; }, 320); }
      if (!g.celdas.length) g.estado = "fin";
    }
  }
  var MAX = 7;
  function sembrar() {
    var t = performance.now();
    for (var i = 0; i < MAX; i++) {
      var g = nuevoGrupo(t); if (!g) continue;
      var k = Math.floor(g.meta * azar(0.4, 1));
      for (var j = 0; j < k; j++) { g.proximo = 0; g.estado = "crece"; paso(g, t - 1000); }
      g.estado = g.celdas.length >= g.meta ? "quieto" : "crece";
      g.celdas.forEach(function (c) { c.nace = t - 1000; });
      g.proximo = t + (g.estado === "quieto" ? g.espera * azar(0.3, 1) : azar(0, 2000));
    }
    sembrado = true;
  }
  function suave(t) { return 1 - Math.pow(1 - t, 3); }

  // Cursor: solo reaccionan las Formas en color de acento; el resto no se mueve. Cada una tiene un valor fijo
  // al azar (v) y el cursor sube la chance de que pase al color de figura: casi todas debajo del mouse, menos
  // a medida que se alejan, sin borde. Cada Forma cambia o no, sin fundido, y el cursor se lee a saltos (cada 60 ms).
  // PICO: cuántas cambian debajo del mouse. ALCANCE: hasta dónde llega, en fracción del lado corto de la pantalla.
  var raton = null, muestra = null, ultima = 0;
  var PICO = 0.95, CURVA = 2, ALCANCE = 0.6, PASO_CURSOR = 60;
  addEventListener("pointermove", function (e) {
    if (e.pointerType !== "mouse") return;
    raton = { x: e.clientX, y: e.clientY };
    if (reducir && W) { muestra = raton; dibujar(performance.now()); }
  }, { passive: true });
  document.documentElement.addEventListener("pointerleave", function () { raton = null; if (reducir && W) { muestra = null; dibujar(performance.now()); } });
  function cambia(c, D) {
    if (!muestra || !paleta.acento || c.color !== paleta.acento) return false;
    var d = Math.hypot(c.x * CELDA + CELDA / 2 - muestra.x, c.y * CELDA + CELDA / 2 - muestra.y);
    return c.v < PICO * Math.pow(Math.max(0, 1 - d / D), CURVA);
  }
  function otro(color) { return color === paleta.acento ? paleta.figura : paleta.acento; }
  function dibujar(ahora) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = paleta.fondo; ctx.fillRect(0, 0, W, H);
    if (!reducir && ahora - ultima >= PASO_CURSOR) { muestra = raton; ultima = ahora; }
    var lado = CELDA * 0.72, D = Math.min(W, H) * ALCANCE;
    for (var k = 0; k < grilla.length; k++) {
      var c = grilla[k]; if (!c) continue;
      var s = c.muere ? 1 - suave(Math.min(1, (ahora - c.muere) / 300)) : suave(Math.min(1, (ahora - c.nace) / 260));
      var im = tenida(c.forma, c.color);
      if (s <= 0 || !im.complete) continue;
      var r = prop[c.forma], w = r >= 1 ? lado : lado * r, h = r >= 1 ? lado / r : lado;
      var x = c.x * CELDA + (CELDA - w * s) / 2, y = c.y * CELDA + (CELDA - h * s) / 2;
      if (cambia(c, D)) { var im2 = tenida(c.forma, otro(c.color)); if (im2.complete) im = im2; }
      ctx.drawImage(im, x, y, w * s, h * s);
    }
  }
  var activo = true;
  function cuadro(ahora) {
    if (!sembrado) sembrar();
    if (activo) {
      while (grupos.length < MAX && nuevoGrupo(ahora + azar(0, 1500))) {}
      grupos.forEach(function (g) { paso(g, ahora); });
      grupos = grupos.filter(function (g) { return g.estado !== "fin"; });
      dibujar(ahora);
    }
    if (!reducir) requestAnimationFrame(cuadro);
  }

  // Clic (o toque) en el campo: nace un grupo ahí mismo, que crece un poco más rápido. Hasta 5 por encima
  // de los 7 de siempre; si se pasa, el grupo quieto más viejo empieza a deshacerse. No cuenta sobre la tarjeta.
  var EXTRA = 5;
  sec.addEventListener("click", function (e) {
    if (reducir || !W || e.target.closest("#" + P.cab + ", a, button")) return;
    var cx = Math.floor(e.clientX / CELDA), cy = Math.floor(e.clientY / CELDA), borde = [];
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      var x = cx + dx, y = cy + dy;
      if (x >= 0 && y >= 0 && x < cols && y < filas && !grilla[idx(x, y)]) borde.push([x, y]);
    }
    if (!borde.length) return;
    if (grupos.length >= MAX + EXTRA) {
      var viejo = grupos.filter(function (g) { return g.estado === "quieto"; })[0];
      if (viejo) { viejo.estado = "decrece"; viejo.proximo = 0; }
    }
    var ahora = performance.now();
    grupos.push({ forma: unaForma(), celdas: [], borde: borde, meta: Math.floor(azar(10, 20)),
      estado: "crece", proximo: ahora, ritmo: azar(40, 70), espera: azar(2500, 5000) });
  });

  // Ahorro: cuando el texto tapa la cabecera, el campo deja de animar.
  addEventListener("scroll", function () { document.body.classList.toggle("pf-campo-bajo", scrollY > 40); }, { passive: true });
  // Fuera de pantalla también se esconde, para que no asome debajo del pie.
  new IntersectionObserver(function (e) { activo = e[0].isIntersecting; cv.style.visibility = activo ? "" : "hidden"; }).observe(sec);
  var ancho = window.innerWidth;
  addEventListener("resize", function () {
    barra(); alinear();
    if (window.innerWidth === ancho) return; // en celular la barra del navegador cambia el alto: no reiniciar
    ancho = window.innerWidth; medir();
  });

  alinear();
  if (document.fonts) document.fonts.ready.then(alinear);
  addEventListener("load", alinear);
  medir();
  if (reducir) setTimeout(function () { sembrar(); dibujar(performance.now()); }, 300);
  else requestAnimationFrame(cuadro);
})();
</script>
