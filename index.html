<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bong Lab</title>
<meta name="description" content="Experimentos, prototipos y herramientas de Bong Studio.">
<script>
  // Para sumar un experimento, agregá un objeto acá.
  // url: carpeta relativa a la raíz del repo, con barra final.
  // grupo: la "carpeta" de la portada donde se muestra. Es solo visual: las
  // direcciones de los experimentos no cambian. Si es un grupo nuevo, sumalo
  // también a ORDEN_GRUPOS (define el orden en que aparecen).
  const ORDEN_GRUPOS = ["Componentes y animación", "Novedades", "Sistema de formas", "Pruebas de máscaras", "Herramientas"];
  const EXPERIMENTOS = [
    {
      titulo: "Laboratorio generativo del Sistema de Formas",
      cliente: "Profertil",
      descripcion: "Las 17 formas del sistema en partículas, flujo, grilla y mosaico.",
      grupo: "Sistema de formas",
      url: "profertil/formas/",
    },
    {
      titulo: "Laboratorio de refracción",
      cliente: "Profertil",
      descripcion: "Cristal tipo liquid glass sobre el Sistema de Formas.",
      grupo: "Sistema de formas",
      url: "profertil/refraccion/",
    },
    {
      titulo: "Máscaras WebGL",
      cliente: "Profertil",
      descripcion: "Las formas del sistema como máscaras animadas de fotos al scrollear.",
      grupo: "Pruebas de máscaras",
      url: "profertil/mascaras/",
    },
    {
      titulo: "Máscaras p5.js",
      cliente: "Profertil",
      descripcion: "La misma prueba de máscaras, dibujada con p5.js para comparar rendimiento.",
      grupo: "Pruebas de máscaras",
      url: "profertil/mascaras-p5/",
    },
    {
      titulo: "Máscaras Three.js",
      cliente: "Profertil",
      descripcion: "La misma prueba de máscaras sobre Three.js, con los mismos shaders, para comparar peso y rendimiento.",
      grupo: "Pruebas de máscaras",
      url: "profertil/mascaras-three/",
    },
    {
      titulo: "Novedades",
      cliente: "Profertil",
      descripcion: "Archivo de las 471 notas del sitio actual sobre el concepto web del manual: carrusel de destacadas, buscador, categoría y año.",
      grupo: "Novedades",
      url: "profertil/novedades/",
    },
    {
      titulo: "Novedades · tweak del panel de filtros",
      cliente: "Profertil",
      descripcion: "Ajuste en vivo de la animación de los filtros de Novedades: curva, duraciones y fundido, sobre la página real.",
      grupo: "Novedades",
      url: "profertil/novedades-tweak/",
    },
    {
      titulo: "Hero morph",
      cliente: "Profertil",
      descripcion: "La foto arranca a pantalla completa y con el scroll se transforma en forma, panel o grilla. Exporta sus valores en JSON.",
      grupo: "Componentes y animación",
      url: "profertil/hero-morph/",
    },
    {
      titulo: "Animadores de texto",
      cliente: "Profertil",
      descripcion: "Catálogo de 14 animaciones de texto con nombre, uso y valores fijos, para unificarlas en todas las páginas. Con laboratorio para combinar.",
      grupo: "Componentes y animación",
      url: "profertil/animadores-texto/",
    },
    {
      titulo: "Arquitectura del sitio",
      cliente: "Profertil",
      descripcion: "El mapa de profertil.com.ar para armarlo en vivo entre todos: árbol editable, conteo de páginas, plantillas, registros y arte, e historial de versiones.",
      grupo: "Herramientas",
      url: "https://entregables.bongstudio.ar/profertil/arquitectura/",
    },
    {
      titulo: "Carrusel de fotos",
      cliente: "Profertil",
      descripcion: "Galería a ancho completo con loop, parallax en cada foto y una pastilla que sigue al cursor. Componente para la web.",
      grupo: "Componentes y animación",
      url: "profertil/carrusel-fotos/",
    },
  ];
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #003DA5;
    --texto: #FFFEEF;
    --linea: rgba(255, 254, 239, 0.28);
    --tenue: rgba(255, 254, 239, 0.72);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: "Archivo", system-ui, sans-serif;
    min-height: 100vh;
    padding: 32px 16px 48px;
    -webkit-font-smoothing: antialiased;
  }
  header, main, footer { max-width: 1120px; margin: 0 auto; }
  header { margin-bottom: 40px; }
  .eyebrow {
    font-size: 12px; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--tenue);
  }
  h1 {
    font-size: clamp(40px, 12vw, 96px);
    font-weight: 700; line-height: 0.95; letter-spacing: -0.03em;
    margin-top: 12px;
  }
  .grilla {
    list-style: none; padding: 0;
    display: grid; gap: 16px;
    grid-template-columns: 1fr;
  }
  .tarjeta {
    display: flex; flex-direction: column; gap: 12px;
    height: 100%; min-height: 200px;
    padding: 20px;
    border: 1px solid var(--linea);
    border-radius: 4px;
    color: inherit; text-decoration: none;
    transition: background-color .2s, border-color .2s;
  }
  .tarjeta:hover, .tarjeta:focus-visible {
    background: rgba(255, 254, 239, 0.08);
    border-color: var(--texto);
    outline: none;
  }
  .tarjeta h2 {
    font-size: 24px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em;
  }
  .tarjeta p { font-size: 16px; line-height: 1.4; color: var(--tenue); }
  .tarjeta .pie {
    margin-top: auto; padding-top: 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .tarjeta .flecha { font-size: 20px; transition: transform .2s; }
  .tarjeta:hover .flecha { transform: translateX(4px); }
  .grupo { margin-bottom: 40px; }
  .grupo > summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: baseline; gap: 14px;
    padding: 0 0 14px; margin-bottom: 20px;
    border-bottom: 1px solid var(--linea);
  }
  .grupo > summary::-webkit-details-marker { display: none; }
  .grupo > summary:focus-visible { outline: 2px solid var(--texto); outline-offset: 6px; }
  .grupo h2.nombre {
    font-size: clamp(22px, 4vw, 32px); font-weight: 700; letter-spacing: -0.02em; line-height: 1;
  }
  .grupo .cuenta { font-size: 12px; font-weight: 500; letter-spacing: 0.12em; color: var(--tenue); }
  .grupo .chevron { margin-left: auto; font-size: 18px; color: var(--tenue); transition: transform .25s; }
  .grupo[open] > summary .chevron { transform: rotate(180deg); }
  footer { margin-top: 56px; font-size: 13px; color: var(--tenue); }
  footer a { color: inherit; }

  @media (min-width: 640px) {
    body { padding: 56px 32px 64px; }
    .grilla { grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .tarjeta { padding: 28px; min-height: 240px; }
  }
  @media (min-width: 1024px) {
    .grilla { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
  <header>
    <p class="eyebrow">Bong Studio · Experimentos, prototipos y herramientas</p>
    <h1>Bong Lab</h1>
  </header>
  <main id="principal"></main>
  <footer>
    <a href="https://bongstudio.ar">bongstudio.ar</a>
  </footer>
<script>
  const principal = document.getElementById("principal");
  const porGrupo = new Map(ORDEN_GRUPOS.map(g => [g, []]));
  for (const e of EXPERIMENTOS) {
    const g = e.grupo || "Otros";
    if (!porGrupo.has(g)) porGrupo.set(g, []);
    porGrupo.get(g).push(e);
  }
  for (const [nombre, lista] of porGrupo) {
    if (!lista.length) continue;
    const det = document.createElement("details");
    det.className = "grupo";
    det.open = true;
    const sum = document.createElement("summary");
    const h2 = document.createElement("h2");
    h2.className = "nombre";
    h2.textContent = nombre;
    const cuenta = document.createElement("span");
    cuenta.className = "cuenta";
    cuenta.textContent = String(lista.length).padStart(2, "0");
    const chevron = document.createElement("span");
    chevron.className = "chevron";
    chevron.setAttribute("aria-hidden", "true");
    chevron.textContent = "↓";
    sum.append(h2, cuenta, chevron);
    const ul = document.createElement("ul");
    ul.className = "grilla";
    for (const e of lista) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "tarjeta";
      a.href = e.url;
      const t = document.createElement("h2");
      t.textContent = e.titulo;
      const p = document.createElement("p");
      p.textContent = e.descripcion;
      const pie = document.createElement("div");
      pie.className = "pie";
      const cliente = document.createElement("span");
      cliente.className = "eyebrow";
      cliente.textContent = e.cliente;
      const flecha = document.createElement("span");
      flecha.className = "flecha";
      flecha.setAttribute("aria-hidden", "true");
      flecha.textContent = "→";
      pie.append(cliente, flecha);
      a.append(t, p, pie);
      li.append(a);
      ul.append(li);
    }
    det.append(sum, ul);
    principal.append(det);
  }
</script>
</body>
</html>
