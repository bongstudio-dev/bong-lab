<style>
/* Piel: sistema web de Profertil (Figma Master, colecciones 01 y 06), el mismo de Novedades y Arquitectura. */
:root{
  color-scheme:light;
  --azul:#003DA5; --celeste:#4086FF; --amarillo:#EABA2C;
  --tiza:#FFFEEF; --bg:#E9E7D6; --card:#FFFEEF;
  --ink:#0A1E4A; --ink-2:#44506E; --ink-3:#737D96;
  --barra:rgba(0,61,165,.94); --line:rgba(10,30,74,.1);
  --shadow:0 1px 2px rgba(10,30,74,.06),0 12px 28px -16px rgba(10,30,74,.28);
  --shadow-up:0 2px 4px rgba(10,30,74,.06),0 22px 40px -20px rgba(10,30,74,.36);
  --ease:cubic-bezier(.22,1,.36,1);
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"DM Sans","Helvetica Neue",Arial,sans-serif;
  --r-card:26px;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--f-display);margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--celeste);outline-offset:2px}
.wrap{width:min(100% - 32px,1320px);margin-inline:auto}

/* barra fija: transparente sobre el header, azul al bajar */
.top{position:fixed;inset:0 0 auto;z-index:50;transition:background 260ms ease,box-shadow 260ms ease}
.top.solid{background:var(--barra);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px -18px rgba(0,20,60,.7)}
.nav{position:relative;width:min(100% - 32px,1320px);margin-inline:auto;display:flex;align-items:center;gap:14px;min-height:76px;padding:8px 58px 8px 0}
.logo{display:block;flex:none;color:var(--tiza);line-height:0}
.logo svg{width:74px;height:auto;aspect-ratio:1458/1021}
/* Buscador: la lupa se expande hacia la izquierda; abierta, en su lugar queda la X (igual que Novedades y Arquitectura) */
.busca{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;width:48px;height:48px;border-radius:999px;background:rgba(255,254,239,.16);border:1px solid rgba(255,254,239,.24);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;transition:width 420ms var(--ease),right 420ms var(--ease),background 220ms ease,border-color 220ms ease}
.busca.open{right:56px;width:min(480px,calc(100% - 152px));background:var(--tiza);border-color:#fff;box-shadow:var(--shadow)}
.busca-x{position:absolute;right:0;top:50%;transform:translateY(-50%) scale(.6);width:48px;height:48px;padding:0;border-radius:999px;background:rgba(255,254,239,.16);border:1px solid rgba(255,254,239,.24);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--tiza);display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity 200ms ease,transform 420ms var(--ease),background 200ms ease,color 200ms ease,visibility 0s linear 420ms}
.busca-x svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
@media(hover:hover) and (pointer:fine){.busca-x:hover{background:var(--tiza);color:var(--azul)}}
.busca-x:active{background:var(--tiza);color:var(--azul)}
.nav.buscando .busca-x{opacity:1;visibility:visible;transform:translateY(-50%);transition:opacity 220ms ease 120ms,transform 420ms var(--ease),background 200ms ease,color 200ms ease}
.lupa{width:46px;height:46px;flex:none;border:0;border-radius:999px;background:transparent;color:var(--tiza);display:grid;place-items:center;padding:0}
.busca.open .lupa{color:var(--azul)}
.lupa svg{width:20px;height:20px}
.busca input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-family:var(--f-display);font-size:1.04rem;color:var(--ink);padding:0 4px;opacity:0;transition:opacity 200ms ease}
.busca.open input{opacity:1}
.busca input::placeholder{color:var(--ink-3)}
.busca input::-webkit-search-cancel-button{display:none}

/* header azul con forma oficial */
.hero{position:relative;overflow:hidden;background:var(--azul);color:var(--tiza);padding:150px 0 96px}
.hero .in{width:min(100% - 32px,1320px);margin-inline:auto;position:relative;z-index:2}
.hero .eyebrow{font:500 .78rem/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:rgba(255,254,239,.72);margin-bottom:16px}
.hero h1{font-weight:600;font-size:clamp(2.6rem,7vw,5.4rem);line-height:.95;letter-spacing:-.045em}
.hero p{margin-top:16px;max-width:46ch;font-size:1.05rem;color:rgba(255,254,239,.86)}
.forma{position:absolute;z-index:1;pointer-events:none}
.f1{width:min(40vw,540px);right:-4%;top:-8%;color:var(--amarillo)}   /* Forma/Trigo: primaria Azul + Amarillo */

/* Grupos en acordeón: número grande antes del título, chevron corto en círculo */
main{padding:40px 0 120px}
/* Expandir y plegar todo: los mismos botones del mapa de Arquitectura */
.controles{display:flex;justify-content:flex-end;margin-bottom:16px}
.grp{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--line);flex:none}
.ib{width:32px;height:30px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);display:grid;place-items:center;padding:0;transition:background 180ms ease,color 180ms ease,box-shadow 180ms ease,opacity 180ms ease}
.ib svg{width:16px;height:16px;fill:currentColor;stroke:none}
.ib svg .r{stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
@media(hover:hover) and (pointer:fine){.ib:hover:not(:disabled){background:var(--card);color:var(--azul);box-shadow:0 1px 3px rgba(10,30,74,.12)}}
.ib:active:not(:disabled){background:var(--card);color:var(--azul)}
.ib:disabled{opacity:.35;cursor:default}
.grupo{border-bottom:1px solid var(--line)}
.grupo:first-child{border-top:1px solid var(--line)}
.cab{width:100%;display:flex;align-items:center;gap:clamp(16px,3vw,32px);border:0;background:none;padding:26px 12px;margin:0 -12px;width:calc(100% + 24px);border-radius:20px;text-align:left;color:var(--ink);transition:background 320ms var(--ease)}
.cab .num{flex:none;min-width:2.1ch;font:500 clamp(2.4rem,5vw,3.6rem)/1 var(--f-display);letter-spacing:-.04em;color:var(--ink-3);transition:color 320ms var(--ease)}
.cab .nombre{flex:1;font:600 clamp(1.5rem,3vw,2.2rem)/1.05 var(--f-display);letter-spacing:-.03em;transition:transform 420ms var(--ease),color 320ms var(--ease)}
.cab .chev{flex:none;width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--card);color:var(--azul);box-shadow:var(--shadow);transition:background 320ms var(--ease),color 320ms var(--ease),transform 520ms var(--ease)}
.cab .chev svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.grupo.abierto .cab .chev{transform:rotate(180deg)}
@media(hover:hover) and (pointer:fine){
  .cab:hover .num,.cab:hover .nombre{color:var(--azul)}
}
.cab:active .chev{background:var(--azul);color:var(--tiza)}
/* El cuerpo se despliega animando la fila de la grilla de 0fr a 1fr: mide solo, sin alturas fijas */
.cuerpo{display:grid;grid-template-rows:0fr;transition:grid-template-rows 560ms var(--ease)}
.grupo.abierto .cuerpo{grid-template-rows:1fr}
.cuerpo>.in{min-height:0;overflow:hidden;margin:0 -16px;padding:0 16px}
.grilla{list-style:none;margin:0;padding:4px 0 36px;display:grid;gap:16px;grid-template-columns:1fr;opacity:0;transform:translateY(-8px);transition:opacity 260ms ease,transform 560ms var(--ease)}
.grupo.abierto .grilla{opacity:1;transform:none;transition:opacity 420ms ease 80ms,transform 560ms var(--ease)}
.tarjeta{position:relative;display:flex;flex-direction:column;gap:10px;height:100%;min-height:210px;padding:24px 24px 22px;border-radius:var(--r-card);background:var(--card);box-shadow:var(--shadow);color:inherit;text-decoration:none;transition:transform 420ms var(--ease),box-shadow 420ms var(--ease)}
.tarjeta h3{font-weight:600;font-size:1.4rem;line-height:1.1;letter-spacing:-.025em}
.tarjeta p{color:var(--ink-2);font-size:.98rem;line-height:1.45;max-width:44ch}
.tarjeta .ir{margin-top:auto;align-self:flex-end;width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--bg);color:var(--azul);transition:background 320ms var(--ease),color 320ms var(--ease)}
.tarjeta .ir svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform 420ms var(--ease)}
@media(hover:hover) and (pointer:fine){
  .tarjeta:hover{transform:translateY(-4px);box-shadow:var(--shadow-up)}
  .tarjeta:hover .ir{background:var(--azul);color:var(--tiza)}
  .tarjeta:hover .ir svg{transform:translateX(2px)}
  .tarjeta:hover .ir.ext svg{transform:translate(2px,-2px)}
}
.vacio{padding:40px 0;color:var(--ink-2);font-family:var(--f-display);font-size:1.2rem}

@media (min-width:640px){ .grilla{grid-template-columns:repeat(2,1fr);gap:20px} }
@media (min-width:1024px){ .grilla{grid-template-columns:repeat(3,1fr)} }
@media (max-width:560px){ .hero{padding:130px 0 72px} .tarjeta{min-height:0;gap:8px} .tarjeta .ir{margin-top:8px} .cab{padding:20px 12px} .cab .chev{width:40px;height:40px} }
/* Crédito de Bong: el mismo badge del kit de marca de Profertil */
.bong-credit{position:fixed;right:20px;bottom:18px;z-index:50;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.92);border:1px solid rgba(6,32,79,.06);color:#004831;text-decoration:none;font-size:.78rem;font-weight:700;letter-spacing:-.01em;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform 160ms ease,border-color 160ms ease}
.bong-credit svg{width:18px;height:auto;display:block;fill:currentColor}
.bong-credit:hover{transform:translateY(-1px);border-color:rgba(6,32,79,.18)}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{transition-duration:1ms!important} }
</style>
</head>

<script>
/* Bong Studio · Diseño y desarrollo · bongstudio.ar */
const IR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10M13 8l4 4-4 4"/></svg>';
const EXT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16l8-8M10 8h6v6"/></svg>';
const CHEV = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const $ = s => document.querySelector(s);
const plano = t => String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");   // sin acentos ni mayúsculas, para buscar
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const porGrupo = new Map(ORDEN_GRUPOS.map(g => [g, []]));
for (const e of EXPERIMENTOS) {
  const g = e.grupo || "Otros";
  if (!porGrupo.has(g)) porGrupo.set(g, []);
  porGrupo.get(g).push(e);
}

const principal = $("#principal");
const grupos = [];
let n = 0;
for (const [nombre, lista] of porGrupo) {
  if (!lista.length) continue;
  n++;
  const id = "g" + n;
  const sec = document.createElement("section");
  sec.className = "grupo abierto";
  sec.innerHTML =
    `<h2><button class="cab" type="button" aria-expanded="true" aria-controls="${id}">` +
      `<span class="num" aria-hidden="true">${String(n).padStart(2, "0")}</span>` +
      `<span class="nombre">${esc(nombre)}</span>` +
      `<span class="chev" aria-hidden="true">${CHEV}</span>` +
    `</button></h2>` +
    `<div class="cuerpo" id="${id}"><div class="in"><ul class="grilla">` +
      lista.map(e => {
        const externo = /^https?:/.test(e.url);
        return `<li data-q="${esc(plano(e.titulo + " " + e.descripcion + " " + nombre))}">` +
          `<a class="tarjeta" href="${esc(e.url)}"${externo ? ' target="_blank" rel="noopener"' : ""}>` +
          `<h3>${esc(e.titulo)}</h3><p>${esc(e.descripcion)}</p>` +
          `<span class="ir${externo ? " ext" : ""}" aria-hidden="true">${externo ? EXT : IR}</span></a></li>`;
      }).join("") +
    `</ul></div></div>`;
  principal.append(sec);
  grupos.push(sec);
}

/* Acordeón: el cuerpo inerte mientras está cerrado, para que el teclado no entre a tarjetas ocultas */
function abrir(sec, si) {
  sec.classList.toggle("abierto", si);
  sec.querySelector(".cab").setAttribute("aria-expanded", String(si));
  sec.querySelector(".cuerpo").inert = !si;
  estadoControles();
}
/* Expandir/plegar todo; cada botón se apaga cuando ya no tiene nada que hacer */
function estadoControles() {
  const visibles = grupos.filter(g => !g.hidden);
  $("#bAbrir").disabled = visibles.every(g => g.classList.contains("abierto"));
  $("#bCerrar").disabled = visibles.every(g => !g.classList.contains("abierto"));
}
$("#bAbrir").addEventListener("click", () => grupos.forEach(g => abrir(g, true)));
$("#bCerrar").addEventListener("click", () => grupos.forEach(g => abrir(g, false)));
principal.addEventListener("click", e => {
  const cab = e.target.closest(".cab"); if (!cab) return;
  const sec = cab.closest(".grupo");
  abrir(sec, !sec.classList.contains("abierto"));
});

estadoControles();

/* Buscador: filtra por título, descripción y grupo; abre los grupos que tienen resultados */
function filtrar(q) {
  let total = 0;
  for (const sec of grupos) {
    let k = 0;
    sec.querySelectorAll("li").forEach(li => { const si = !q || li.dataset.q.includes(q); li.hidden = !si; if (si) k++; });
    sec.hidden = !k; total += k;
    if (q && k) abrir(sec, true);
  }
  $("#vacio").hidden = total > 0;
  estadoControles();
}
function abrirBusca(si) {
  $("#busca").classList.toggle("open", si); $(".nav").classList.toggle("buscando", si);
  $("#goSearch").setAttribute("aria-expanded", String(si));
  $("#buscar").tabIndex = si ? 0 : -1; $("#qClose").tabIndex = si ? 0 : -1;
  if (si) setTimeout(() => $("#buscar").focus(), 60);
}
function cerrarBusca() { $("#buscar").value = ""; filtrar(""); abrirBusca(false); }
$("#buscar").addEventListener("input", e => filtrar(plano(e.target.value.trim())));
$("#qClose").addEventListener("click", () => { cerrarBusca(); $("#goSearch").focus(); });
$("#goSearch").addEventListener("click", () => { if (!$("#busca").classList.contains("open")) abrirBusca(true); else if (!$("#buscar").value) abrirBusca(false); else $("#buscar").focus(); });
$("#buscar").addEventListener("blur", () => setTimeout(() => { if (!$("#buscar").value && document.activeElement !== $("#buscar")) abrirBusca(false); }, 180));
$("#buscar").addEventListener("keydown", e => { if (e.key === "Escape") cerrarBusca(); });
document.addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); abrirBusca(true); } });

/* La barra se vuelve azul cuando el header sale de vista */
const top_ = $("#top");
new IntersectionObserver(([en]) => top_.classList.toggle("solid", !en.isIntersecting), { rootMargin: "-76px 0px 0px 0px" }).observe($(".hero"));
</script>
